<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MSTR Campaign Command Deck</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
</head>
<body style="margin: 0; padding: 0; background-color: #0a0806;">

  <div id="mstr-app-root"></div>

  <script type="text/babel">
    // 🚨 CRITICAL BROWSER-SAFE ENGINE MAPS (Prevents silent CDN Initialization Crashes)
    const useState = React.useState;
    const useEffect = React.useEffect;
    const useMemo = React.useMemo;

    const colors = {
      bg: '#0a0806', panel: '#14100c', border: '#2a2520',
      text: '#d4c8b8', textDim: '#a89580', textMute: '#8a7a65', textFaint: '#5a5048',
      gold: '#d4a017', red: '#c73e1d', green: '#2d8659', highlight: '#e8dcc8',
    };
    const serif = 'Georgia, "Times New Roman", serif';

    const t = {
      eyebrow: { fontSize: '9px', letterSpacing: '0.15em', textTransform: 'uppercase', color: colors.textMute },
      meta:    { fontSize: '11px', color: colors.textDim },
      body:    { fontSize: '13px', color: colors.text, lineHeight: '1.55' },
      value:   { fontSize: '15px', color: colors.text, fontWeight: 600 },
      hero:    { fontSize: '28px', color: colors.highlight, fontWeight: 600, letterSpacing: '-0.01em' },
    };

    // Global client memory structure configuration
    window.storage = {
      get: async (key) => ({ value: localStorage.getItem(key) }),
      set: async (key, val) => localStorage.setItem(key, val)
    };

    function MSTRCycleTool() {
      // Core states
      const [mstrPrice, setMstrPrice] = useState(164.77);
      const [btcPrice, setBtcPrice] = useState(76900);
      const [ma200, setMa200] = useState(229.54);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [pasteText, setPasteText] = useState('');
      const [pasteResult, setPasteResult] = useState(null);

      // Technical parameters
      const [high20, setHigh20] = useState(197.00);
      const [low20, setLow20] = useState(162.02);
      const [high50, setHigh50] = useState(224.50);
      const [low50, setLow50] = useState(135.00);
      const [low200, setLow200] = useState(104.17);
      const [atr14, setAtr14] = useState(13.00);

      // System indicators
      const [nupl, setNupl] = useState(28);
      const [mvrv, setMvrv] = useState(1.4);
      const [fundingNegative, setFundingNegative] = useState(true);
      const [derivativesExhaustion, setDerivativesExhaustion] = useState(false);
      const [below200ma, setBelow200ma] = useState(true);
      const [weeklyLowerLow, setWeeklyLowerLow] = useState(false);
      const [dxyAbove110, setDxyAbove110] = useState(false);
      const [btcHoldings, setBtcHoldings] = useState(843738);
      const [dilutedShares, setDilutedShares] = useState(384.1);
      const [corporateBaseUpdated, setCorporateBaseUpdated] = useState('2026-05-18');
      const [startingShares, setStartingShares] = useState(200);
      const [cashBuffer, setCashBuffer] = useState(9958);  
      const [gbpUsd, setGbpUsd] = useState(1.27);       

      const [levelsAuto, setLevelsAuto] = useState(true);
      const [manualSellLow, setManualSellLow] = useState(192);
      const [manualSellHigh, setManualSellHigh] = useState(200);
      const [manualBuyLow, setManualBuyLow] = useState(170);
      const [manualBuyHigh, setManualBuyHigh] = useState(180);

      const [trades, setTrades] = useState([]);
      const [snapshots, setSnapshots] = useState([]);
      const [aggressionStyle, setAggressionStyle] = useState('moderate'); 
      const [positions, setPositions] = useState([]);
      const [positionForm, setPositionForm] = useState({ shares: '', entryPrice: '', stop: '', target: '', tag: 'MANUAL', notes: '' });
      const [exitPrices, setExitPrices] = useState({});
      const [view, setView] = useState('dashboard');
      const [tradeType, setTradeType] = useState('SELL');
      const [tradeShares, setTradeShares] = useState('');
      const [tradePrice, setTradePrice] = useState('');
      const [tradeDate, setTradeDate] = useState(new Date().toISOString().slice(0, 10));
      const [tradeFees, setTradeFees] = useState('');

      useEffect(() => {
        const load = async () => {
          try {
            const settings = await window.storage.get('mstr:settings');
            if (settings?.value) {
              const s = JSON.parse(settings.value);
              if (s.mstrPrice !== undefined) setMstrPrice(s.mstrPrice);
              if (s.btcPrice !== undefined) setBtcPrice(s.btcPrice);
              if (s.ma200 !== undefined) setMa200(s.ma200);
              if (s.lastUpdated !== undefined) setLastUpdated(s.lastUpdated);
              if (s.high20 !== undefined) setHigh20(s.high20);
              if (s.low20 !== undefined) setLow20(s.low20);
              if (s.high50 !== undefined) setHigh50(s.high50);
              if (s.low50 !== undefined) setLow50(s.low50);
              if (s.low200 !== undefined) setLow200(s.low200);
              if (s.atr14 !== undefined) setAtr14(s.atr14);
              if (s.nupl !== undefined) setNupl(s.nupl);
              if (s.mvrv !== undefined) setMvrv(s.mvrv);
              if (s.fundingNegative !== undefined) setFundingNegative(s.fundingNegative);
              if (s.derivativesExhaustion !== undefined) setDerivativesExhaustion(s.derivativesExhaustion);
              if (s.below200ma !== undefined) setBelow200ma(s.below200ma);
              if (s.weeklyLowerLow !== undefined) setWeeklyLowerLow(s.weeklyLowerLow);
              if (s.dxyAbove110 !== undefined) setDxyAbove110(s.dxyAbove110);
              if (s.btcHoldings !== undefined) setBtcHoldings(s.btcHoldings);
              if (s.dilutedShares !== undefined) setDilutedShares(s.dilutedShares);
              if (s.corporateBaseUpdated !== undefined) setCorporateBaseUpdated(s.corporateBaseUpdated);
              if (s.startingShares !== undefined) setStartingShares(s.startingShares);
              if (s.cashBuffer !== undefined) setCashBuffer(s.cashBuffer);
              if (s.gbpUsd !== undefined) setGbpUsd(s.gbpUsd);
              if (s.levelsAuto !== undefined) setLevelsAuto(s.levelsAuto);
              if (s.manualSellLow !== undefined) setManualSellLow(s.manualSellLow);
              if (s.manualSellHigh !== undefined) setManualSellHigh(s.manualSellHigh);
              if (s.manualBuyLow !== undefined) setManualBuyLow(s.manualBuyLow);
              if (s.manualBuyHigh !== undefined) setManualBuyHigh(s.manualBuyHigh);
              if (s.aggressionStyle !== undefined) setAggressionStyle(s.aggressionStyle);
            }
          } catch (e) {}
          try { const t = await window.storage.get('mstr:trades'); if (t?.value) setTrades(JSON.parse(t.value)); } catch (e) {}
          try { const sn = await window.storage.get('mstr:snapshots'); if (sn?.value) setSnapshots(JSON.parse(sn.value)); } catch (e) {}
          try { const pos = await window.storage.get('mstr:positions'); if (pos?.value) setPositions(JSON.parse(pos.value)); } catch (e) {}
        };
        load();
      }, []);

      useEffect(() => {
        const save = async () => {
          try {
            await window.storage.set('mstr:settings', JSON.stringify({
              mstrPrice, btcPrice, ma200, lastUpdated, high20, low20, high50, low50, low200, atr14, nupl, mvrv, fundingNegative, derivativesExhaustion, below200ma, weeklyLowerLow, dxyAbove110, btcHoldings, dilutedShares, corporateBaseUpdated, startingShares, cashBuffer, gbpUsd, levelsAuto, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh, aggressionStyle,
            }));
          } catch (e) {}
        };
        save();
      }, [mstrPrice, btcPrice, ma200, lastUpdated, high20, low20, high50, low50, low200, atr14, nupl, mvrv, fundingNegative, derivativesExhaustion, below200ma, weeklyLowerLow, dxyAbove110, btcHoldings, dilutedShares, corporateBaseUpdated, startingShares, cashBuffer, gbpUsd, levelsAuto, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh, aggressionStyle]);

      const handleHoldingsChange = (v) => { setBtcHoldings(v); setCorporateBaseUpdated(new Date().toISOString().slice(0, 10)); };
      const handleSharesChange = (v) => { setDilutedShares(v); setCorporateBaseUpdated(new Date().toISOString().slice(0, 10)); };

      const btcPerShare = useMemo(() => btcHoldings / (dilutedShares * 1_000_000), [btcHoldings, dilutedShares]);
      const fairValue = useMemo(() => btcPerShare * btcPrice, [btcPerShare, btcPrice]);
      const mNAV = useMemo(() => fairValue > 0 ? mstrPrice / fairValue : 0, [mstrPrice, fairValue]);

      const cycleData = useMemo(() => {
        const ath = new Date('2025-10-06'); const target = new Date('2026-10-06'); const now = new Date();
        const totalDays = Math.round((target - ath) / 86400000); const elapsed = Math.round((now - ath) / 86400000);
        return { totalDays, elapsed, remaining: Math.round((target - now) / 86400000), progress: Math.min(100, Math.max(0, (elapsed / totalDays) * 100)) };
      }, [lastUpdated]);

      const daysSinceBaseUpdate = useMemo(() => { if (!corporateBaseUpdated) return null; return Math.floor((new Date() - new Date(corporateBaseUpdated)) / 86400000); }, [corporateBaseUpdated, lastUpdated]);

      const profile = useMemo(() => {
        switch (aggressionStyle) {
          case 'conservative': return { label: 'Conservative', rotationSizePctLow: 15, rotationSizePctHigh: 20, bandWidthMult: 0.55, hoardSensitivity: 1.15, deployLadderSteepness: 0.9, note: 'Wider bands, smaller rotations, quicker to HOARD.' };
          case 'aggressive': return { label: 'Aggressive', rotationSizePctLow: 35, rotationSizePctHigh: 45, bandWidthMult: 0.28, hoardSensitivity: 0.85, deployLadderSteepness: 1.15, note: 'Tighter bands, larger rotations, holds ROTATE longer.' };
          default: return { label: 'Moderate (Base)', rotationSizePctLow: 25, rotationSizePctHigh: 30, bandWidthMult: 0.4, hoardSensitivity: 1.0, deployLadderSteepness: 1.0, note: 'Balanced — base case per the playbook.' };
        }
      }, [aggressionStyle]);

      const technicals = useMemo(() => { if (high20 === null || low20 === null || atr14 === null) return null; return { high20, low20, high50, low50, low200, atr14 }; }, [high20, low20, high50, low50, low200, atr14]);

      const dynamicLevels = useMemo(() => {
        if (!technicals) return null; const { high20, low20, atr14 } = technicals; const current = mstrPrice;
        const rotateSellTarget = Math.max(high20, current + atr14); const rotateBuyTarget = Math.min(low20, current - atr14); const bandWidth = atr14 * profile.bandWidthMult;
        const hoardBuyAnchor = ma200 ? ma200 * 0.85 : current - atr14 * 2; const hoardBuyDeep = ma200 ? ma200 * 0.75 : current - atr14 * 3;
        return {
          rotate: { sellLow: rotateSellTarget - bandWidth, sellHigh: rotateSellTarget + bandWidth, buyLow: rotateBuyTarget - bandWidth, buyHigh: rotateBuyTarget + bandWidth },
          hoard: { sellLow: current + atr14 * 0.5, sellHigh: Math.max(high20, current + atr14 * 1.5), buyTarget: current - (current - hoardBuyAnchor) / profile.hoardSensitivity, buyDeepTarget: current - (current - hoardBuyDeep) / profile.hoardSensitivity },
          deploy: { ladder: ma200 ? [{ level: current, pct: 25 }, { level: current - (current - ma200 * 0.85) * 0.5 * profile.deployLadderSteepness, pct: 25 }, { level: current - (current - ma200 * 0.85) * profile.deployLadderSteepness, pct: 25 }, { level: current - (current - ma200 * 0.65) * profile.deployLadderSteepness, pct: 25 }] : [{ level: current, pct: 25 }, { level: current * (1 - 0.10 * profile.deployLadderSteepness), pct: 25 }, { level: current * (1 - 0.20 * profile.deployLadderSteepness), pct: 25 }, { level: current * (1 - 0.30 * profile.deployLadderSteepness), pct: 25 }] },
        };
      }, [technicals, ma200, mstrPrice, profile]);

      const bearScore = useMemo(() => { let s = 0; if (btcPrice < 72500) s += 2; if (btcPrice < 60000) s += 2; if (nupl < 0) s += 2; if (mvrv < 1.0) s += 1; if (fundingNegative) s += 1; if (below200ma) s += 2; if (weeklyLowerLow) s += 1; if (dxyAbove110) s += 1; if (cycleData.remaining > 0 && cycleData.remaining < 180) s += 1; return s; }, [btcPrice, nupl, mvrv, fundingNegative, below200ma, weeklyLowerLow, dxyAbove110, cycleData]);
      const bottomScore = useMemo(() => { let s = 0; if (mstrPrice < 120) s += 2; if (mstrPrice < 90) s += 2; if (btcPrice < 55000) s += 2; if (btcPrice < 45000) s += 2; if (nupl < -25) s += 3; if (mvrv < 0.8) s += 3; if (derivativesExhaustion) s += 2; if (Math.abs(cycleData.remaining) < 60) s += 2; return s; }, [mstrPrice, btcPrice, nupl, mvrv, derivativesExhaustion, cycleData]);
      const mode = useMemo(() => { if (bottomScore >= 7 && mstrPrice < 140) return 'DEPLOY'; if (bearScore >= 6) return 'HOARD'; return 'ROTATE'; }, [bearScore, bottomScore, mstrPrice]);

      const currentLevels = useMemo(() => {
        if (!levelsAuto || !dynamicLevels) return { rotate: { sell: fmtRange(manualSellLow, manualSellHigh), buy: fmtRange(manualBuyLow, manualBuyHigh) }, hoard: { sell: fmtRange(manualSellLow, manualSellHigh), buy: `Wait — target ${fmt(manualBuyLow * 0.7)}` }, deploy: { sell: 'Do not sell', buy: 'Ladder every 10% drop' } }[mode.toLowerCase()];
        const d = dynamicLevels; return { rotate: { sell: fmtRange(d.rotate.sellLow, d.rotate.sellHigh), buy: fmtRange(d.rotate.buyLow, d.rotate.buyHigh) }, hoard: { sell: fmtRange(d.hoard.sellLow, d.hoard.sellHigh), buy: `Wait — target ${fmt(d.hoard.buyTarget)} / deep ${fmt(d.hoard.buyDeepTarget)}` }, deploy: { sell: 'Do not sell', buy: `Ladder: ${d.deploy.ladder.map(l => fmt(l.level)).join(' · ')}` } }[mode.toLowerCase()];
      }, [levelsAuto, dynamicLevels, mode, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh]);

      const alertLevels = useMemo(() => {
        if (!levelsAuto || !dynamicLevels) return { rotate: { sellAlert: manualSellLow, buyAlert: manualBuyHigh }, hoard: { sellAlert: manualSellLow, buyAlert: manualBuyLow * 0.7, buyDeepAlert: null }, deploy: { sellAlert: null, ladder: [] } };
        const d = dynamicLevels; return { rotate: { sellAlert: d.rotate.sellLow, buyAlert: d.rotate.buyHigh }, hoard: { sellAlert: d.hoard.sellLow, buyAlert: d.hoard.buyTarget, buyDeepAlert: d.hoard.buyDeepTarget }, deploy: { sellAlert: null, ladder: d.deploy.ladder.map(r => r.level) } };
      }, [levelsAuto, dynamicLevels, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh]);

      const modeCfg = {
        ROTATE: { label: 'NORMAL ROTATION', color: '#d4a017', bg: '#1a1611', action: 'Sell at resistance, buy back at support.', cash: '0–25%' },
        HOARD:  { label: 'CASH HOARD',      color: '#c73e1d', bg: '#1a0f0d', action: 'Sell at resistance. Do NOT buy back. Wait for deeper levels.', cash: '40–70%' },
        DEPLOY: { label: 'DEPLOY CASH',     color: '#2d8659', bg: '#0f1a13', action: 'Ladder cash into weakness. All-in accumulation.', cash: 'Deploying to 0%' },
      };
      const cfg = modeCfg[mode];
      const deploySuppressed = bottomScore >= 7 && mstrPrice >= 140;

      const bandHits = useMemo(() => {
        if (!dynamicLevels) return []; const hits = []; const d = dynamicLevels; const p = mstrPrice;
        if (mode === 'ROTATE') {
          if (p >= d.rotate.sellLow && p <= d.rotate.sellHigh) { hits.push({ tag: 'ROTATE-SELL', side: 'SELL', label: 'ROTATE sell zone hit', zone: `${fmt(d.rotate.sellLow)}–${fmt(d.rotate.sellHigh)}`, price: p }); }
          if (p >= d.rotate.buyLow && p <= d.rotate.buyHigh) { hits.push({ tag: 'ROTATE-BUY', side: 'BUY', label: 'ROTATE buy zone hit', zone: `${fmt(d.rotate.buyLow)}–${fmt(d.rotate.buyHigh)}`, price: p }); }
        }
        if (mode === 'HOARD') {
          if (p >= d.hoard.sellLow && p <= d.hoard.sellHigh) { hits.push({ tag: 'HOARD-SELL', side: 'SELL', label: 'HOARD sell zone hit', zone: `${fmt(d.hoard.sellLow)}–${fmt(d.hoard.sellHigh)}`, price: p }); }
          const t = d.hoard.buyTarget; if (p >= t * 0.985 && p <= t * 1.015) { hits.push({ tag: 'HOARD-BUY', side: 'BUY', label: 'HOARD buy target reached', zone: fmt(t), price: p }); }
          const dt = d.hoard.buyDeepTarget; if (p <= dt * 1.015) { hits.push({ tag: 'HOARD-BUY-DEEP', side: 'BUY', label: 'HOARD deep buy target reached', zone: fmt(dt), price: p }); }
        }
        if (mode === 'DEPLOY') { d.deploy.ladder.forEach((rung, i) => { if (p <= rung.level * 1.015) { hits.push({ tag: `DEPLOY-RUNG-${i + 1}`, side: 'BUY', label: `DEPLOY rung ${i + 1} live (${rung.pct}%)`, zone: fmt(rung.level), price: p }); } }); }
        return hits;
      }, [dynamicLevels, mstrPrice, mode]);

      const priceRange = useMemo(() => {
        if (!dynamicLevels) return null; const RED = '#c73e1d', GREEN = '#2d8659', GOLD = '#d4a017'; const p = mstrPrice; const d = dynamicLevels;
        if (mode === 'ROTATE') {
          const lo = d.rotate.buyLow; const hi = d.rotate.sellHigh; const span = hi - lo;
          return { pct: span > 0 ? Math.max(0, Math.min(1, (p - lo) / span)) : 0.5, verdict: p >= d.rotate.sellLow ? 'IN SELL ZONE' : p <= d.rotate.buyHigh ? 'IN BUY ZONE' : 'BETWEEN BANDS', tone: p >= d.rotate.sellLow ? RED : p <= d.rotate.buyHigh ? GREEN : GOLD, lo, hi, buyLow: d.rotate.buyLow, buyHigh: d.rotate.buyHigh, sellLow: d.rotate.sellLow, sellHigh: d.rotate.sellHigh };
        }
        if (mode === 'HOARD') {
          const target = d.hoard.buyTarget; const deep = d.hoard.buyDeepTarget; const pctToTarget = ((p / target) - 1) * 100;
          return { pct: null, verdict: p >= d.hoard.sellLow ? 'IN SELL ZONE' : p <= target * 1.015 ? 'AT BUY TARGET' : `${pctToTarget > 0 ? '+' : ''}${pctToTarget.toFixed(1)}% vs target`, tone: p >= d.hoard.sellLow ? RED : p <= target * 1.015 ? GREEN : GOLD, target, deep, sellLow: d.hoard.sellLow, sellHigh: d.hoard.sellHigh };
        }
        return { pct: null, verdict: d.deploy.ladder.filter(r => p <= r.level * 1.015).length > 0 ? `${d.deploy.ladder.filter(r => p <= r.level * 1.015).length}/4 RUNGS LIVE` : 'ABOVE LADDER', tone: GREEN, ladder: d.deploy.ladder };
      }, [dynamicLevels, mstrPrice, mode]);

      const journalStats = useMemo(() => {
        let currentShares = startingShares; let totalCash = 0; let rotationShares = 0; let completedRotations = 0; let openSell = null;
        const sorted = [...trades].sort((a, b) => a.date.localeCompare(b.date));
        sorted.forEach(t => {
          const gross = t.shares * t.price;
          if (t.type === 'SELL') { currentShares -= t.shares; totalCash += gross - (t.fees || 0); openSell = { shares: t.shares, price: t.price }; }
          else { currentShares += t.shares; totalCash -= gross + (t.fees || 0); if (openSell) { rotationShares += (t.shares - openSell.shares); completedRotations += 1; openSell = null; } }
        });
        return { currentShares, totalCash, sharesDelta: currentShares - startingShares, sharesPct: startingShares > 0 ? ((currentShares - startingShares) / startingShares) * 100 : 0, rotationShares, completedRotations, tradeCount: trades.length };
      }, [trades, startingShares]);

      const portfolio = useMemo(() => {
        const positionUSD = journalStats.currentShares * mstrPrice; const positionGBP = positionUSD / gbpUsd; const totalGBP = positionGBP + cashBuffer;
        return { positionUSD, positionGBP, totalGBP, cashPct: totalGBP > 0 ? (cashBuffer / totalGBP) * 100 : 0, positionPct: 100 - (totalGBP > 0 ? (cashBuffer / totalGBP) * 100 : 0) };
      }, [journalStats.currentShares, mstrPrice, gbpUsd, cashBuffer]);

      const claudePrompt = `Please web-search data and return values in code block.`;

      const applyPaste = () => {
        if (!pasteText.trim()) return;
        let text = pasteText.replace(/```[a-z]*\n?/gi, '').replace(/```/g, ''); const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
        for (const line of lines) {
          const m = line.match(/^([A-Za-z0-9_]+)\s*[:=]\s*(.+?)\s*$/); if (!m) continue;
          const key = m[1].toUpperCase(); const val = m[2].trim(); const numVal = parseFloat(val.replace(/[$,%]/g, '')); const boolVal = /^on$|^true$|^yes$|^1$/i.test(val);
          switch (key) {
            case 'MSTR_PRICE': if (!isNaN(numVal)) setMstrPrice(numVal); break;
            case 'MSTR_200MA': if (!isNaN(numVal)) setMa200(numVal); break;
            case 'MSTR_20D_HIGH': if (!isNaN(numVal)) setHigh20(numVal); break;
            case 'MSTR_20D_LOW': if (!isNaN(numVal)) setLow20(numVal); break;
            case 'MSTR_50D_HIGH': if (!isNaN(numVal)) setHigh50(numVal); break;
            case 'MSTR_50D_LOW': if (!isNaN(numVal)) setLow50(numVal); break;
            case 'MSTR_200D_LOW': if (!isNaN(numVal)) setLow200(numVal); break;
            case 'MSTR_ATR14': if (!isNaN(numVal)) setAtr14(numVal); break;
            case 'BTC_PRICE': if (!isNaN(numVal)) setBtcPrice(numVal); break;
            case 'NUPL': if (!isNaN(numVal)) setNupl(numVal); break;
            case 'MVRV': if (!isNaN(numVal)) setMvrv(numVal); break;
            case 'BTC_HOLDINGS': if (!isNaN(numVal)) handleHoldingsChange(numVal); break;
            case 'DILUTED_SHARES': if (!isNaN(numVal)) { const shares = numVal > 10000 ? numVal / 1000000 : numVal; handleSharesChange(shares); } break;
            case 'BELOW_200MA': setBelow200ma(boolVal); break;
            case 'WEEKLY_LL': setWeeklyLowerLow(boolVal); break;
            case 'SHORTING': setFundingNegative(boolVal); break;
            case 'EXHAUSTION': setDerivativesExhaustion(boolVal); break;
            case 'DXY_ABOVE_110': setDxyAbove110(boolVal); break;
          }
        }
        setLastUpdated(new Date().toISOString().slice(0, 10)); setPasteText('');
      };

      const saveSnapshot = () => { setSnapshots([...snapshots, { date: new Date().toISOString(), mstrPrice, btcPrice, nupl, mvrv, mNAV: Number(mNAV.toFixed(2)), bearScore, bottomScore, mode }]); };
      const addTrade = () => { if (!tradeShares || !tradePrice) return; setTrades([...trades, { id: Date.now(), date: tradeDate, type: tradeType, shares: parseFloat(tradeShares), price: parseFloat(tradePrice), fees: parseFloat(tradeFees) || 0 }]); setTradeShares(''); setTradePrice(''); };
      const openPosition = () => { if (!positionForm.shares || !positionForm.entryPrice) return; setPositions([...positions, { id: Date.now(), openedAt: new Date().toISOString(), shares: parseFloat(positionForm.shares), entryPrice: parseFloat(positionForm.entryPrice), stop: positionForm.stop ? parseFloat(positionForm.stop) : null, target: positionForm.target ? parseFloat(positionForm.target) : null, tag: positionForm.tag || 'MANUAL', notes: positionForm.notes || '', status: 'OPEN' }]); setPositionForm({ shares: '', entryPrice: '', stop: '', target: '', tag: 'MANUAL', notes: '' }); };
      const closePosition = (id, exitPrice) => { const pos = positions.find(p => p.id === id); if (!pos) return; setPositions(positions.map(p => p.id === id ? { ...p, status: 'CLOSED', closedAt: new Date().toISOString(), exitPrice: parseFloat(exitPrice) } : p)); setTrades([...trades, { id: Date.now(), date: new Date().toISOString().slice(0, 10), type: 'SELL', shares: pos.shares, price: parseFloat(exitPrice), fees: 0, fromPositionId: id }]); };
      const deleteTrade = (id) => setTrades(trades.filter(t => t.id !== id));
      const deletePosition = (id) => setPositions(positions.filter(p => p.id !== id));
      const deleteSnapshot = (date) => setSnapshots(snapshots.filter(s => s.date !== date));

      const NavButton = ({ id, label, secondary }) => (
        <button onClick={() => setView(id)} style={{
          background: view === id ? colors.panel : 'transparent', color: view === id ? colors.gold : (secondary ? colors.textMute : colors.textDim),
          border: `1px solid ${view === id ? colors.gold : colors.border}`, padding: secondary ? '5px 10px' : '8px 14px', fontFamily: serif, fontSize: secondary ? '10px' : '11px',
          letterSpacing: '0.1em', textTransform: 'uppercase', cursor: 'pointer', flex: 1, fontWeight: view === id ? 600 : 400, borderRadius: '2px'
        }}>{label}</button>
      );

      const staleColor = !daysSinceBaseUpdate && daysSinceBaseUpdate !== 0 ? colors.textFaint : daysSinceBaseUpdate > 60 ? colors.red : daysSinceBaseUpdate > 30 ? colors.gold : colors.textMute;

      return (
        <div style={{ minHeight: '100vh', background: `linear-gradient(180deg, ${colors.bg} 0%, ${colors.panel} 100%)`, padding: '24px 16px', fontFamily: serif, color: colors.text }}>
          <div style={{ maxWidth: '720px', margin: '0 auto' }}>
            <div style={{ marginBottom: '24px', borderBottom: `1px solid ${colors.border}`, paddingBottom: '20px' }}>
              <div style={t.eyebrow}>Cycle Decision Framework · v13.2</div>
              <h1 style={{ fontSize: '26px', color: colors.highlight, margin: '8px 0 0 0', fontStyle: 'italic', fontWeight: 400 }}>MSTR Rotation</h1>
              <div style={{ display: 'flex', gap: '20px', fontSize: '12px', marginTop: '12px', flexWrap: 'wrap' }}>
                <div><span style={{color:colors.textMute}}>BTC </span><span style={{color:colors.gold}}>${btcPrice.toLocaleString()}</span></div>
                <div><span style={{color:colors.textMute}}>MSTR </span><span style={{color:colors.gold}}>${mstrPrice.toFixed(2)}</span></div>
                <div><span style={{color:colors.textMute}}>200MA </span><span style={{color:colors.gold}}>{ma200 ? `$${ma200.toFixed(2)}` : '—'}</span></div>
                <div><span style={{color:colors.textMute}}>mNAV </span><span style={{color:colors.gold}}>{mNAV.toFixed(2)}x</span></div>
              </div>
            </div>

            <div style={{ marginBottom: '20px' }}>
              <div style={{ display: 'flex', gap: '6px', marginBottom: '6px' }}>
                <NavButton id="dashboard" label="Dashboard" />
                <NavButton id="positions" label={`Open · ${positions.filter(p=>p.status==='OPEN').length}`} />
                <NavButton id="journal" label={`Journal · ${trades.length}`} />
              </div>
              <div style={{ display: 'flex', gap: '6px' }}>
                <NavButton id="snapshots" label={`Log · ${snapshots.length}`} secondary />
                <NavButton id="backup" label="Backup" secondary />
              </div>
            </div>

            {view === 'dashboard' && (
              <>
                <div style={{ background: cfg.bg, border: `1px solid ${cfg.color}`, padding: '20px', borderRadius: '4px', marginBottom: '20px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '18px', gap: '16px', flexWrap: 'wrap' }}>
                    <div>
                      <div style={{ ...t.eyebrow, color: cfg.color }}>Active mode</div>
                      <div style={{ fontSize: '20px', color: cfg.color, fontWeight: 600, marginTop: '4px' }}>{cfg.label}</div>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div style={t.eyebrow}>MSTR Close</div>
                      <div style={{ ...t.hero, color: priceRange?.tone || colors.highlight }}>${mstrPrice.toFixed(2)}</div>
                      {priceRange?.verdict && <div style={{ ...t.eyebrow, color: priceRange.tone, marginTop: '4px', fontWeight: 600 }}>{priceRange.verdict}</div>}
                    </div>
                  </div>

                  {priceRange?.pct !== null && mode === 'ROTATE' && (
                    <div style={{ marginBottom: '18px' }}>
                      <div style={{ position: 'relative', height: '6px', background: '#0a0806', borderRadius: '3px', border: `1px solid ${colors.border}` }}>
                        <div style={{ position: 'absolute', left: `${priceRange.pct * 100}%`, top: '-3px', width: '2px', height: '12px', background: priceRange.tone }} />
                      </div>
                    </div>
                  )}

                  <div style={{ ...t.body, marginBottom: '18px' }}>{cfg.action}</div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '14px', paddingTop: '16px', borderTop: `1px solid ${colors.border}` }}>
                    <div>
                      <div style={t.eyebrow}>Sell zone</div>
                      <div style={t.value}>{currentLevels.sell}</div>
                      {alertLevels[mode.toLowerCase()]?.sellAlert && <div style={{ ...t.eyebrow, color: colors.gold, marginTop: '4px' }}>Alert ${alertLevels[mode.toLowerCase()].sellAlert.toFixed(2)}</div>}
                    </div>
                    <div>
                      <div style={t.eyebrow}>Buy zone</div>
                      <div style={t.value}>{currentLevels.buy}</div>
                      {mode === 'ROTATE' && alertLevels.rotate?.buyAlert && <div style={{ ...t.eyebrow, color: colors.gold, marginTop: '4px' }}>Alert ${alertLevels.rotate.buyAlert.toFixed(2)}</div>}
                      {mode === 'HOARD' && alertLevels.hoard?.buyAlert && <div style={{ ...t.eyebrow, color: colors.gold, marginTop: '4px' }}>Alert ${alertLevels.hoard.buyAlert.toFixed(2)}</div>}
                    </div>
                    <div>
                      <div style={t.eyebrow}>Cash hold</div>
                      <div style={t.value}>{cfg.cash}</div>
                    </div>
                  </div>

                  <div style={{ marginTop: '20px', paddingTop: '14px', borderTop: `1px solid ${colors.border}` }}>
                    <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                      {['conservative', 'moderate', 'aggressive'].map(s => (
                        <button key={s} onClick={() => setAggressionStyle(s)} style={{ background: aggressionStyle === s ? cfg.color : 'transparent', color: aggressionStyle === s ? '#000' : colors.textDim, border: `1px solid ${colors.border}`, padding: '4px 8px', fontSize: '10px', textTransform: 'uppercase', cursor: 'pointer', borderRadius: '2px' }}>{s.slice(0,3)}</button>
                      ))}
                    </div>
                  </div>
                </div>

                <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', borderRadius: '4px' }}>
                  <div style={t.value}>System Data Payload Upload</div>
                  <textarea value={pasteText} onChange={(e)=>setPasteText(e.target.value)} placeholder="Paste machine readout text block straight into here..." style={{ width: '100%', height: '100px', background: colors.bg, color: colors.text, border: `1px solid ${colors.border}`, marginTop: '8px', padding: '10px', boxSizing: 'border-box', fontFamily: 'monospace', fontSize: '11px' }} />
                  <button onClick={applyPaste} style={{ width: '100%', padding: '12px', background: colors.green, color: '#fff', border: 'none', fontWeight: 600, marginTop: '8px', cursor: 'pointer', letterSpacing: '0.05em' }}>APPLY TELEMETRY ARRAY</button>
                </div>
              </>
            )}

            {view === 'positions' && (
              <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', borderRadius: '4px' }}>
                <div style={{ fontSize: '11px', letterSpacing: '0.2em', color: colors.textDim, textTransform: 'uppercase', marginBottom: '16px', borderBottom: `1px solid ${colors.border}`, paddingBottom: '8px', fontFamily: serif }}>◆ Active Order Position Book</div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '14px' }}>
                  <input type="number" placeholder="Shares" value={positionForm.shares} onChange={(e)=>setPositionForm({...positionForm, shares:e.target.value})} style={{ background: colors.bg, color: colors.text, border: `1px solid ${colors.border}`, padding: '10px', fontFamily: serif }} />
                  <input type="number" placeholder="Entry Price" value={positionForm.entryPrice} onChange={(e)=>setPositionForm({...positionForm, entryPrice:e.target.value})} style={{ background: colors.bg, color: colors.text, border: `1px solid ${colors.border}`, padding: '10px', fontFamily: serif }} />
                </div>
                <button onClick={openPosition} style={{ width: '100%', padding: '12px', background: colors.gold, color: '#0a0806', border: 'none', fontWeight: 600, cursor: 'pointer' }}>INITIALIZE POSITION RECORD</button>
                
                <div style={{ marginTop: '20px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  {positions.map(p => p.status === 'OPEN' && (
                    <div key={p.id} style={{ padding: '12px', background: colors.bg, border: `1px solid ${colors.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <div style={t.body}>{p.shares} sh @ ${p.entryPrice.toFixed(2)} <span style={{fontSize:'10px', color:colors.textMute}}>({p.tag})</span></div>
                      <div style={{ display: 'flex', gap: '6px' }}>
                        <input type="number" placeholder="Exit Price" value={exitPrices[p.id] ?? ''} onChange={(e)=>setExitPrices({...exitPrices, [p.id]: e.target.value})} style={{ width: '80px', background: colors.panel, color: colors.text, border: `1px solid ${colors.border}`, padding: '4px' }} />
                        <button onClick={()=> { const v = exitPrices[p.id]; if(v) { closePosition(p.id, v); } else { closePosition(p.id, mstrPrice); } }} style={{ background: colors.red, color: '#fff', border: 'none', padding: '4px 10px', cursor: 'pointer', fontWeight: 600 }}>CLOSE</button>
                        <button onClick={()=>deletePosition(p.id)} style={{ background: 'transparent', border: `1px solid ${colors.border}`, color: colors.textMute, padding: '4px', cursor: 'pointer' }}>✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {view === 'journal' && (
              <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', borderRadius: '4px' }}>
                <div style={{ fontSize: '11px', letterSpacing: '0.2em', color: colors.textDim, textTransform: 'uppercase', marginBottom: '16px', borderBottom: `1px solid ${colors.border}`, paddingBottom: '8px', fontFamily: serif }}>◆ Trade Execution Journal</div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '14px' }}>
                  <input type="number" placeholder="Shares" value={tradeShares} onChange={(e)=>setTradeShares(e.target.value)} style={{ background: colors.bg, color: colors.text, border: `1px solid ${colors.border}`, padding: '10px' }} />
                  <input type="number" placeholder="Price" value={tradePrice} onChange={(e)=>setTradePrice(e.target.value)} style={{ background: colors.bg, color: colors.text, border: `1px solid ${colors.border}`, padding: '10px' }} />
                </div>
                <div style={{ display: 'flex', gap: '8px', marginBottom: '14px' }}>
                  <button onClick={()=>setTradeType('BUY')} style={{ flex: 1, padding: '10px', background: tradeType === 'BUY' ? colors.green : 'transparent', color: '#fff', border: `1px solid ${colors.green}` }}>BUY</button>
                  <button onClick={()=>setTradeType('SELL')} style={{ flex: 1, padding: '10px', background: tradeType === 'SELL' ? colors.red : 'transparent', color: '#fff', border: `1px solid ${colors.red}` }}>SELL</button>
                </div>
                <button onClick={addTrade} style={{ width: '100%', padding: '12px', background: colors.gold, color: '#000', border: 'none', fontWeight: 600 }}>LOG DIRECT JOURNAL TRANSACTION</button>

                <div style={{ marginTop: '20px' }}>
                  {[...trades].reverse().map(t => (
                    <div key={t.id} style={{ padding: '8px 0', borderBottom: `1px solid ${colors.border}`, display: 'flex', justifyContent: 'space-between', fontSize: '12px' }}>
                      <span style={{ color: t.type === 'SELL' ? colors.red : colors.green, fontWeight: 600 }}>{t.type}</span>
                      <span>{t.shares} sh</span>
                      <span style={{ color: colors.gold }}>${t.price}</span>
                      <button onClick={()=>deleteTrade(t.id)} style={{ background: 'transparent', border: 'none', color: colors.textFaint, cursor: 'pointer' }}>✕</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {view === 'snapshots' && (
              <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', borderRadius: '4px' }}>
                <div style={{ fontSize: '11px', letterSpacing: '0.2em', color: colors.textDim, textTransform: 'uppercase', marginBottom: '16px', borderBottom: `1px solid ${colors.border}`, paddingBottom: '8px', fontFamily: serif }}>◆ System Evolution Log</div>
                {[...snapshots].reverse().map((s, idx) => (
                  <div key={idx} style={{ padding: '10px 0', borderBottom: `1px solid ${colors.border}`, display: 'flex', justifyContent: 'space-between', fontSize: '12px' }}>
                    <span style={{ color: colors.textDim }}>{s.date}</span>
                    <span style={{ fontWeight: 600, color: colors.gold }}>{s.mode}</span>
                    <span>MSTR: ${s.mstrPrice}</span>
                    <span>mNAV: {s.mNAV}x</span>
                    <button onClick={()=>deleteSnapshot(s.date)} style={{ background: 'transparent', border: 'none', color: colors.textFaint, cursor: 'pointer' }}>✕</button>
                  </div>
                ))}
              </div>
            )}

            {view === 'backup' && (
              <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', borderRadius: '4px' }}>
                <div style={{ fontSize: '11px', letterSpacing: '0.2em', color: colors.textDim, textTransform: 'uppercase', marginBottom: '16px', borderBottom: `1px solid ${colors.border}`, paddingBottom: '8px', fontFamily: serif }}>◆ Portable Sovereign State Ledger</div>
                <button onClick={exportJSON} style={{ width: '100%', padding: '12px', background: colors.gold, color: '#000', border: 'none', fontWeight: 600, cursor: 'pointer' }}>EXPORT COMPACT SYSTEM TO CLIPBOARD</button>
                <textarea value={importText} onChange={(e)=>setImportText(e.target.value)} placeholder="Paste your exported configuration string here..." style={{ width: '100%', height: '120px', background: colors.bg, color: colors.text, border: `1px solid ${colors.border}`, marginTop: '16px', padding: '10px', boxSizing: 'border-box', fontFamily: 'monospace', fontSize: '10px' }} />
                <button onClick={importJSON} style={{ width: '100%', padding: '12px', background: colors.green, color: '#fff', border: 'none', marginTop: '8px', fontWeight: 600, cursor: 'pointer' }}>RESTORE IMPORT VECTOR</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // 🚨 STABLE REACT 18 INJECTION ROOT TRIGGER
    const root = ReactDOM.createRoot(document.getElementById('mstr-app-root'));
    root.render(React.createElement(MSTRCycleTool));
  </script>
</body>
</html>
