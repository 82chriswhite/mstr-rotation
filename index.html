              </div>
              <div style={{ background: colors.panel, padding: '16px', border: `1px solid ${colors.border}` }}>
                <div style={{ fontSize: '10px', color: colors.textMute, letterSpacing: '0.15em', textTransform: 'uppercase', marginBottom: '8px' }}>Bottom signals</div>
                <div style={{ fontSize: '28px', color: bottomScore >= 7 ? colors.green : colors.gold, fontWeight: 600 }}>{bottomScore}<span style={{ fontSize: '14px', color: colors.textFaint }}> / 19</span></div>
                <div style={{ fontSize: '10px', color: colors.textMute, marginTop: '4px' }}>≥7 + MSTR&lt;$140 → DEPLOY</div>
              </div>
            </div>

            {/* mNAV detail card — kept for the legacy fair-value view (BTC per share) */}
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '24px' }}>
              <SectionHeader>◆ Legacy NAV view (per-share)</SectionHeader>
              <div style={{ fontSize: '10px', color: colors.textMute, marginBottom: '14px', lineHeight: 1.5 }}>
                BTC-per-share fair value, ignoring debt + preferred. For the full EV-based mNAV used in scoring, see the On-chain &amp; corporate signals card above.
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', fontSize: '12px', marginBottom: '14px' }}>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>BTC per share</div><div style={{ color: colors.highlight, fontSize: '15px', marginTop: '2px' }}>{btcPerShare.toFixed(5)} BTC</div></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Fair value (BTC × per-share)</div><div style={{ color: colors.highlight, fontSize: '15px', marginTop: '2px' }}>${fairValue.toFixed(2)}</div></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Current price</div><div style={{ color: colors.highlight, fontSize: '15px', marginTop: '2px' }}>${mstrPrice.toFixed(2)}</div></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Legacy mNAV (market-cap)</div><div style={{ color: mNavTone(legacyMnav), fontSize: '15px', marginTop: '2px', fontWeight: 600 }}>{legacyMnav.toFixed(2)}x</div></div>
              </div>
              <div style={{ marginTop: '14px' }}>
                <NumberInput value={btcHoldings} onChange={handleHoldingsChange} step={100} label="BTC holdings" min={0} max={5000000} />
                <NumberInput value={dilutedShares} onChange={handleSharesChange} step={1} label="Diluted shares (M)" precision={1} min={1} max={2000} />
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '10px', fontSize: '10px' }}>
                <span style={{ color: staleColor }}>Base updated: {corporateBaseUpdated || 'never'}{daysSinceBaseUpdate !== null && ` · ${daysSinceBaseUpdate}d ago`}</span>
                <a href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001050446&type=8-K&dateb=&owner=include&count=40" target="_blank" rel="noopener noreferrer" style={{ color: colors.gold, textDecoration: 'none' }}>verify via SEC ↗</a>
              </div>
            </div>

            <button onClick={saveSnapshot} style={{ width: '100%', background: colors.panel, border: `1px solid ${colors.gold}`, color: colors.gold, padding: '12px', fontFamily: serif, fontSize: '12px', letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', marginBottom: '24px' }}>
              ◆ Save snapshot to log
            </button>

            <div style={{ marginBottom: '24px' }}>
              <SectionHeader>◆ Manual price override</SectionHeader>
              <NumberInput value={mstrPrice} onChange={setMstrPrice} step={1} label="MSTR price" suffix="USD" min={1} max={1000} />
              <NumberInput value={btcPrice} onChange={setBtcPrice} step={500} label="BTC price" suffix="USD" min={1000} max={500000} />
            </div>

            <div style={{ marginBottom: '24px' }}>
              <SectionHeader>◆ On-chain readings (update weekly)</SectionHeader>
              <NumberInput value={nupl} onChange={setNupl} step={1} label="BTC NUPL" suffix="%" min={-100} max={100} />
              <NumberInput value={mvrv} onChange={setMvrv} step={0.1} label="BTC MVRV" precision={1} min={0} max={10} />
            </div>

            <div style={{ marginBottom: '24px' }}>
              <SectionHeader>◆ Bear signals</SectionHeader>
              <SignalToggle value={below200ma} onChange={setBelow200ma} label={`MSTR below 200-day MA${ma200 ? ` ($${ma200.toFixed(2)})` : ''}`} helperUrl="https://www.tradingview.com/symbols/NASDAQ-MSTR/" />
              <SignalToggle value={weeklyLowerLow} onChange={setWeeklyLowerLow} label="MSTR weekly lower-low after lower-high" helperUrl="https://www.tradingview.com/chart/?symbol=NASDAQ%3AMSTR&interval=W" />
              <SignalToggle value={fundingNegative} onChange={(v) => { setFundingNegative(v); if (v) setDerivativesExhaustion(false); }} label="BTC perp funding persistently negative (aggressive shorting)" helperUrl="https://www.coinglass.com/FundingRate" />
              <SignalToggle value={dxyAbove110} onChange={setDxyAbove110} label="DXY above 110" helperUrl="https://www.tradingview.com/symbols/TVC-DXY/" />
              {/* v14: new bear signal toggles */}
              <SignalToggle value={btcBelowSthCost} onChange={setBtcBelowSthCost} label={`BTC below short-term holder cost basis${sthRealizedPrice ? ` ($${sthRealizedPrice.toLocaleString()})` : ''}`} helperUrl="https://studio.glassnode.com/charts/btc-sth-realized-price-mvrv" />
              <SignalToggle value={etfOutflowsPersistent} onChange={setEtfOutflowsPersistent} label={`Spot ETF outflows persistent${etfFlows5d !== null ? ` (5D: ${etfFlows5d >= 0 ? '+' : ''}$${etfFlows5d}M)` : ''}`} helperUrl="https://farside.co.uk/btc/" />
            </div>

            <div style={{ marginBottom: '24px' }}>
              <SectionHeader>◆ Bottom signals</SectionHeader>
              <SignalToggle value={derivativesExhaustion} onChange={(v) => { setDerivativesExhaustion(v); if (v) setFundingNegative(false); }} label="BTC derivatives exhaustion (funding flat + OI multi-month lows)" helperUrl="https://www.coinglass.com/BitcoinOpenInterest" bottomTone />
              {/* v14: mNAV compressed flag also feeds bottom score */}
              <SignalToggle value={mnavCompressed} onChange={(v) => { setMnavCompressed(v); if (v) setMnavEuphoric(false); }} label={`mNAV compressed below 1.05x${mNAV ? ` (now ${mNAV.toFixed(2)}x)` : ''}`} helperUrl="https://bitcoinquant.co/company/MSTR" bottomTone />
              <div style={{ fontSize: '10px', color: colors.textMute, lineHeight: 1.6, marginTop: '8px', paddingLeft: '14px' }}>Other bottom signals (extreme NUPL, MVRV, deep prices, cycle timing, BTC&lt;STH cost) score automatically.</div>
            </div>

            <div style={{ background: colors.panel, border: `1px solid ${colors.gold}`, padding: '20px', marginBottom: '24px' }}>
              <SectionHeader>◆ Prompt-driven update (3 steps)</SectionHeader>
              <div style={{ fontSize: '11px', color: colors.textDim, marginBottom: '12px', lineHeight: 1.6 }}>
                <strong style={{ color: colors.gold }}>Step 1:</strong> copy the prompt below. <strong style={{ color: colors.gold }}>Step 2:</strong> paste into a new Claude/Gemini chat, get the response. <strong style={{ color: colors.gold }}>Step 3:</strong> paste the response into the panel below — fields auto-populate.
              </div>
              <textarea readOnly value={claudePrompt} style={{ width: '100%', height: '220px', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '12px', fontFamily: 'Menlo, monospace', fontSize: '11px', resize: 'vertical', lineHeight: 1.5, boxSizing: 'border-box' }} />
              <button onClick={copyPrompt} style={{ width: '100%', marginTop: '10px', background: promptCopied ? colors.green : colors.gold, color: colors.bg, border: 'none', padding: '10px', fontFamily: serif, fontSize: '12px', letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', fontWeight: 600, transition: 'background 0.2s' }}>{promptCopied ? '✓ copied' : '◆ copy prompt'}</button>

              <div style={{ marginTop: '20px', paddingTop: '20px', borderTop: `1px solid ${colors.border}` }}>
                <div style={{ fontSize: '11px', letterSpacing: '0.15em', color: colors.textDim, textTransform: 'uppercase', marginBottom: '10px', fontFamily: serif }}>
                  ◆ Paste response here
                </div>
                <textarea
                  value={pasteText}
                  onChange={(e) => setPasteText(e.target.value)}
                  placeholder={`Paste the code block (or the whole response) here. Expected format:\n\nDATA_TIMESTAMP: 2026-05-20T13:45:00Z\nCONFIDENCE: HIGH\nSTALE_FIELDS: NONE\nMSTR_PRICE: 167\nBTC_PRICE: 77000\nMNAV: 1.09\n...`}
                  style={{ width: '100%', height: '140px', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '12px', fontFamily: 'Menlo, monospace', fontSize: '11px', resize: 'vertical', lineHeight: 1.5, boxSizing: 'border-box' }}
                />
                <button onClick={applyPaste} style={{ width: '100%', marginTop: '10px', background: colors.green, color: '#fff', border: 'none', padding: '10px', fontFamily: serif, fontSize: '12px', letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', fontWeight: 600 }}>
                  ◆ apply readings
                </button>
                {pasteResult && (
                  <div style={{
                    marginTop: '10px', fontSize: '11px', padding: '10px 12px',
                    background: pasteResult.ok ? '#0f1a13' : '#1a0f0d',
                    border: `1px dashed ${pasteResult.ok ? colors.green : colors.red}`,
                    color: pasteResult.ok ? colors.green : colors.red,
                    lineHeight: 1.5,
                  }}>
                    {pasteResult.ok ? '✓ ' : '⚠ '}{pasteResult.msg}
                  </div>
                )}
              </div>
            </div>
          </>
        )}

        {view === 'positions' && (
          <>
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '20px' }}>
              <SectionHeader>◆ Open new position</SectionHeader>
              <div style={{ fontSize: '11px', color: colors.textDim, marginBottom: '14px' }}>
                Positions track open trades separately from the closed-trade Journal. Closing a position auto-writes a paired entry into Journal so realised P&amp;L still flows through campaign stats.
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', fontSize: '11px', marginBottom: '12px' }}>
                <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Shares</div><input type="number" placeholder="Shares" value={positionForm.shares} onChange={(e) => setPositionForm({ ...positionForm, shares: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
                <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Entry price (USD)</div><input type="number" placeholder="Entry" value={positionForm.entryPrice} onChange={(e) => setPositionForm({ ...positionForm, entryPrice: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
                <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Stop (optional)</div><input type="number" placeholder="Stop" value={positionForm.stop} onChange={(e) => setPositionForm({ ...positionForm, stop: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
                <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Target (optional)</div><input type="number" placeholder="Target" value={positionForm.target} onChange={(e) => setPositionForm({ ...positionForm, target: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
                <div style={{ gridColumn: 'span 2' }}><div style={{ color: colors.textMute, marginBottom: '4px' }}>Tag / origin</div><input type="text" placeholder="e.g. ROTATE-BUY, HOARD-SELL, MANUAL" value={positionForm.tag} onChange={(e) => setPositionForm({ ...positionForm, tag: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
                <div style={{ gridColumn: 'span 2' }}><div style={{ color: colors.textMute, marginBottom: '4px' }}>Notes</div><input type="text" placeholder="Optional notes" value={positionForm.notes} onChange={(e) => setPositionForm({ ...positionForm, notes: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
              </div>
              <button onClick={() => openPosition()} disabled={!positionForm.shares || !positionForm.entryPrice} style={{ width: '100%', background: positionForm.shares && positionForm.entryPrice ? colors.green : colors.border, color: '#fff', border: 'none', padding: '10px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.15em', cursor: positionForm.shares && positionForm.entryPrice ? 'pointer' : 'not-allowed' }}>
                OPEN POSITION
              </button>
            </div>

            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px' }}>
              <SectionHeader>◆ Positions ({positions.filter(p => p.status === 'OPEN').length} open · {positions.filter(p => p.status === 'CLOSED').length} closed)</SectionHeader>
              {positions.length === 0 ? (
                <div style={{ color: colors.textFaint, fontSize: '12px', textAlign: 'center', padding: '20px 0' }}>No positions yet. Open one above, or tap OPEN on a live trigger from the Dashboard.</div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  {[...positions].sort((a, b) => (b.openedAt || '').localeCompare(a.openedAt || '')).map(p => {
                    const isOpen = p.status === 'OPEN';
                    const livePnL = isOpen ? (mstrPrice - p.entryPrice) * p.shares : (p.exitPrice - p.entryPrice) * p.shares - (p.exitFees || 0);
                    const livePnLPct = isOpen ? ((mstrPrice / p.entryPrice) - 1) * 100 : ((p.exitPrice / p.entryPrice) - 1) * 100;
                    const pnlColor = livePnL >= 0 ? colors.green : colors.red;
                    return (
                      <div key={p.id} style={{ background: colors.bg, border: `1px solid ${isOpen ? colors.border : '#222'}`, padding: '12px', opacity: isOpen ? 1 : 0.65 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '8px', gap: '8px', flexWrap: 'wrap' }}>
                          <div>
                            <span style={{ fontSize: '10px', color: isOpen ? colors.green : colors.textMute, letterSpacing: '0.15em', textTransform: 'uppercase' }}>{p.status}</span>
                            <span style={{ fontSize: '10px', color: colors.textMute, marginLeft: '8px', letterSpacing: '0.1em' }}>{p.tag}</span>
                          </div>
                          <div style={{ fontSize: '10px', color: colors.textFaint }}>{(p.openedAt || '').slice(0, 10)}</div>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', fontSize: '11px', marginBottom: '8px' }}>
                          <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Shares</div><div style={{ color: colors.text, fontWeight: 600 }}>{p.shares}</div></div>
                          <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Entry</div><div style={{ color: colors.text, fontWeight: 600 }}>${p.entryPrice.toFixed(2)}</div></div>
                          <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>{isOpen ? 'Live' : 'Exit'}</div><div style={{ color: pnlColor, fontWeight: 600 }}>{isOpen ? `$${mstrPrice.toFixed(2)}` : `$${p.exitPrice.toFixed(2)}`}</div></div>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '11px', marginBottom: isOpen ? '10px' : 0 }}>
                          <div style={{ color: colors.textMute }}>
                            {p.stop ? `Stop $${p.stop}` : '—'} · {p.target ? `Target $${p.target}` : '—'}
                          </div>
                          <div style={{ color: pnlColor, fontWeight: 600 }}>
                            {livePnL >= 0 ? '+' : ''}${livePnL.toFixed(0)} ({livePnLPct >= 0 ? '+' : ''}{livePnLPct.toFixed(1)}%)
                          </div>
                        </div>
                        {p.notes && <div style={{ fontSize: '10px', color: colors.textFaint, fontStyle: 'italic', marginBottom: isOpen ? '10px' : 0 }}>{p.notes}</div>}
                        {isOpen && (
                          <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                            <input
                              type="number"
                              placeholder="Exit price"
                              value={exitPrices[p.id] ?? ''}
                              onChange={(e) => setExitPrices(prev => ({ ...prev, [p.id]: e.target.value }))}
                              style={{ flex: 1, background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '6px 8px', fontFamily: serif, fontSize: '11px', borderRadius: '2px' }}
                            />
                            <button
                              onClick={() => {
                                const v = exitPrices[p.id];
                                if (v && !isNaN(parseFloat(v))) {
                                  closePosition(p.id, v, 0);
                                  setExitPrices(prev => { const next = { ...prev }; delete next[p.id]; return next; });
                                }
                              }}
                              disabled={!exitPrices[p.id]}
                              style={{
                                background: exitPrices[p.id] ? colors.red : colors.border,
                                color: '#fff', border: 'none', padding: '6px 12px',
                                fontFamily: serif, fontSize: '10px', letterSpacing: '0.1em',
                                cursor: exitPrices[p.id] ? 'pointer' : 'not-allowed', borderRadius: '2px', fontWeight: 600,
                              }}>CLOSE</button>
                            <button onClick={() => deletePosition(p.id)} style={{ background: 'transparent', border: `1px solid ${colors.border}`, color: colors.textMute, padding: '6px 10px', fontFamily: serif, fontSize: '10px', cursor: 'pointer', borderRadius: '2px' }}>✕</button>
                          </div>
                        )}
                        {!isOpen && (
                          <div style={{ marginTop: '8px', display: 'flex', justifyContent: 'flex-end' }}>
                            <button onClick={() => deletePosition(p.id)} style={{ background: 'transparent', border: `1px solid ${colors.border}`, color: colors.textMute, padding: '4px 8px', fontFamily: serif, fontSize: '9px', cursor: 'pointer' }}>DELETE</button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </>
        )}

        {view === 'backup' && (
          <>
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '20px' }}>
              <SectionHeader>◆ Export state</SectionHeader>
              <div style={{ fontSize: '11px', color: colors.textDim, marginBottom: '14px', lineHeight: 1.6 }}>
                Full JSON snapshot — settings, trades, positions, snapshots. State auto-persists in this browser's local storage; export is your portable backup, useful for moving between devices or as a periodic safety copy.
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                <button onClick={exportJSONFile} style={{ background: colors.gold, color: '#000', border: 'none', padding: '10px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.15em', cursor: 'pointer', borderRadius: '2px', fontWeight: 600 }}>DOWNLOAD .JSON</button>
                <button onClick={exportJSON} style={{ background: 'transparent', color: colors.gold, border: `1px solid ${colors.gold}`, padding: '10px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.15em', cursor: 'pointer', borderRadius: '2px' }}>COPY TO CLIPBOARD</button>
              </div>
              {importResult?.payload && (
                <textarea readOnly value={importResult.payload} style={{ width: '100%', marginTop: '12px', height: '160px', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: 'monospace', fontSize: '10px' }} />
              )}
            </div>
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px' }}>
              <SectionHeader>◆ Import state</SectionHeader>
              <div style={{ fontSize: '11px', color: colors.textDim, marginBottom: '14px', lineHeight: 1.6 }}>
                Upload a previously-downloaded <code style={{ background: colors.bg, padding: '1px 4px', fontSize: '10px' }}>.json</code> file, or paste the payload manually. Overwrites trades, positions, snapshots, and settings.
              </div>
              <label style={{ display: 'block', marginBottom: '12px' }}>
                <span style={{ display: 'inline-block', background: 'transparent', color: colors.textDim, border: `1px dashed ${colors.border}`, padding: '8px 14px', fontFamily: serif, fontSize: '10px', letterSpacing: '0.1em', cursor: 'pointer', borderRadius: '2px', textTransform: 'uppercase' }}>
                  Choose .json file
                </span>
                <input type="file" accept="application/json,.json" onChange={(e) => importJSONFile(e.target.files?.[0])} style={{ display: 'none' }} />
              </label>
              <textarea value={importText} onChange={(e) => setImportText(e.target.value)} placeholder='{"version":14.1,...}' style={{ width: '100%', height: '140px', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: 'monospace', fontSize: '10px', marginBottom: '12px' }} />
              <button onClick={importJSON} disabled={!importText.trim()} style={{ width: '100%', background: importText.trim() ? colors.green : colors.border, color: '#fff', border: 'none', padding: '10px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.15em', cursor: importText.trim() ? 'pointer' : 'not-allowed', borderRadius: '2px', fontWeight: 600 }}>IMPORT JSON</button>
              {importResult && (
                <div style={{ marginTop: '12px', fontSize: '11px', color: importResult.ok ? colors.green : colors.red, padding: '8px 12px', border: `1px dashed ${importResult.ok ? colors.green : colors.red}` }}>
                  {importResult.ok ? '✓ ' : '⚠ '}{importResult.msg}
                </div>
              )}
            </div>
          </>
        )}

        {view === 'journal' && (
          <>
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '20px' }}>
              <SectionHeader>◆ Campaign progress</SectionHeader>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', fontSize: '12px', marginBottom: '16px' }}>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Starting shares</div><input type="number" value={startingShares} onChange={(e) => setStartingShares(Number(e.target.value))} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.highlight, padding: '6px 10px', fontFamily: serif, fontSize: '15px', marginTop: '4px' }} /></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Current shares</div><div style={{ color: colors.highlight, fontSize: '20px', marginTop: '4px', fontWeight: 600 }}>{journalStats.currentShares.toFixed(0)}</div></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Δ shares</div><div style={{ color: journalStats.sharesDelta >= 0 ? colors.green : colors.red, fontSize: '20px', marginTop: '4px', fontWeight: 600 }}>{journalStats.sharesDelta >= 0 ? '+' : ''}{journalStats.sharesDelta.toFixed(0)} ({journalStats.sharesPct.toFixed(1)}%)</div></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Net cash flow</div><div style={{ color: colors.highlight, fontSize: '15px', marginTop: '4px' }}>${journalStats.totalCash.toFixed(0)}</div></div>
              </div>
              <div style={{ paddingTop: '14px', borderTop: `1px solid ${colors.border}` }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', fontSize: '12px' }}>
                  <div>
                    <div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Rotation shares</div>
                    <div style={{ color: journalStats.rotationShares >= 0 ? colors.green : colors.red, fontSize: '20px', marginTop: '4px', fontWeight: 600 }}>
                      {journalStats.rotationShares >= 0 ? '+' : ''}{journalStats.rotationShares.toFixed(0)}
                    </div>
                    <div style={{ color: colors.textMute, fontSize: '10px', marginTop: '2px' }}>from {journalStats.completedRotations} completed rotation{journalStats.completedRotations !== 1 ? 's' : ''}</div>
                  </div>
                  <div>
                    <div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Avg per rotation</div>
                    <div style={{ color: colors.highlight, fontSize: '20px', marginTop: '4px', fontWeight: 600 }}>
                      {journalStats.completedRotations > 0 ? `+${(journalStats.rotationShares / journalStats.completedRotations).toFixed(1)}` : '—'}
                    </div>
                    <div style={{ color: colors.textMute, fontSize: '10px', marginTop: '2px' }}>shares per cycle</div>
                  </div>
                </div>
                <div style={{ fontSize: '10px', color: colors.textMute, marginTop: '12px', lineHeight: 1.5, fontStyle: 'italic' }}>
                  Rotation shares = cumulative SELL→BUY pair differences. Pairs match each SELL with the next BUY. Direct buys (no preceding SELL) count as accumulation, not rotation.
                </div>
              </div>
            </div>

            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '20px' }}>
              <SectionHeader>◆ Add trade</SectionHeader>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '12px' }}>
                <div style={{ display: 'flex', gap: '8px' }}>
                  <button onClick={() => setTradeType('SELL')} style={{ flex: 1, background: tradeType === 'SELL' ? colors.red : 'transparent', color: tradeType === 'SELL' ? '#fff' : colors.textDim, border: `1px solid ${tradeType === 'SELL' ? colors.red : colors.border}`, padding: '8px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.1em', cursor: 'pointer' }}>SELL</button>
                  <button onClick={() => setTradeType('BUY')} style={{ flex: 1, background: tradeType === 'BUY' ? colors.green : 'transparent', color: tradeType === 'BUY' ? '#fff' : colors.textDim, border: `1px solid ${tradeType === 'BUY' ? colors.green : colors.border}`, padding: '8px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.1em', cursor: 'pointer' }}>BUY</button>
                </div>
                <input type="date" value={tradeDate} onChange={(e) => setTradeDate(e.target.value)} style={{ background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} />
                <input type="number" placeholder="Shares" value={tradeShares} onChange={(e) => setTradeShares(e.target.value)} style={{ background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} />
                <input type="number" placeholder="Price (USD)" value={tradePrice} onChange={(e) => setTradePrice(e.target.value)} style={{ background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} />
                <input type="number" placeholder="Fees (USD, optional)" value={tradeFees} onChange={(e) => setTradeFees(e.target.value)} style={{ gridColumn: 'span 2', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} />
              </div>
              <button onClick={addTrade} style={{ width: '100%', background: colors.gold, color: colors.bg, border: 'none', padding: '10px', fontFamily: serif, fontSize: '12px', letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', fontWeight: 600 }}>+ Log trade</button>
            </div>

            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px' }}>
              <SectionHeader>◆ Trade history</SectionHeader>
              {trades.length === 0 ? <div style={{ color: colors.textFaint, fontSize: '12px', textAlign: 'center', padding: '20px 0' }}>No trades logged yet.</div>
                : [...trades].sort((a, b) => b.date.localeCompare(a.date)).map(t => (
                  <div key={t.id} style={{ display: 'grid', gridTemplateColumns: '60px 1fr 1fr 1fr 30px', gap: '10px', padding: '10px 0', borderBottom: `1px solid ${colors.border}`, fontSize: '12px', alignItems: 'center' }}>
                    <span style={{ color: t.type === 'SELL' ? colors.red : colors.green, fontWeight: 600, letterSpacing: '0.1em', fontSize: '10px' }}>{t.type}</span>
                    <span style={{ color: colors.textDim }}>{t.date}</span>
                    <span style={{ color: colors.text }}>{t.shares} sh</span>
                    <span style={{ color: colors.gold }}>${t.price}</span>
                    <button onClick={() => deleteTrade(t.id)} style={{ background: 'transparent', border: 'none', color: colors.textFaint, cursor: 'pointer', fontSize: '14px' }}>×</button>
                  </div>
                ))}
            </div>
          </>
        )}

        {view === 'snapshots' && (
          <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px' }}>
            <SectionHeader>◆ Signal evolution log</SectionHeader>
            <div style={{ fontSize: '11px', color: colors.textDim, marginBottom: '16px', lineHeight: 1.6 }}>Save weekly snapshots. Trends matter more than any single reading.</div>
            {snapshots.length === 0 ? <div style={{ color: colors.textFaint, fontSize: '12px', textAlign: 'center', padding: '20px 0' }}>No snapshots saved yet.</div>
              : [...snapshots].reverse().map((s) => (
                <div key={s.date} style={{ padding: '12px 0', borderBottom: `1px solid ${colors.border}`, fontSize: '11px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                    <span style={{ color: colors.textDim }}>{new Date(s.date).toLocaleDateString()} {new Date(s.date).toLocaleTimeString().slice(0,5)}</span>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                      <span style={{ color: modeCfg[s.mode]?.color || colors.gold, fontWeight: 600, fontSize: '10px', letterSpacing: '0.1em' }}>{s.mode}</span>
                      <button onClick={() => deleteSnapshot(s.date)} style={{ background: 'transparent', border: 'none', color: colors.textFaint, cursor: 'pointer', fontSize: '14px' }}>×</button>
                    </div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '8px', color: colors.textMute, fontSize: '10px' }}>
                    <span>MSTR ${s.mstrPrice?.toFixed(0)}</span>
                    <span>BTC ${(s.btcPrice/1000).toFixed(0)}k</span>
                    <span>mNAV {s.mNAV}x</span>
                    <span>Bear {s.bearScore}</span>
                    <span>Bottom {s.bottomScore}</span>
                  </div>
                  {/* v14: show new readings on snapshots that have them */}
                  {(s.etfFlows5d !== undefined || s.btcBelowSthCost !== undefined) && (
                    <div style={{ display: 'flex', gap: '12px', marginTop: '4px', color: colors.textFaint, fontSize: '9px', letterSpacing: '0.05em' }}>
                      {s.etfFlows5d !== undefined && s.etfFlows5d !== null && <span>ETF 5D {s.etfFlows5d >= 0 ? '+' : ''}${s.etfFlows5d}M</span>}
                      {s.btcBelowSthCost && <span style={{ color: colors.red }}>BTC&lt;STH</span>}
                      {s.etfOutflowsPersistent && <span style={{ color: colors.red }}>ETF out</span>}
                    </div>
                  )}
                </div>
              ))}
          </div>
        )}

        <div style={{ textAlign: 'center', marginTop: '32px', fontSize: '10px', color: colors.textFaint, letterSpacing: '0.15em' }}>
          NOT FINANCIAL ADVICE · YOUR THESIS · YOUR CONVICTION · YOUR DECISION
        </div>
      </div>
    </div>
  );
}

function App() {
  const [unlocked, setUnlocked] = useState(() => {
    if (!AUTH_REQUIRED) return true;
    try { return sessionStorage.getItem(AUTH_SESSION_KEY) === '1'; } catch (e) { return false; }
  });

  if (!unlocked) return <Gate onUnlock={() => setUnlocked(true)} />;
  return <MSTRCycleTool />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
