<!--
  =================================================================
  MSTR CYCLE DECISION FRAMEWORK · v13.2 (web build)
  =================================================================

  CHANGING THE PASSWORD
  ---------------------
  Default password is "mstr". To change it:
  1. Open this page in a browser.
  2. Open DevTools (F12) and paste into the Console:

       (async () => {
         const buf = await crypto.subtle.digest(
           'SHA-256',
           new TextEncoder().encode('YOUR_NEW_PASSWORD')
         );
         console.log(Array.from(new Uint8Array(buf))
           .map(b => b.toString(16).padStart(2, '0')).join(''));
       })();

  3. Copy the printed hex string and replace the value of
     PASSWORD_HASH below.
  4. Commit + push to GitHub. The new password is live.

  SECURITY HONESTY
  ----------------
  This is a CASUAL barrier, not real authentication. Anyone who
  opens DevTools can read PASSWORD_HASH and brute-force it offline,
  or simply edit AUTH_REQUIRED below to false. It stops random
  passers-by who stumble on the URL. It does not stop a determined
  attacker. Do not paste anything genuinely sensitive into this tool.

  STORAGE
  -------
  Trades, positions, snapshots, settings all live in this browser's
  localStorage. They are private to your browser and do not leave
  this device unless you explicitly use Backup → Download .json.
  Different browsers / devices = different stores; sync them via
  the JSON export/import flow.
-->

<script>
  // === GATE CONFIG ============================================
  // SHA-256 of the default password "mstr". Replace per the
  // instructions above to change.
  const PASSWORD_HASH = '021ab4d101785587d5ddc3e3715150393924c9df228cb6732c40da48a6cfc7c4';
  const AUTH_REQUIRED = true;
  const AUTH_SESSION_KEY = 'mstr:auth';
  // ============================================================

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function tryUnlock(input) {
    const h = await sha256Hex(input);
    return h === PASSWORD_HASH;
  }
</script>

<style>
  /* Browser reset + base */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0806; color: #d4c8b8; -webkit-font-smoothing: antialiased; }
  body { font-family: Georgia, "Times New Roman", serif; min-height: 100vh; min-height: 100dvh; }
  input, button, textarea { font-family: inherit; }
  /* Removes Safari's default ugly input styling on mobile */
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  /* Loading state before React mounts */
  #loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; color: #8a7a65; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; }
  /* Gate */
  .gate { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 24px; }
  .gate-card { background: #14100c; border: 1px solid #2a2520; padding: 32px; max-width: 360px; width: 100%; border-radius: 3px; }
  .gate-title { font-size: 14px; color: #d4a017; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
  .gate-sub { font-size: 11px; color: #8a7a65; margin-bottom: 24px; }
  .gate-input { width: 100%; background: #0a0806; border: 1px solid #2a2520; color: #d4c8b8; padding: 10px 12px; font-size: 14px; letter-spacing: 0.05em; margin-bottom: 12px; border-radius: 2px; outline: none; }
  .gate-input:focus { border-color: #d4a017; }
  .gate-btn { width: 100%; background: #d4a017; color: #000; border: none; padding: 11px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; border-radius: 2px; font-weight: 600; }
  .gate-btn:disabled { background: #2a2520; color: #5a5048; cursor: not-allowed; }
  .gate-err { font-size: 11px; color: #c73e1d; margin-top: 10px; min-height: 14px; }
</style>

<body>
<div id="root"><div id="loading">Loading…</div></div>

<!-- React via CDN, no build step required -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// =====================================================================
// GATE COMPONENT
// =====================================================================
function Gate({ onUnlock }) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    if (!pw) return;
    setBusy(true); setErr('');
    const ok = await tryUnlock(pw);
    setBusy(false);
    if (ok) {
      try { sessionStorage.setItem(AUTH_SESSION_KEY, '1'); } catch (e) {}
      onUnlock();
    } else {
      setErr('Incorrect password.');
      setPw('');
    }
  };

  return (
    <div className="gate">
      <div className="gate-card">
        <div className="gate-title">MSTR Cycle Tool</div>
        <div className="gate-sub">Enter password to continue.</div>
        <input
          type="password" className="gate-input" autoFocus
          value={pw}
          onChange={(e) => setPw(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
          placeholder="Password"
        />
        <button className="gate-btn" onClick={submit} disabled={busy || !pw}>
          {busy ? 'Checking…' : 'Unlock'}
        </button>
        <div className="gate-err">{err}</div>
      </div>
    </div>
  );
}

// =====================================================================
// MAIN TOOL COMPONENT (ported from artifact)
// =====================================================================


function MSTRCycleTool() {
  // ============ CORE PRICE STATE (prompt-driven) ============
  const [mstrPrice, setMstrPrice] = useState(187);
  const [btcPrice, setBtcPrice] = useState(80000);
  const [ma200, setMa200] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null); // when prompt-data was last applied
  const [pasteText, setPasteText] = useState('');
  const [pasteResult, setPasteResult] = useState(null);

  // ============ TECHNICAL LEVELS (prompt-driven) ============
  const [high20, setHigh20] = useState(null);
  const [low20, setLow20] = useState(null);
  const [high50, setHigh50] = useState(null);
  const [low50, setLow50] = useState(null);
  const [low200, setLow200] = useState(null);
  const [atr14, setAtr14] = useState(null);

  // ============ STRATEGY STATE (persisted) ============
  const [nupl, setNupl] = useState(19);
  const [mvrv, setMvrv] = useState(1.4);
  const [fundingNegative, setFundingNegative] = useState(false);
  const [derivativesExhaustion, setDerivativesExhaustion] = useState(false);
  const [below200ma, setBelow200ma] = useState(false);
  const [weeklyLowerLow, setWeeklyLowerLow] = useState(false);
  const [dxyAbove110, setDxyAbove110] = useState(false);
  const [btcHoldings, setBtcHoldings] = useState(818869);
  const [dilutedShares, setDilutedShares] = useState(280);
  const [corporateBaseUpdated, setCorporateBaseUpdated] = useState(null);
  const [startingShares, setStartingShares] = useState(211);
  const [cashBuffer, setCashBuffer] = useState(0);  // GBP — uncommitted cash in SIPP
  const [gbpUsd, setGbpUsd] = useState(1.27);       // for displaying GBP totals

  // Level overrides (persisted)
  const [levelsAuto, setLevelsAuto] = useState(true);
  const [manualSellLow, setManualSellLow] = useState(192);
  const [manualSellHigh, setManualSellHigh] = useState(200);
  const [manualBuyLow, setManualBuyLow] = useState(170);
  const [manualBuyHigh, setManualBuyHigh] = useState(180);

  // Journal/snapshots
  const [trades, setTrades] = useState([]);
  const [snapshots, setSnapshots] = useState([]);

  // ============ AGGRESSION PROFILE (persisted) ============
  // Scales rotation sizing, band width, HOARD entry sensitivity, and DEPLOY ladder steepness.
  const [aggressionStyle, setAggressionStyle] = useState('moderate'); // 'conservative' | 'moderate' | 'aggressive'

  // ============ ACTIVE POSITIONS (persisted) ============
  // Open trades being tracked. Closing one writes a CLOSED entry to `trades`.
  const [positions, setPositions] = useState([]);
  const [positionForm, setPositionForm] = useState({ shares: '', entryPrice: '', stop: '', target: '', tag: 'MANUAL', notes: '' });
  // Per-position controlled inputs for the close-price field; keyed by position id.
  const [exitPrices, setExitPrices] = useState({});
  const [view, setView] = useState('dashboard');
  const [tradeType, setTradeType] = useState('SELL');
  const [tradeShares, setTradeShares] = useState('');
  const [tradePrice, setTradePrice] = useState('');
  const [tradeDate, setTradeDate] = useState(new Date().toISOString().slice(0, 10));
  const [tradeFees, setTradeFees] = useState('');
  const [promptCopied, setPromptCopied] = useState(false);

  // ============ LOAD/PERSIST ============
  useEffect(() => {
    const load = async () => {
      try {
        const settings = ({ value: localStorage.getItem('mstr:settings') });
        if (settings?.value) {
          const s = JSON.parse(settings.value);
          if (s.mstrPrice !== undefined) setMstrPrice(s.mstrPrice);
          if (s.btcPrice !== undefined) setBtcPrice(s.btcPrice);
          if (s.ma200 !== undefined) setMa200(s.ma200);
          if (s.lastUpdated !== undefined) setLastUpdated(s.lastUpdated);
          if (s.high20 !== undefined) setHigh20(s.high20);
          if (s.low20 !== undefined) setLow20(s.low20);
          if (s.high50 !== undefined) setHigh50(s.high50);
          if (s.low50 !== undefined) setLow50(s.low50);
          if (s.low200 !== undefined) setLow200(s.low200);
          if (s.atr14 !== undefined) setAtr14(s.atr14);
          if (s.nupl !== undefined) setNupl(s.nupl);
          if (s.mvrv !== undefined) setMvrv(s.mvrv);
          if (s.fundingNegative !== undefined) setFundingNegative(s.fundingNegative);
          if (s.derivativesExhaustion !== undefined) setDerivativesExhaustion(s.derivativesExhaustion);
          if (s.below200ma !== undefined) setBelow200ma(s.below200ma);
          if (s.weeklyLowerLow !== undefined) setWeeklyLowerLow(s.weeklyLowerLow);
          if (s.dxyAbove110 !== undefined) setDxyAbove110(s.dxyAbove110);
          if (s.btcHoldings !== undefined) setBtcHoldings(s.btcHoldings);
          if (s.dilutedShares !== undefined) setDilutedShares(s.dilutedShares);
          if (s.corporateBaseUpdated !== undefined) setCorporateBaseUpdated(s.corporateBaseUpdated);
          if (s.startingShares !== undefined) setStartingShares(s.startingShares);
          if (s.cashBuffer !== undefined) setCashBuffer(s.cashBuffer);
          if (s.gbpUsd !== undefined) setGbpUsd(s.gbpUsd);
          if (s.levelsAuto !== undefined) setLevelsAuto(s.levelsAuto);
          if (s.manualSellLow !== undefined) setManualSellLow(s.manualSellLow);
          if (s.manualSellHigh !== undefined) setManualSellHigh(s.manualSellHigh);
          if (s.manualBuyLow !== undefined) setManualBuyLow(s.manualBuyLow);
          if (s.manualBuyHigh !== undefined) setManualBuyHigh(s.manualBuyHigh);
          if (s.aggressionStyle !== undefined) setAggressionStyle(s.aggressionStyle);
        }
      } catch (e) {}
      try { const t = ({ value: localStorage.getItem('mstr:trades') }); if (t?.value) setTrades(JSON.parse(t.value)); } catch (e) {}
      try { const sn = ({ value: localStorage.getItem('mstr:snapshots') }); if (sn?.value) setSnapshots(JSON.parse(sn.value)); } catch (e) {}
      try { const pos = ({ value: localStorage.getItem('mstr:positions') }); if (pos?.value) setPositions(JSON.parse(pos.value)); } catch (e) {}
    };
    load();
  }, []);

  useEffect(() => {
    const save = async () => {
      try {
        localStorage.setItem('mstr:settings', JSON.stringify({
          mstrPrice, btcPrice, ma200, lastUpdated,
          high20, low20, high50, low50, low200, atr14,
          nupl, mvrv, fundingNegative, derivativesExhaustion, below200ma,
          weeklyLowerLow, dxyAbove110, btcHoldings, dilutedShares,
          corporateBaseUpdated, startingShares, cashBuffer, gbpUsd,
          levelsAuto, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh,
          aggressionStyle,
        }));
      } catch (e) {}
    };
    save();
  }, [mstrPrice, btcPrice, ma200, lastUpdated,
      high20, low20, high50, low50, low200, atr14,
      nupl, mvrv, fundingNegative, derivativesExhaustion, below200ma,
      weeklyLowerLow, dxyAbove110, btcHoldings, dilutedShares,
      corporateBaseUpdated, startingShares, cashBuffer, gbpUsd,
      levelsAuto, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh,
      aggressionStyle]);

  const handleHoldingsChange = (v) => { setBtcHoldings(v); setCorporateBaseUpdated(new Date().toISOString().slice(0, 10)); };
  const handleSharesChange = (v) => { setDilutedShares(v); setCorporateBaseUpdated(new Date().toISOString().slice(0, 10)); };

  // ============ DERIVED CALCS ============
  const btcPerShare = useMemo(() => btcHoldings / (dilutedShares * 1_000_000), [btcHoldings, dilutedShares]);
  const fairValue = useMemo(() => btcPerShare * btcPrice, [btcPerShare, btcPrice]);
  const mNAV = useMemo(() => fairValue > 0 ? mstrPrice / fairValue : 0, [mstrPrice, fairValue]);

  const cycleData = useMemo(() => {
    const ath = new Date('2025-10-06');
    const target = new Date('2026-10-06');
    const now = new Date();
    const totalDays = Math.round((target - ath) / 86400000);
    const elapsed = Math.round((now - ath) / 86400000);
    const remaining = Math.round((target - now) / 86400000);
    const progress = Math.min(100, Math.max(0, (elapsed / totalDays) * 100));
    return { totalDays, elapsed, remaining, progress };
  }, [lastUpdated]);

  const daysSinceBaseUpdate = useMemo(() => {
    if (!corporateBaseUpdated) return null;
    return Math.floor((new Date() - new Date(corporateBaseUpdated)) / 86400000);
  }, [corporateBaseUpdated, lastUpdated]);

  // ============ AGGRESSION PROFILE ============
  // Three styles flex four levers: rotation sizing %, band width, HOARD entry sensitivity,
  // and DEPLOY ladder steepness. Moderate is the documented base case.
  const profile = useMemo(() => {
    switch (aggressionStyle) {
      case 'conservative':
        return {
          label: 'Conservative',
          rotationSizePctLow: 15,
          rotationSizePctHigh: 20,
          bandWidthMult: 0.55,        // wider bands → fewer trigger fires
          hoardSensitivity: 1.15,     // HOARD entry zone pulled closer to current (quicker to HOARD)
          deployLadderSteepness: 0.9, // tighter ladder spacing (deploy less aggressively into the hole)
          note: 'Wider bands, smaller rotations, quicker to HOARD.',
        };
      case 'aggressive':
        return {
          label: 'Aggressive',
          rotationSizePctLow: 35,
          rotationSizePctHigh: 45,
          bandWidthMult: 0.28,        // tighter bands → more frequent trigger fires
          hoardSensitivity: 0.85,     // HOARD entry held lower (still follows HOARD signal but holds ROTATE longer)
          deployLadderSteepness: 1.15,// wider ladder spacing (deploy harder on the way down)
          note: 'Tighter bands, larger rotations, holds ROTATE longer.',
        };
      default:
        return {
          label: 'Moderate (Base)',
          rotationSizePctLow: 25,
          rotationSizePctHigh: 30,
          bandWidthMult: 0.4,
          hoardSensitivity: 1.0,
          deployLadderSteepness: 1.0,
          note: 'Balanced — base case per the playbook.',
        };
    }
  }, [aggressionStyle]);

  // ============ DYNAMIC LEVELS ============
  // Calculate technical levels from OHLC data
  // Technicals come straight from prompt-driven state values
  const technicals = useMemo(() => {
    if (high20 === null || low20 === null || atr14 === null) return null;
    return { high20, low20, high50, low50, low200, atr14 };
  }, [high20, low20, high50, low50, low200, atr14]);

  // Mode-specific level calculation
  // ROTATE bands compute purely from 20d range + ATR — no ma200 dependency.
  // HOARD/DEPLOY prefer ma200-anchored targets when available, fall back to ATR-anchored
  // estimates when it's missing so the tool stays useful in degraded data conditions.
  // Aggression profile scales band width, HOARD sensitivity, and DEPLOY ladder steepness.
  const dynamicLevels = useMemo(() => {
    if (!technicals) return null;
    const { high20, low20, atr14 } = technicals;
    const current = mstrPrice;

    // ROTATE: sell at 20-day high (floored at current + 1 ATR), buy at 20-day low (floored at current - 1 ATR)
    const rotateSellTarget = Math.max(high20, current + atr14);
    const rotateBuyTarget = Math.min(low20, current - atr14);
    const bandWidth = atr14 * profile.bandWidthMult;

    // HOARD entry: scale by sensitivity. >1 pulls entry closer to current (quicker to engage),
    // <1 pushes entry deeper (holds ROTATE longer before flipping).
    const hoardBuyAnchor = ma200 ? ma200 * 0.85 : current - atr14 * 2;
    const hoardBuyDeep = ma200 ? ma200 * 0.75 : current - atr14 * 3;
    const hoardBuyTarget = current - (current - hoardBuyAnchor) / profile.hoardSensitivity;
    const hoardBuyDeepTarget = current - (current - hoardBuyDeep) / profile.hoardSensitivity;

    // DEPLOY ladder: steepness scales the spacing between rungs around the 200MA anchor
    const deployRungs = ma200
      ? [
          { level: current, pct: 25 },
          { level: current - (current - ma200 * 0.85) * 0.5 * profile.deployLadderSteepness, pct: 25 },
          { level: current - (current - ma200 * 0.85) * profile.deployLadderSteepness, pct: 25 },
          { level: current - (current - ma200 * 0.65) * profile.deployLadderSteepness, pct: 25 },
        ]
      : [
          { level: current, pct: 25 },
          { level: current * (1 - 0.10 * profile.deployLadderSteepness), pct: 25 },
          { level: current * (1 - 0.20 * profile.deployLadderSteepness), pct: 25 },
          { level: current * (1 - 0.30 * profile.deployLadderSteepness), pct: 25 },
        ];

    return {
      rotate: {
        sellLow: rotateSellTarget - bandWidth,
        sellHigh: rotateSellTarget + bandWidth,
        buyLow: rotateBuyTarget - bandWidth,
        buyHigh: rotateBuyTarget + bandWidth,
      },
      hoard: {
        sellLow: current + atr14 * 0.5,
        sellHigh: Math.max(high20, current + atr14 * 1.5),
        buyTarget: hoardBuyTarget,
        buyDeepTarget: hoardBuyDeepTarget,
      },
      deploy: { ladder: deployRungs },
    };
  }, [technicals, ma200, mstrPrice, profile]);

  // ============ SCORES + MODE ============
  const bearScore = useMemo(() => {
    let s = 0;
    if (btcPrice < 72500) s += 2;
    if (btcPrice < 60000) s += 2;
    if (nupl < 0) s += 2;
    if (mvrv < 1.0) s += 1;
    if (fundingNegative) s += 1;
    if (below200ma) s += 2;
    if (weeklyLowerLow) s += 1;
    if (dxyAbove110) s += 1;
    if (cycleData.remaining > 0 && cycleData.remaining < 180) s += 1;
    return s;
  }, [btcPrice, nupl, mvrv, fundingNegative, below200ma, weeklyLowerLow, dxyAbove110, cycleData]);

  const bottomScore = useMemo(() => {
    let s = 0;
    if (mstrPrice < 120) s += 2;
    if (mstrPrice < 90) s += 2;
    if (btcPrice < 55000) s += 2;
    if (btcPrice < 45000) s += 2;
    if (nupl < -25) s += 3;
    if (mvrv < 0.8) s += 3;
    if (derivativesExhaustion) s += 2;
    if (Math.abs(cycleData.remaining) < 60) s += 2;
    return s;
  }, [mstrPrice, btcPrice, nupl, mvrv, derivativesExhaustion, cycleData]);

  const mode = useMemo(() => {
    if (bottomScore >= 7 && mstrPrice < 140) return 'DEPLOY';
    if (bearScore >= 6) return 'HOARD';
    return 'ROTATE';
  }, [bearScore, bottomScore, mstrPrice]);

  // ============ LEVEL DISPLAY STRINGS ============
  const fmt = (v) => `$${Math.round(v)}`;
  const fmtRange = (low, high) => `${fmt(low)}–${fmt(high)}`;

  const levelDisplay = useMemo(() => {
    // If manual override or no dynamic data, use manual values
    if (!levelsAuto || !dynamicLevels) {
      return {
        rotate: { sell: fmtRange(manualSellLow, manualSellHigh), buy: fmtRange(manualBuyLow, manualBuyHigh) },
        hoard: { sell: fmtRange(manualSellLow, manualSellHigh), buy: `Wait — target ${fmt(manualBuyLow * 0.7)}` },
        deploy: { sell: 'Do not sell', buy: 'Ladder every 10% drop' },
      };
    }
    const d = dynamicLevels;
    return {
      rotate: {
        sell: fmtRange(d.rotate.sellLow, d.rotate.sellHigh),
        buy: fmtRange(d.rotate.buyLow, d.rotate.buyHigh),
      },
      hoard: {
        sell: fmtRange(d.hoard.sellLow, d.hoard.sellHigh),
        buy: `Wait — target ${fmt(d.hoard.buyTarget)} / deep ${fmt(d.hoard.buyDeepTarget)}`,
      },
      deploy: {
        sell: 'Do not sell',
        buy: `Ladder: ${d.deploy.ladder.map(l => fmt(l.level)).join(' · ')}`,
      },
    };
  }, [levelsAuto, dynamicLevels, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh]);

  // ============ ALERT LEVELS ============
  // Single-figure alert prices for setting Yahoo Finance (or similar) price alerts.
  // ROTATE uses inner-edge: sellLow (price entering sell zone) and buyHigh (price entering buy zone)
  // so you get the earliest possible notification with maximum reaction time. HOARD/DEPLOY are
  // already single-number anchors (buyTarget, ladder rungs) so they pass through unchanged.
  // Returns either a number or null per slot — null means "no single alert level makes sense here".
  const alertLevels = useMemo(() => {
    // Manual mode: derive inner-edge from the manual sliders
    if (!levelsAuto || !dynamicLevels) {
      return {
        rotate: { sellAlert: manualSellLow, buyAlert: manualBuyHigh },
        hoard:  { sellAlert: manualSellLow, buyAlert: manualBuyLow * 0.7, buyDeepAlert: null },
        deploy: { sellAlert: null, ladder: [] },
      };
    }
    const d = dynamicLevels;
    return {
      rotate: {
        sellAlert: d.rotate.sellLow,   // inner edge of sell band — alert when price enters it
        buyAlert:  d.rotate.buyHigh,    // inner edge of buy band — alert when price enters it
      },
      hoard: {
        sellAlert:     d.hoard.sellLow,
        buyAlert:      d.hoard.buyTarget,       // already a single number
        buyDeepAlert:  d.hoard.buyDeepTarget,   // already a single number
      },
      deploy: {
        sellAlert: null,
        ladder: d.deploy.ladder.map(r => r.level),
      },
    };
  }, [levelsAuto, dynamicLevels, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh]);

  const modeCfg = {
    ROTATE: { label: 'NORMAL ROTATION', color: '#d4a017', bg: '#1a1611', action: 'Sell at resistance, buy back at support.', cash: '0–25%' },
    HOARD:  { label: 'CASH HOARD',      color: '#c73e1d', bg: '#1a0f0d', action: 'Sell at resistance. Do NOT buy back. Wait for deeper levels.', cash: '40–70%' },
    DEPLOY: { label: 'DEPLOY CASH',     color: '#2d8659', bg: '#0f1a13', action: 'Ladder cash into weakness. All-in accumulation.', cash: 'Deploying to 0%' },
  };
  const cfg = modeCfg[mode];
  const currentLevels = levelDisplay[mode.toLowerCase()];
  const deploySuppressed = bottomScore >= 7 && mstrPrice >= 140;

  // ============ BAND-HIT DETECTION ============
  // Returns an array of currently-triggered bands relative to mstrPrice and the active mode.
  // Each hit is { tag, side, label, zone, price } so the UI can render chips and prefill the form.
  const bandHits = useMemo(() => {
    if (!dynamicLevels) return [];
    const hits = [];
    const d = dynamicLevels;
    const p = mstrPrice;
    // ROTATE bands: live in ROTATE mode
    if (mode === 'ROTATE') {
      if (p >= d.rotate.sellLow && p <= d.rotate.sellHigh) {
        hits.push({ tag: 'ROTATE-SELL', side: 'SELL', label: 'ROTATE sell zone hit', zone: `${fmt(d.rotate.sellLow)}–${fmt(d.rotate.sellHigh)}`, price: p });
      }
      if (p >= d.rotate.buyLow && p <= d.rotate.buyHigh) {
        hits.push({ tag: 'ROTATE-BUY', side: 'BUY', label: 'ROTATE buy zone hit', zone: `${fmt(d.rotate.buyLow)}–${fmt(d.rotate.buyHigh)}`, price: p });
      }
    }
    // HOARD bands: sell live, buy target tracked but flagged only when in range
    if (mode === 'HOARD') {
      if (p >= d.hoard.sellLow && p <= d.hoard.sellHigh) {
        hits.push({ tag: 'HOARD-SELL', side: 'SELL', label: 'HOARD sell zone hit', zone: `${fmt(d.hoard.sellLow)}–${fmt(d.hoard.sellHigh)}`, price: p });
      }
      // Treat buyTarget as a ±1.5% trigger window
      const t = d.hoard.buyTarget;
      if (p >= t * 0.985 && p <= t * 1.015) {
        hits.push({ tag: 'HOARD-BUY', side: 'BUY', label: 'HOARD buy target reached', zone: fmt(t), price: p });
      }
      const dt = d.hoard.buyDeepTarget;
      if (p <= dt * 1.015) {
        hits.push({ tag: 'HOARD-BUY-DEEP', side: 'BUY', label: 'HOARD deep buy target reached', zone: fmt(dt), price: p });
      }
    }
    // DEPLOY ladder: every rung at-or-below current price is "live"
    if (mode === 'DEPLOY') {
      d.deploy.ladder.forEach((rung, i) => {
        if (p <= rung.level * 1.015) {
          hits.push({ tag: `DEPLOY-RUNG-${i + 1}`, side: 'BUY', label: `DEPLOY rung ${i + 1} live (${rung.pct}%)`, zone: fmt(rung.level), price: p });
        }
      });
    }
    return hits;
  }, [dynamicLevels, mstrPrice, mode]);

  // ============ PRICE-IN-RANGE (hero derivation) ============
  // Surfaces the most important question this tool answers: where is MSTR right now
  // relative to my action zones? Returns a 0-1 position, a status verdict, and a colour cue.
  // In ROTATE: 0 = at buyLow, 1 = at sellHigh.
  // In HOARD: focuses on distance-to-buy-target (or how far above sell zone).
  // In DEPLOY: focuses on which ladder rung is currently live.
  // Hex values inlined here (rather than reading from the `colors` object below) because
  // this memo runs before `colors` is declared — referencing it would hit a TDZ error.
  const priceRange = useMemo(() => {
    if (!dynamicLevels) return null;
    const RED = '#c73e1d', GREEN = '#2d8659', GOLD = '#d4a017';
    const p = mstrPrice;
    const d = dynamicLevels;

    if (mode === 'ROTATE') {
      const lo = d.rotate.buyLow;
      const hi = d.rotate.sellHigh;
      const span = hi - lo;
      const pct = span > 0 ? Math.max(0, Math.min(1, (p - lo) / span)) : 0.5;
      const inSell = p >= d.rotate.sellLow;
      const inBuy = p <= d.rotate.buyHigh;
      const verdict = inSell ? 'IN SELL ZONE' : inBuy ? 'IN BUY ZONE' : 'BETWEEN BANDS';
      const tone = inSell ? RED : inBuy ? GREEN : GOLD;
      return { pct, verdict, tone, lo, hi, buyLow: d.rotate.buyLow, buyHigh: d.rotate.buyHigh, sellLow: d.rotate.sellLow, sellHigh: d.rotate.sellHigh };
    }
    if (mode === 'HOARD') {
      const target = d.hoard.buyTarget;
      const deep = d.hoard.buyDeepTarget;
      const pctToTarget = ((p / target) - 1) * 100;   // positive = above target
      const inSell = p >= d.hoard.sellLow;
      const atTarget = p <= target * 1.015;
      const verdict = inSell ? 'IN SELL ZONE' : atTarget ? 'AT BUY TARGET' : `${pctToTarget > 0 ? '+' : ''}${pctToTarget.toFixed(1)}% vs target`;
      const tone = inSell ? RED : atTarget ? GREEN : GOLD;
      return { pct: null, verdict, tone, target, deep, sellLow: d.hoard.sellLow, sellHigh: d.hoard.sellHigh };
    }
    // DEPLOY
    const liveRungs = d.deploy.ladder.filter(r => p <= r.level * 1.015);
    const verdict = liveRungs.length > 0 ? `${liveRungs.length}/4 RUNGS LIVE` : 'ABOVE LADDER';
    return { pct: null, verdict, tone: GREEN, ladder: d.deploy.ladder };
  }, [dynamicLevels, mstrPrice, mode]);

  const journalStats = useMemo(() => {
    let currentShares = startingShares;
    let totalCash = 0;
    let rotationShares = 0;       // cumulative shares gained via SELL → BUY rotations
    let completedRotations = 0;   // number of completed pairs
    let openSell = null;          // most recent unmatched SELL

    const sorted = [...trades].sort((a, b) => a.date.localeCompare(b.date));

    sorted.forEach(t => {
      const gross = t.shares * t.price;
      if (t.type === 'SELL') {
        currentShares -= t.shares;
        totalCash += gross - (t.fees || 0);
        // Track the SELL as potentially the start of a rotation pair
        openSell = { shares: t.shares, price: t.price };
      } else {
        // BUY
        currentShares += t.shares;
        totalCash -= gross + (t.fees || 0);
        // If we have an open SELL, the BUY completes a rotation
        if (openSell) {
          // Shares gained = buy_shares - sell_shares (the rotation accumulation)
          const gained = t.shares - openSell.shares;
          rotationShares += gained;
          completedRotations += 1;
          openSell = null;
        }
      }
    });

    return {
      currentShares,
      totalCash,
      sharesDelta: currentShares - startingShares,
      sharesPct: startingShares > 0 ? ((currentShares - startingShares) / startingShares) * 100 : 0,
      rotationShares,
      completedRotations,
      tradeCount: trades.length,
    };
  }, [trades, startingShares]);

  // Portfolio summary: shares value + uncommitted cash buffer (GBP)
  const portfolio = useMemo(() => {
    const positionUSD = journalStats.currentShares * mstrPrice;
    const positionGBP = positionUSD / gbpUsd;
    const totalGBP = positionGBP + cashBuffer;
    const cashPct = totalGBP > 0 ? (cashBuffer / totalGBP) * 100 : 0;
    const positionPct = 100 - cashPct;
    return { positionUSD, positionGBP, totalGBP, cashPct, positionPct };
  }, [journalStats.currentShares, mstrPrice, gbpUsd, cashBuffer]);

  const claudePrompt = `Please web-search current data and return MSTR / BTC readings in the EXACT machine-readable format below. I will paste your response directly into a decision tool.

Search for: latest MSTR closing price; MSTR 200-day simple moving average value; MSTR daily high/low for last 20, 50, and 200 trading days; MSTR 14-day Average True Range; current Bitcoin spot price; BTC NUPL (Net Unrealised Profit/Loss) percentage; BTC MVRV ratio; BTC perpetual futures funding rates and open interest trend across major exchanges; current DXY level; Strategy Inc (MSTR) latest disclosed BTC holdings from most recent 8-K filing; Strategy diluted share count from most recent 10-Q.

Return your response as a single fenced code block containing the keys below, one per line, no commentary INSIDE the block. Outside the block you may add brief context or caveats.

\`\`\`
MSTR_PRICE: <number, current close in USD>
MSTR_200MA: <number, 200-day simple moving average in USD>
MSTR_20D_HIGH: <number, highest daily high over last 20 trading days>
MSTR_20D_LOW: <number, lowest daily low over last 20 trading days>
MSTR_50D_HIGH: <number, highest daily high over last 50 trading days>
MSTR_50D_LOW: <number, lowest daily low over last 50 trading days>
MSTR_200D_LOW: <number, lowest daily low over last 200 trading days>
MSTR_ATR14: <number, 14-day Average True Range in USD>
BTC_PRICE: <number, current USD spot>
NUPL: <number, percent without %, e.g., 28 for 28%>
MVRV: <number with one decimal, e.g., 1.4>
BTC_HOLDINGS: <integer, total BTC held by Strategy>
DILUTED_SHARES: <number in millions, e.g., 333>
BELOW_200MA: ON or OFF
WEEKLY_LL: ON or OFF
SHORTING: ON or OFF
EXHAUSTION: ON or OFF
DXY_ABOVE_110: ON or OFF
\`\`\`

Rules:
- All numeric values: digits and one decimal point only. No $ signs, no commas, no percent signs.
- DILUTED_SHARES: in millions (e.g., 333 not 333000000).
- BELOW_200MA: ON if MSTR closing price is below the 200-day SMA on the most recent weekly close.
- WEEKLY_LL: ON if MSTR has printed a weekly lower-low after a weekly lower-high (confirmed downtrend structure).
- SHORTING and EXHAUSTION are MUTUALLY EXCLUSIVE — at most one ON.
- SHORTING: ON only if BTC perp funding is persistently and aggressively negative across major exchanges (binance, bybit, okx).
- EXHAUSTION: ON only if funding is flat-to-neutral (~0.00%) AND aggregate open interest has collapsed to multi-month lows.
- DXY_ABOVE_110: ON if US Dollar Index is currently above 110.

If any value cannot be reliably sourced (e.g., specific 50-day low requires chart access), provide your best estimate and add a brief note OUTSIDE the code block flagging which fields are estimates vs verified.

After the code block, briefly note: (1) any data older than a week, (2) any fields you had to estimate, (3) anything else worth flagging for the user.`;

  const copyPrompt = async () => {
    try { await navigator.clipboard.writeText(claudePrompt); setPromptCopied(true); setTimeout(() => setPromptCopied(false), 2000); } catch (e) {}
  };

  // Paste-and-parse: extract structured keys from Claude's response and apply to fields
  const applyPaste = () => {
    if (!pasteText.trim()) { setPasteResult({ ok: false, msg: 'Empty paste' }); return; }
    // Strip code fences if present
    let text = pasteText.replace(/```[a-z]*\n?/gi, '').replace(/```/g, '');
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const applied = [];
    const skipped = [];

    for (const line of lines) {
      // Keys may contain digits (MSTR_200MA, MSTR_20D_HIGH, MSTR_ATR14, DXY_ABOVE_110).
      // Match against case-insensitive alphanumeric + underscore; normalise via toUpperCase below.
      const m = line.match(/^([A-Za-z0-9_]+)\s*[:=]\s*(.+?)\s*$/);
      if (!m) continue;
      const key = m[1].toUpperCase();
      const val = m[2].trim();
      const numVal = parseFloat(val.replace(/[$,%]/g, ''));
      const boolVal = /^on$|^true$|^yes$|^1$/i.test(val);

      switch (key) {
        case 'MSTR_PRICE':
          if (!isNaN(numVal) && numVal > 0) { setMstrPrice(numVal); applied.push(`MSTR $${numVal}`); }
          else skipped.push(key);
          break;
        case 'MSTR_200MA':
          if (!isNaN(numVal) && numVal > 0) { setMa200(numVal); applied.push(`200MA $${numVal}`); }
          else skipped.push(key);
          break;
        case 'MSTR_20D_HIGH':
          if (!isNaN(numVal) && numVal > 0) { setHigh20(numVal); applied.push(`20dH $${numVal}`); }
          else skipped.push(key);
          break;
        case 'MSTR_20D_LOW':
          if (!isNaN(numVal) && numVal > 0) { setLow20(numVal); applied.push(`20dL $${numVal}`); }
          else skipped.push(key);
          break;
        case 'MSTR_50D_HIGH':
          if (!isNaN(numVal) && numVal > 0) { setHigh50(numVal); applied.push(`50dH $${numVal}`); }
          else skipped.push(key);
          break;
        case 'MSTR_50D_LOW':
          if (!isNaN(numVal) && numVal > 0) { setLow50(numVal); applied.push(`50dL $${numVal}`); }
          else skipped.push(key);
          break;
        case 'MSTR_200D_LOW':
          if (!isNaN(numVal) && numVal > 0) { setLow200(numVal); applied.push(`200dL $${numVal}`); }
          else skipped.push(key);
          break;
        case 'MSTR_ATR14':
          if (!isNaN(numVal) && numVal > 0) { setAtr14(numVal); applied.push(`ATR ${numVal}`); }
          else skipped.push(key);
          break;
        case 'BTC_PRICE':
          if (!isNaN(numVal) && numVal > 0) { setBtcPrice(numVal); applied.push(`BTC $${numVal.toLocaleString()}`); }
          else skipped.push(key);
          break;
        case 'NUPL':
          if (!isNaN(numVal)) { setNupl(numVal); applied.push(`NUPL ${numVal}%`); }
          else skipped.push(key);
          break;
        case 'MVRV':
          if (!isNaN(numVal) && numVal > 0) { setMvrv(numVal); applied.push(`MVRV ${numVal}`); }
          else skipped.push(key);
          break;
        case 'BTC_HOLDINGS':
          if (!isNaN(numVal) && numVal > 0) { handleHoldingsChange(numVal); applied.push(`Holdings ${numVal.toLocaleString()}`); }
          else skipped.push(key);
          break;
        case 'DILUTED_SHARES':
          if (!isNaN(numVal) && numVal > 0) {
            const shares = numVal > 10000 ? numVal / 1_000_000 : numVal;
            handleSharesChange(shares); applied.push(`Shares ${shares}M`);
          } else skipped.push(key);
          break;
        case 'BELOW_200MA':
          setBelow200ma(boolVal); applied.push(`200MA ${boolVal ? 'ON' : 'OFF'}`);
          break;
        case 'WEEKLY_LL':
          setWeeklyLowerLow(boolVal); applied.push(`WeeklyLL ${boolVal ? 'ON' : 'OFF'}`);
          break;
        case 'SHORTING':
          setFundingNegative(boolVal);
          if (boolVal) setDerivativesExhaustion(false);
          applied.push(`Shorting ${boolVal ? 'ON' : 'OFF'}`);
          break;
        case 'EXHAUSTION':
          setDerivativesExhaustion(boolVal);
          if (boolVal) setFundingNegative(false);
          applied.push(`Exhaustion ${boolVal ? 'ON' : 'OFF'}`);
          break;
        case 'DXY_ABOVE_110':
          setDxyAbove110(boolVal); applied.push(`DXY>110 ${boolVal ? 'ON' : 'OFF'}`);
          break;
        default:
          skipped.push(key);
      }
    }

    if (applied.length === 0) {
      setPasteResult({ ok: false, msg: 'No recognised fields. Check format — expect KEY: VALUE per line.' });
    } else {
      setLastUpdated(new Date().toISOString().slice(0, 10));
      setPasteResult({
        ok: true,
        msg: `Applied ${applied.length} field${applied.length > 1 ? 's' : ''}${skipped.length ? ` (${skipped.length} skipped)` : ''}: ${applied.slice(0, 6).join(' · ')}${applied.length > 6 ? '…' : ''}`,
      });
      setPasteText('');
      setTimeout(() => setPasteResult(null), 6000);
    }
  };

  const saveSnapshot = async () => {
    const snap = { date: new Date().toISOString(), mstrPrice, btcPrice, nupl, mvrv, mNAV: Number(mNAV.toFixed(2)), bearScore, bottomScore, mode };

  const addTrade = async () => {
    if (!tradeShares || !tradePrice) return;

  };

  };

    const updated = positions.map(p => p.id === id ? { ...p, status: 'CLOSED', closedAt: new Date().toISOString(), exitPrice: exit, exitFees: parseFloat(exitFees) || 0 } : p);
    setPositions(updated);
    try { localStorage.setItem('mstr:positions', JSON.stringify(updated)); } catch (e) {}
    // Write closing leg to trades journal as a SELL
    const closingTrade = { id: Date.now(), date: new Date().toISOString().slice(0, 10), type: 'SELL', shares: pos.shares, price: exit, fees: parseFloat(exitFees) || 0, fromPositionId: id };
    const tradesUpdated = [...trades, closingTrade];

    try { localStorage.setItem('mstr:trades', JSON.stringify(tradesUpdated)); } catch (e) {}
  };

  const deletePosition = async (id) => {

  // ============ JSON BACKUP / RESTORE ============
  const [importText, setImportText] = useState('');
  const [importResult, setImportResult] = useState(null);

  const buildExportPayload = () => ({

      nupl, mvrv, fundingNegative, derivativesExhaustion, below200ma,

  const exportJSON = async () => {

    try {

        if (s.dilutedShares !== undefined) setDilutedShares(s.dilutedShares);

        if (s.startingShares !== undefined) setStartingShares(s.startingShares);

        if (s.gbpUsd !== undefined) setGbpUsd(s.gbpUsd);
        if (s.levelsAuto !== undefined) setLevelsAuto(s.levelsAuto);
        if (s.manualSellLow !== undefined) setManualSellLow(s.manualSellLow);
        if (s.manualSellHigh !== undefined) setManualSellHigh(s.manualSellHigh);
        if (s.manualBuyLow !== undefined) setManualBuyLow(s.manualBuyLow);
        if (s.manualBuyHigh !== undefined) setManualBuyHigh(s.manualBuyHigh);

      }
      if (Array.isArray(p.trades)) {
