    setTimeout(() => setImportResult(null), 8000);
  };

  const deleteSnapshot = async (date) => {
    const updated = snapshots.filter(s => s.date !== date);
    setSnapshots(updated);
    try { localStorage.setItem('mstr:snapshots', JSON.stringify(updated)); } catch (e) {}
  };

  // ============ STYLES ============
  const colors = {
    bg: '#0a0806', panel: '#14100c', border: '#2a2520',
    text: '#d4c8b8', textDim: '#a89580', textMute: '#8a7a65', textFaint: '#5a5048',
    gold: '#d4a017', red: '#c73e1d', green: '#2d8659', highlight: '#e8dcc8',
  };
  const serif = 'Georgia, "Times New Roman", serif';

  // ============ TYPOGRAPHY SCALE ============
  // Consolidated from ~8 ad-hoc sizes scattered through the file. Five steps cover everything:
  //   eyebrow: tiny uppercase labels above values (9-10px)
  //   meta:    secondary inline metadata (10-11px)
  //   body:    standard reading text (12-13px)
  //   value:   numeric values, mode labels (15-22px)
  //   hero:    the single largest element on a card (28-32px)
  const t = {
    eyebrow: { fontSize: '9px', letterSpacing: '0.15em', textTransform: 'uppercase', color: colors.textMute },
    meta:    { fontSize: '11px', color: colors.textDim },
    body:    { fontSize: '13px', color: colors.text, lineHeight: 1.55 },
    value:   { fontSize: '15px', color: colors.text, fontWeight: 600 },
    hero:    { fontSize: '28px', color: colors.highlight, fontWeight: 600, letterSpacing: '-0.01em' },
  };

  // Section header style — used across all cards for consistency
  const sectionHeader = {
    fontSize: '10px', color: colors.textMute, letterSpacing: '0.2em',
    textTransform: 'uppercase', marginBottom: '14px', fontWeight: 500,
  };

  const staleColor = !daysSinceBaseUpdate && daysSinceBaseUpdate !== 0 ? colors.textFaint
    : daysSinceBaseUpdate > 60 ? colors.red
    : daysSinceBaseUpdate > 30 ? colors.gold
    : colors.textMute;

  const SignalToggle = ({ value, onChange, label, helperUrl, bottomTone }) => (
    <div style={{ marginBottom: '8px' }}>
      <div onClick={() => onChange(!value)} style={{
        display: 'flex', alignItems: 'center', padding: '10px 14px',
        background: value ? (bottomTone ? '#0f1a13' : '#2a1f1a') : '#0f0d0a',
        border: `1px solid ${value ? (bottomTone ? colors.green : colors.red) : colors.border}`,
        borderRadius: '4px', cursor: 'pointer', transition: 'all 0.2s',
      }}>
        <div style={{ width: '14px', height: '14px', borderRadius: '2px',
          border: `2px solid ${value ? (bottomTone ? colors.green : colors.red) : colors.textFaint}`,
          background: value ? (bottomTone ? colors.green : colors.red) : 'transparent',
          marginRight: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '10px', color: '#000', flexShrink: 0 }}>{value && '✓'}</div>
        <span style={{ color: colors.text, fontSize: '13px', fontFamily: serif, flex: 1 }}>{label}</span>
      </div>
      <div style={{ display: 'flex', justifyContent: 'flex-start', marginTop: '4px', paddingLeft: '14px', fontSize: '10px' }}>
        {helperUrl && <a href={helperUrl} target="_blank" rel="noopener noreferrer" style={{ color: colors.gold, textDecoration: 'none', letterSpacing: '0.05em' }}>check →</a>}
      </div>
    </div>
  );

  const NumberInput = ({ value, onChange, step, label, suffix = '', precision = 0, min, max }) => {
    // Hold edit state as string so typing decimals like "333." doesn't get clobbered
    const [editValue, setEditValue] = useState(String(value));
    const [isFocused, setIsFocused] = useState(false);

    // When value prop changes externally (not from this input) and we're not focused, sync
    useEffect(() => {
      if (!isFocused) setEditValue(String(value));
    }, [value, isFocused]);

    const commit = (raw) => {
      // Clean leading zeros except for "0.x" patterns
      let cleaned = raw.replace(/^0+(\d)/, '$1');
      if (cleaned === '' || cleaned === '-' || cleaned === '.') {
        onChange(0); setEditValue('0'); return;
      }
      const n = Number(cleaned);
      if (isNaN(n)) { setEditValue(String(value)); return; }
      let bounded = n;
      if (min !== undefined) bounded = Math.max(min, bounded);
      if (max !== undefined) bounded = Math.min(max, bounded);
      const final = Number(bounded.toFixed(precision));
      onChange(final);
      setEditValue(String(final));
    };

    const adjust = (delta) => {
      let next = Number(value) + delta;
      if (min !== undefined) next = Math.max(min, next);
      if (max !== undefined) next = Math.min(max, next);
      const final = Number(next.toFixed(precision));
      onChange(final);
      setEditValue(String(final));
    };

    return (
      <div style={{ marginBottom: '14px', minWidth: 0 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px', alignItems: 'center' }}>
          <span style={{ color: colors.textDim, fontSize: '11px', letterSpacing: '0.08em', textTransform: 'uppercase', fontFamily: serif }}>{label}</span>
          {suffix && <span style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.05em' }}>{suffix.trim()}</span>}
        </div>
        <div style={{ display: 'flex', gap: '6px', alignItems: 'stretch', minWidth: 0 }}>
          <button onClick={() => adjust(-step)} style={{
            width: '40px', flexShrink: 0,
            background: colors.bg, border: `1px solid ${colors.border}`,
            color: colors.gold, fontFamily: serif, fontSize: '16px', cursor: 'pointer',
          }}>−</button>
          <input
            type="text"
            inputMode="decimal"
            value={editValue}
            onFocus={() => setIsFocused(true)}
            onBlur={() => { setIsFocused(false); commit(editValue); }}
            onChange={(e) => {
              const raw = e.target.value;
              if (/^-?\d*\.?\d*$/.test(raw)) {
                setEditValue(raw);
                if (raw !== '' && raw !== '-' && raw !== '.' && raw !== '-.') {
                  const n = Number(raw);
                  if (!isNaN(n)) onChange(n);
                }
              }
            }}
            onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
            style={{
              flex: 1, minWidth: 0,
              background: colors.bg, border: `1px solid ${colors.border}`,
              color: colors.gold, padding: '8px 12px', fontFamily: serif,
              fontSize: '15px', fontWeight: 600, textAlign: 'center',
              boxSizing: 'border-box',
            }}
          />
          <button onClick={() => adjust(step)} style={{
            width: '40px', flexShrink: 0,
            background: colors.bg, border: `1px solid ${colors.border}`,
            color: colors.gold, fontFamily: serif, fontSize: '16px', cursor: 'pointer',
          }}>+</button>
        </div>
      </div>
    );
  };

  const SectionHeader = ({ children }) => (
    <div style={{ fontSize: '11px', letterSpacing: '0.2em', color: colors.textDim, textTransform: 'uppercase', marginBottom: '16px', borderBottom: `1px solid ${colors.border}`, paddingBottom: '8px', fontFamily: serif }}>{children}</div>
  );

  // NavButton supports a `secondary` variant for less-frequent destinations (Snapshots, Backup).
  // Primary buttons are larger and slightly bolder; secondaries are a quieter chip style.
  const NavButton = ({ id, label, secondary }) => (
    <button onClick={() => setView(id)} style={{
      background: view === id ? colors.panel : 'transparent',
      color: view === id ? colors.gold : (secondary ? colors.textMute : colors.textDim),
      border: `1px solid ${view === id ? colors.gold : colors.border}`,
      padding: secondary ? '5px 10px' : '8px 14px',
      fontFamily: serif,
      fontSize: secondary ? '10px' : '11px',
      letterSpacing: '0.1em', textTransform: 'uppercase', cursor: 'pointer', flex: 1,
      fontWeight: view === id ? 600 : 400,
      transition: 'all 0.15s', borderRadius: '2px',
    }}>{label}</button>
  );

  return (
    <div style={{ minHeight: '100vh', background: `linear-gradient(180deg, ${colors.bg} 0%, ${colors.panel} 100%)`, padding: '24px 16px', fontFamily: serif, color: colors.text }}>
      <div style={{ maxWidth: '720px', margin: '0 auto' }}>
        {/* HEADER */}
        <div style={{ marginBottom: '24px', borderBottom: `1px solid ${colors.border}`, paddingBottom: '20px' }}>
          <div style={{ fontSize: '10px', letterSpacing: '0.3em', color: colors.textMute, textTransform: 'uppercase', marginBottom: '8px' }}>
            Cycle Decision Framework · v13.1
          </div>
          <h1 style={{ fontSize: '26px', fontWeight: 400, color: colors.highlight, margin: 0, fontStyle: 'italic' }}>MSTR Rotation</h1>
          <h2 style={{ fontSize: '14px', fontWeight: 400, color: colors.textDim, margin: '4px 0 12px 0', letterSpacing: '0.05em' }}>Rotate · Hoard · Deploy</h2>
          <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap', fontSize: '12px', marginTop: '12px', alignItems: 'center' }}>
            <div><span style={{ color: colors.textMute }}>BTC </span><span style={{ color: colors.gold }}>${btcPrice.toLocaleString()}</span></div>
            <div><span style={{ color: colors.textMute }}>MSTR </span><span style={{ color: colors.gold }}>${mstrPrice.toFixed(2)}</span></div>
            <div><span style={{ color: colors.textMute }}>200MA </span><span style={{ color: colors.gold }}>{ma200 ? `$${ma200.toFixed(2)}` : '—'}</span></div>
            <div style={{ color: colors.textMute }}>mNAV <span style={{ color: mNAV > 1.5 ? colors.red : mNAV < 1.0 ? colors.green : colors.gold }}>{mNAV.toFixed(2)}x</span></div>
          </div>
          <div style={{ fontSize: '9px', color: colors.textFaint, marginTop: '6px', letterSpacing: '0.05em' }}>
            Prompt-driven updates. Use the panel below to refresh all readings at once.{lastUpdated && <span> · last updated: {lastUpdated}</span>}
          </div>
        </div>

        {/* Two-row nav: trade-flow tabs on top, persistence tabs (Log/Backup) demoted to secondary row */}
        <div style={{ marginBottom: '20px' }}>
          <div style={{ display: 'flex', gap: '6px', marginBottom: '6px' }}>
            <NavButton id="dashboard" label="Dashboard" />
            <NavButton id="positions" label={`Open · ${positions.filter(p => p.status === 'OPEN').length}`} />
            <NavButton id="journal" label={`Journal · ${trades.length}`} />
          </div>
          <div style={{ display: 'flex', gap: '6px' }}>
            <NavButton id="snapshots" label={`Log · ${snapshots.length}`} secondary />
            <NavButton id="backup" label="Backup" secondary />
          </div>
        </div>

        {view === 'dashboard' && (
          <>
            {/* ============================================================
                MODE CARD — Hero section.
                Three tiers of hierarchy:
                  1. HERO ROW: mode label, current price, verdict, position-in-range bar
                  2. TRIGGERS: split SELL/BUY cards, only render when active
                  3. ZONES: the three level columns, deemphasised relative to hero
                  4. FOOTER: aggression style + auto/manual toggle (least prominent)
               ============================================================ */}
            <div style={{
              background: cfg.bg, border: `1px solid ${cfg.color}`,
              padding: '20px', marginBottom: '20px', position: 'relative',
            }}>
              {/* TIER 1: Hero row */}
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '18px', gap: '16px', flexWrap: 'wrap' }}>
                <div style={{ flex: '1 1 auto', minWidth: 0 }}>
                  <div style={{ ...t.eyebrow, color: cfg.color, marginBottom: '6px' }}>Active mode</div>
                  <div style={{ fontSize: '20px', color: cfg.color, fontWeight: 600, letterSpacing: '0.02em', lineHeight: 1.1 }}>{cfg.label}</div>
                </div>
                <div style={{ flex: '0 0 auto', textAlign: 'right' }}>
                  <div style={{ ...t.eyebrow, marginBottom: '6px' }}>MSTR</div>
                  <div style={{ ...t.hero, color: priceRange?.tone || colors.highlight, lineHeight: 1 }}>${mstrPrice.toFixed(2)}</div>
                  {priceRange?.verdict && (
                    <div style={{ ...t.eyebrow, color: priceRange.tone, marginTop: '6px', letterSpacing: '0.18em', fontWeight: 600 }}>{priceRange.verdict}</div>
                  )}
                </div>
              </div>

              {/* TIER 1b: Position-in-range bar — only meaningful in ROTATE mode */}
              {priceRange?.pct !== null && priceRange?.pct !== undefined && mode === 'ROTATE' && (
                <div style={{ marginBottom: '18px' }}>
                  <div style={{ position: 'relative', height: '6px', background: '#0a0806', borderRadius: '3px', overflow: 'hidden', border: `1px solid ${colors.border}` }}>
                    {/* Buy zone band */}
                    <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0,
                      width: `${((priceRange.buyHigh - priceRange.lo) / (priceRange.hi - priceRange.lo)) * 100}%`,
                      background: 'rgba(45, 134, 89, 0.25)' }} />
                    {/* Sell zone band */}
                    <div style={{ position: 'absolute', right: 0, top: 0, bottom: 0,
                      width: `${((priceRange.hi - priceRange.sellLow) / (priceRange.hi - priceRange.lo)) * 100}%`,
                      background: 'rgba(199, 62, 29, 0.25)' }} />
                    {/* Current price marker */}
                    <div style={{ position: 'absolute', left: `${priceRange.pct * 100}%`, top: '-3px', bottom: '-3px', width: '2px',
                      background: priceRange.tone, boxShadow: `0 0 6px ${priceRange.tone}` }} />
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', ...t.eyebrow, marginTop: '4px' }}>
                    <span>${priceRange.lo.toFixed(0)}</span>
                    <span style={{ color: colors.textFaint }}>Buy band &nbsp;·&nbsp; Sell band</span>
                    <span>${priceRange.hi.toFixed(0)}</span>
                  </div>
                </div>
              )}

              {/* Action line */}
              <div style={{ ...t.body, marginBottom: '18px' }}>{cfg.action}</div>

              {/* Warnings */}
              {deploySuppressed && (
                <div style={{ ...t.meta, color: colors.gold, marginBottom: '14px', padding: '10px 12px', background: '#1a1611', border: `1px dashed ${colors.gold}`, borderRadius: '3px' }}>
                  ⚠ Bottom score is at deploy threshold, but MSTR is still above $140. Holding HOARD until price confirms.
                </div>
              )}
              {levelsAuto && !technicals && (
                <div style={{ ...t.meta, color: colors.red, marginBottom: '14px', padding: '10px 12px', background: '#1a0f0d', border: `1px dashed ${colors.red}`, borderRadius: '3px' }}>
                  ⚠ Auto-levels unavailable — paste a prompt response below, or switch to manual override.
                </div>
              )}

              {/* TIER 2: Live triggers — split by side, only render if active */}
              {bandHits.length > 0 && (() => {
                const sellHits = bandHits.filter(h => h.side === 'SELL');
                const buyHits = bandHits.filter(h => h.side === 'BUY');
                return (
                  <div style={{ display: 'grid', gridTemplateColumns: sellHits.length && buyHits.length ? '1fr 1fr' : '1fr', gap: '10px', marginBottom: '18px' }}>
                    {sellHits.length > 0 && (
                      <div style={{ background: 'rgba(199, 62, 29, 0.08)', border: `1px solid ${colors.red}`, padding: '12px', borderRadius: '3px' }}>
                        <div style={{ ...t.eyebrow, color: colors.red, marginBottom: '8px', fontWeight: 600 }}>● Sell trigger live</div>
                        {sellHits.map(h => (
                          <div key={h.tag} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '4px' }}>
                            <div style={{ ...t.meta, color: colors.text }}>
                              <div style={{ fontSize: '12px', fontWeight: 600 }}>{h.label}</div>
                              <div style={{ ...t.meta }}>@ {h.zone}</div>
                            </div>
                            <button onClick={() => { setView('positions'); setPositionForm(pf => ({ ...pf, entryPrice: String(h.price), tag: h.tag })); }}
                              style={{ background: colors.red, border: 'none', color: '#fff', padding: '6px 12px', fontFamily: serif, fontSize: '10px', letterSpacing: '0.12em', fontWeight: 600, cursor: 'pointer', borderRadius: '2px' }}>
                              SELL
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                    {buyHits.length > 0 && (
                      <div style={{ background: 'rgba(45, 134, 89, 0.08)', border: `1px solid ${colors.green}`, padding: '12px', borderRadius: '3px' }}>
                        <div style={{ ...t.eyebrow, color: colors.green, marginBottom: '8px', fontWeight: 600 }}>● Buy trigger live</div>
                        {buyHits.map(h => (
                          <div key={h.tag} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '4px' }}>
                            <div style={{ ...t.meta, color: colors.text }}>
                              <div style={{ fontSize: '12px', fontWeight: 600 }}>{h.label}</div>
                              <div style={{ ...t.meta }}>@ {h.zone}</div>
                            </div>
                            <button onClick={() => { setView('positions'); setPositionForm(pf => ({ ...pf, entryPrice: String(h.price), tag: h.tag })); }}
                              style={{ background: colors.green, border: 'none', color: '#fff', padding: '6px 12px', fontFamily: serif, fontSize: '10px', letterSpacing: '0.12em', fontWeight: 600, cursor: 'pointer', borderRadius: '2px' }}>
                              BUY
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })()}

              {/* TIER 3: Zones grid — divider line separates from hero.
                  "Alert at" lines below each zone surface the single-number alert price
                  (inner-edge for ROTATE bands, raw target for HOARD/DEPLOY anchors). */}
              <div style={{ paddingTop: '16px', borderTop: `1px solid ${colors.border}`, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '14px' }}>
                <div>
                  <div style={{ ...t.eyebrow, marginBottom: '6px' }}>Sell zone</div>
                  <div style={{ color: colors.highlight, fontWeight: 600, fontSize: '13px' }}>{currentLevels.sell}</div>
                  {(mode === 'ROTATE' || mode === 'HOARD') && alertLevels[mode.toLowerCase()].sellAlert != null && (
                    <div style={{ ...t.eyebrow, marginTop: '6px', color: colors.gold, letterSpacing: '0.12em', fontWeight: 500 }}>
                      Alert ${alertLevels[mode.toLowerCase()].sellAlert.toFixed(2)}
                    </div>
                  )}
                </div>
                <div>
                  <div style={{ ...t.eyebrow, marginBottom: '6px' }}>Buy zone</div>
                  <div style={{ color: colors.highlight, fontWeight: 600, fontSize: mode === 'DEPLOY' ? '10px' : '13px', lineHeight: 1.3 }}>{currentLevels.buy}</div>
                  {mode === 'ROTATE' && alertLevels.rotate.buyAlert != null && (
                    <div style={{ ...t.eyebrow, marginTop: '6px', color: colors.gold, letterSpacing: '0.12em', fontWeight: 500 }}>
                      Alert ${alertLevels.rotate.buyAlert.toFixed(2)}
                    </div>
                  )}
                  {mode === 'HOARD' && (
                    <div style={{ ...t.eyebrow, marginTop: '6px', color: colors.gold, letterSpacing: '0.12em', fontWeight: 500, lineHeight: 1.5 }}>
                      Alert ${alertLevels.hoard.buyAlert.toFixed(2)}
                      {alertLevels.hoard.buyDeepAlert != null && (
                        <><br/>+ ${alertLevels.hoard.buyDeepAlert.toFixed(2)} deep</>
                      )}
                    </div>
                  )}
                  {mode === 'DEPLOY' && alertLevels.deploy.ladder.length > 0 && (
                    <div style={{ ...t.eyebrow, marginTop: '6px', color: colors.gold, letterSpacing: '0.12em', fontWeight: 500, lineHeight: 1.5 }}>
                      Set {alertLevels.deploy.ladder.length} alerts:<br/>
                      {alertLevels.deploy.ladder.map(l => `$${l.toFixed(2)}`).join(' · ')}
                    </div>
                  )}
                </div>
                <div>
                  <div style={{ ...t.eyebrow, marginBottom: '6px' }}>Cash hold</div>
                  <div style={{ color: colors.highlight, fontWeight: 600, fontSize: '13px' }}>{cfg.cash}</div>
                </div>
              </div>

              {/* TIER 4: Footer — aggression style + auto/manual toggle */}
              <div style={{ marginTop: '16px', paddingTop: '14px', borderTop: `1px solid ${colors.border}` }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'wrap', marginBottom: '8px' }}>
                  <span style={{ ...t.eyebrow }}>Style</span>
                  {['conservative', 'moderate', 'aggressive'].map(s => {
                    const active = aggressionStyle === s;
                    return (
                      <button key={s} onClick={() => setAggressionStyle(s)} style={{
                        background: active ? cfg.color : 'transparent',
                        color: active ? '#000' : colors.textDim,
                        border: `1px solid ${active ? cfg.color : colors.border}`,
                        padding: '3px 9px', fontFamily: serif, fontSize: '10px',
                        letterSpacing: '0.1em', textTransform: 'uppercase',
                        cursor: 'pointer', fontWeight: active ? 600 : 400,
                        borderRadius: '2px', transition: 'all 0.15s',
                      }}>{s === 'moderate' ? 'Mod' : s.charAt(0).toUpperCase() + s.slice(1, 4)}</button>
                    );
                  })}
                  <span style={{ ...t.meta, color: colors.textMute, marginLeft: '4px', fontSize: '10px' }}>
                    {profile.rotationSizePctLow}–{profile.rotationSizePctHigh}% rotation
                  </span>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', ...t.meta, color: colors.textMute, fontSize: '10px', gap: '8px' }}>
                  <span style={{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {levelsAuto && technicals
                      ? `ATR(14) $${technicals.atr14.toFixed(1)} · ${technicals.low20.toFixed(0)}–${technicals.high20.toFixed(0)}${!ma200 ? ' · 200MA missing' : ''}`
                      : 'Manual levels'}
                  </span>
                  <span onClick={() => setLevelsAuto(!levelsAuto)} style={{ cursor: 'pointer', color: levelsAuto ? colors.green : colors.textMute, letterSpacing: '0.05em', flexShrink: 0 }}>
                    {levelsAuto ? '● auto' : '○ manual'}
                  </span>
                </div>
              </div>
            </div>

            {/* MANUAL LEVELS PANEL (when auto is off) */}
            {!levelsAuto && (
              <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '24px' }}>
                <SectionHeader>◆ Manual level overrides</SectionHeader>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', fontSize: '11px' }}>
                  <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Sell zone low</div><input type="number" value={manualSellLow} onChange={(e) => setManualSellLow(Number(e.target.value))} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '6px 10px', fontFamily: serif, fontSize: '12px' }} /></div>
                  <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Sell zone high</div><input type="number" value={manualSellHigh} onChange={(e) => setManualSellHigh(Number(e.target.value))} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '6px 10px', fontFamily: serif, fontSize: '12px' }} /></div>
                  <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Buy zone low</div><input type="number" value={manualBuyLow} onChange={(e) => setManualBuyLow(Number(e.target.value))} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '6px 10px', fontFamily: serif, fontSize: '12px' }} /></div>
                  <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Buy zone high</div><input type="number" value={manualBuyHigh} onChange={(e) => setManualBuyHigh(Number(e.target.value))} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '6px 10px', fontFamily: serif, fontSize: '12px' }} /></div>
                </div>
              </div>
            )}

            {/* TECHNICAL READOUT */}
            {levelsAuto && technicals && (
              <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '24px' }}>
                <SectionHeader>◆ Technical readout</SectionHeader>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: '12px', fontSize: '11px' }}>
                  <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>20d high</div><div style={{ color: colors.text, fontSize: '13px', marginTop: '2px' }}>${technicals.high20.toFixed(0)}</div></div>
                  <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>20d low</div><div style={{ color: colors.text, fontSize: '13px', marginTop: '2px' }}>${technicals.low20.toFixed(0)}</div></div>
                  <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>50d high</div><div style={{ color: colors.text, fontSize: '13px', marginTop: '2px' }}>${technicals.high50.toFixed(0)}</div></div>
                  <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>200d low</div><div style={{ color: colors.text, fontSize: '13px', marginTop: '2px' }}>${technicals.low200.toFixed(0)}</div></div>
                </div>
                <div style={{ marginTop: '12px', fontSize: '11px', color: colors.textDim }}>
                  ATR(14): ${technicals.atr14.toFixed(2)} — typical daily true range. Sell/buy bands set to ±0.4 ATR around target.
                </div>
              </div>
            )}

            {/* PORTFOLIO SUMMARY */}
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '24px' }}>
              <SectionHeader>◆ Portfolio</SectionHeader>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', fontSize: '12px', marginBottom: '16px' }}>
                <div>
                  <div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: '4px' }}>Position</div>
                  <div style={{ color: colors.highlight, fontSize: '20px', fontWeight: 600 }}>{journalStats.currentShares.toFixed(0)} sh</div>
                  <div style={{ color: colors.gold, fontSize: '13px', marginTop: '2px' }}>£{portfolio.positionGBP.toLocaleString(undefined, {maximumFractionDigits: 0})}</div>
                  <div style={{ color: colors.textMute, fontSize: '10px', marginTop: '2px' }}>${portfolio.positionUSD.toLocaleString(undefined, {maximumFractionDigits: 0})} · {portfolio.positionPct.toFixed(0)}% of total</div>
                </div>
                <div>
                  <div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: '4px' }}>Cash buffer</div>
                  <div style={{ color: colors.highlight, fontSize: '20px', fontWeight: 600 }}>£{cashBuffer.toLocaleString(undefined, {maximumFractionDigits: 0})}</div>
                  <div style={{ color: colors.gold, fontSize: '13px', marginTop: '2px' }}>&nbsp;</div>
                  <div style={{ color: portfolio.cashPct > 50 ? colors.gold : colors.textMute, fontSize: '10px', marginTop: '2px' }}>{portfolio.cashPct.toFixed(0)}% of total</div>
                </div>
              </div>
              <div style={{ paddingTop: '12px', borderTop: `1px solid ${colors.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                <span style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Total portfolio</span>
                <span style={{ color: colors.highlight, fontSize: '18px', fontWeight: 600 }}>£{portfolio.totalGBP.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
              </div>
              {/* Cash hold guidance vs mode */}
              {portfolio.cashPct > 30 && mode === 'ROTATE' && (
                <div style={{ marginTop: '12px', fontSize: '10px', color: colors.gold, padding: '8px 10px', background: '#1a1611', border: `1px dashed ${colors.gold}`, lineHeight: 1.5 }}>
                  ⚠ {portfolio.cashPct.toFixed(0)}% cash exceeds the 0–25% guideline for ROTATE mode. Consider deploying via DCA ladder.
                </div>
              )}
              <div style={{ marginTop: '14px' }}>
                <NumberInput value={cashBuffer} onChange={setCashBuffer} step={500} label="Cash buffer (GBP)" min={0} max={500000} />
                <NumberInput value={gbpUsd} onChange={setGbpUsd} step={0.01} label="GBP/USD rate" precision={2} min={0.5} max={3.0} />
              </div>
            </div>

            {/* CYCLE CLOCK */}
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '24px' }}>
              <SectionHeader>◆ BTC cycle clock</SectionHeader>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '12px' }}>
                <div><div style={{ fontSize: '10px', color: colors.textMute, letterSpacing: '0.1em' }}>ATH</div><div style={{ fontSize: '13px', color: colors.text }}>Oct 6, 2025</div><div style={{ fontSize: '11px', color: colors.gold }}>$126k</div></div>
                <div style={{ textAlign: 'center' }}><div style={{ fontSize: '24px', color: colors.gold, fontWeight: 600 }}>{cycleData.progress.toFixed(0)}%</div><div style={{ fontSize: '10px', color: colors.textMute, letterSpacing: '0.1em' }}>through correction</div></div>
                <div style={{ textAlign: 'right' }}><div style={{ fontSize: '10px', color: colors.textMute, letterSpacing: '0.1em' }}>Projected bottom</div><div style={{ fontSize: '13px', color: colors.text }}>Oct 6, 2026</div><div style={{ fontSize: '11px', color: colors.gold }}>$37–55k</div></div>
              </div>
              <div style={{ height: '8px', background: colors.bg, border: `1px solid ${colors.border}`, position: 'relative', overflow: 'hidden' }}>
                <div style={{ width: `${cycleData.progress}%`, height: '100%', background: `linear-gradient(90deg, ${colors.gold} 0%, ${colors.red} 100%)` }} />
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '10px', color: colors.textMute, marginTop: '6px' }}>
                <span>Day {cycleData.elapsed} of {cycleData.totalDays}</span>
                <span>{cycleData.remaining > 0 ? `${cycleData.remaining} days remaining` : `${Math.abs(cycleData.remaining)} days past`}</span>
              </div>
            </div>

            {/* SCORES */}
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '24px' }}>
              <div style={{ background: colors.panel, padding: '16px', border: `1px solid ${colors.border}` }}>
                <div style={{ fontSize: '10px', color: colors.textMute, letterSpacing: '0.15em', textTransform: 'uppercase', marginBottom: '8px' }}>Bear signals</div>
                <div style={{ fontSize: '28px', color: bearScore >= 6 ? colors.red : colors.gold, fontWeight: 600 }}>{bearScore}<span style={{ fontSize: '14px', color: colors.textFaint }}> / 13</span></div>
                <div style={{ fontSize: '10px', color: colors.textMute, marginTop: '4px' }}>≥6 → HOARD</div>
              </div>
              <div style={{ background: colors.panel, padding: '16px', border: `1px solid ${colors.border}` }}>
                <div style={{ fontSize: '10px', color: colors.textMute, letterSpacing: '0.15em', textTransform: 'uppercase', marginBottom: '8px' }}>Bottom signals</div>
                <div style={{ fontSize: '28px', color: bottomScore >= 7 ? colors.green : colors.gold, fontWeight: 600 }}>{bottomScore}<span style={{ fontSize: '14px', color: colors.textFaint }}> / 17</span></div>
                <div style={{ fontSize: '10px', color: colors.textMute, marginTop: '4px' }}>≥7 + MSTR&lt;$140 → DEPLOY</div>
              </div>
            </div>

            {/* mNAV */}
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '24px' }}>
              <SectionHeader>◆ mNAV tracker</SectionHeader>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', fontSize: '12px', marginBottom: '14px' }}>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>BTC per share</div><div style={{ color: colors.highlight, fontSize: '15px', marginTop: '2px' }}>{btcPerShare.toFixed(5)} BTC</div></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Fair value</div><div style={{ color: colors.highlight, fontSize: '15px', marginTop: '2px' }}>${fairValue.toFixed(2)}</div></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Current price</div><div style={{ color: colors.highlight, fontSize: '15px', marginTop: '2px' }}>${mstrPrice.toFixed(2)}</div></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>mNAV ratio</div><div style={{ color: mNAV > 1.5 ? colors.red : mNAV < 1.0 ? colors.green : colors.gold, fontSize: '15px', marginTop: '2px', fontWeight: 600 }}>{mNAV.toFixed(2)}x</div></div>
              </div>
              <div style={{ fontSize: '11px', color: colors.textDim, lineHeight: 1.6, borderTop: `1px solid ${colors.border}`, paddingTop: '12px' }}>
                {mNAV < 1.0 && '⚠ Below 1.0x: MSTR at discount to BTC holdings.'}
                {mNAV >= 1.0 && mNAV < 1.3 && 'Modest premium. Healthy accumulation zone.'}
                {mNAV >= 1.3 && mNAV < 1.8 && 'Standard premium.'}
                {mNAV >= 1.8 && '⚠ Elevated premium. Consider trimming.'}
              </div>
              <div style={{ marginTop: '14px' }}>
                <NumberInput value={btcHoldings} onChange={handleHoldingsChange} step={100} label="BTC holdings" min={0} max={5000000} />
                <NumberInput value={dilutedShares} onChange={handleSharesChange} step={1} label="Diluted shares (M)" precision={1} min={1} max={2000} />
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '10px', fontSize: '10px' }}>
                <span style={{ color: staleColor }}>Base updated: {corporateBaseUpdated || 'never'}{daysSinceBaseUpdate !== null && ` · ${daysSinceBaseUpdate}d ago`}</span>
                <a href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001050446&type=8-K&dateb=&owner=include&count=40" target="_blank" rel="noopener noreferrer" style={{ color: colors.gold, textDecoration: 'none' }}>verify via SEC ↗</a>
              </div>
            </div>

            <button onClick={saveSnapshot} style={{ width: '100%', background: colors.panel, border: `1px solid ${colors.gold}`, color: colors.gold, padding: '12px', fontFamily: serif, fontSize: '12px', letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', marginBottom: '24px' }}>
              ◆ Save snapshot to log
            </button>

            <div style={{ marginBottom: '24px' }}>
              <SectionHeader>◆ Manual price override</SectionHeader>
              <NumberInput value={mstrPrice} onChange={setMstrPrice} step={1} label="MSTR price" suffix="USD" min={1} max={1000} />
              <NumberInput value={btcPrice} onChange={setBtcPrice} step={500} label="BTC price" suffix="USD" min={1000} max={500000} />
            </div>

            <div style={{ marginBottom: '24px' }}>
              <SectionHeader>◆ On-chain readings (update weekly)</SectionHeader>
              <NumberInput value={nupl} onChange={setNupl} step={1} label="BTC NUPL" suffix="%" min={-100} max={100} />
              <NumberInput value={mvrv} onChange={setMvrv} step={0.1} label="BTC MVRV" precision={1} min={0} max={10} />
            </div>

            <div style={{ marginBottom: '24px' }}>
              <SectionHeader>◆ Bear signals</SectionHeader>
              <SignalToggle value={below200ma} onChange={setBelow200ma} label={`MSTR below 200-day MA${ma200 ? ` ($${ma200.toFixed(2)})` : ''}`} helperUrl="https://www.tradingview.com/symbols/NASDAQ-MSTR/" />
              <SignalToggle value={weeklyLowerLow} onChange={setWeeklyLowerLow} label="MSTR weekly lower-low after lower-high" helperUrl="https://www.tradingview.com/chart/?symbol=NASDAQ%3AMSTR&interval=W" />
              <SignalToggle value={fundingNegative} onChange={(v) => { setFundingNegative(v); if (v) setDerivativesExhaustion(false); }} label="BTC perp funding persistently negative (aggressive shorting)" helperUrl="https://www.coinglass.com/FundingRate" />
              <SignalToggle value={dxyAbove110} onChange={setDxyAbove110} label="DXY above 110" helperUrl="https://www.tradingview.com/symbols/TVC-DXY/" />
            </div>

            <div style={{ marginBottom: '24px' }}>
              <SectionHeader>◆ Bottom signals</SectionHeader>
              <SignalToggle value={derivativesExhaustion} onChange={(v) => { setDerivativesExhaustion(v); if (v) setFundingNegative(false); }} label="BTC derivatives exhaustion (funding flat + OI multi-month lows)" helperUrl="https://www.coinglass.com/BitcoinOpenInterest" bottomTone />
              <div style={{ fontSize: '10px', color: colors.textMute, lineHeight: 1.6, marginTop: '8px', paddingLeft: '14px' }}>Other bottom signals (extreme NUPL, MVRV, deep prices, cycle timing) score automatically.</div>
            </div>

            <div style={{ background: colors.panel, border: `1px solid ${colors.gold}`, padding: '20px', marginBottom: '24px' }}>
              <SectionHeader>◆ Prompt-driven update (3 steps)</SectionHeader>
              <div style={{ fontSize: '11px', color: colors.textDim, marginBottom: '12px', lineHeight: 1.6 }}>
                <strong style={{ color: colors.gold }}>Step 1:</strong> copy the prompt below. <strong style={{ color: colors.gold }}>Step 2:</strong> paste into a new Claude chat, get the response. <strong style={{ color: colors.gold }}>Step 3:</strong> paste Claude's response into the panel below — fields auto-populate.
              </div>
              <textarea readOnly value={claudePrompt} style={{ width: '100%', height: '220px', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '12px', fontFamily: 'Menlo, monospace', fontSize: '11px', resize: 'vertical', lineHeight: 1.5, boxSizing: 'border-box' }} />
              <button onClick={copyPrompt} style={{ width: '100%', marginTop: '10px', background: promptCopied ? colors.green : colors.gold, color: colors.bg, border: 'none', padding: '10px', fontFamily: serif, fontSize: '12px', letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', fontWeight: 600, transition: 'background 0.2s' }}>{promptCopied ? '✓ copied' : '◆ copy prompt'}</button>

              <div style={{ marginTop: '20px', paddingTop: '20px', borderTop: `1px solid ${colors.border}` }}>
                <div style={{ fontSize: '11px', letterSpacing: '0.15em', color: colors.textDim, textTransform: 'uppercase', marginBottom: '10px', fontFamily: serif }}>
                  ◆ Paste Claude's response here
                </div>
                <textarea
                  value={pasteText}
                  onChange={(e) => setPasteText(e.target.value)}
                  placeholder={`Paste the code block (or the whole response) here. Expected format:\n\nMSTR_PRICE: 164\nBTC_PRICE: 77000\nNUPL: 28\nMVRV: 1.0\n...`}
                  style={{ width: '100%', height: '140px', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '12px', fontFamily: 'Menlo, monospace', fontSize: '11px', resize: 'vertical', lineHeight: 1.5, boxSizing: 'border-box' }}
                />
                <button onClick={applyPaste} style={{ width: '100%', marginTop: '10px', background: colors.green, color: '#fff', border: 'none', padding: '10px', fontFamily: serif, fontSize: '12px', letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', fontWeight: 600 }}>
                  ◆ apply readings
                </button>
                {pasteResult && (
                  <div style={{
                    marginTop: '10px', fontSize: '11px', padding: '10px 12px',
                    background: pasteResult.ok ? '#0f1a13' : '#1a0f0d',
                    border: `1px dashed ${pasteResult.ok ? colors.green : colors.red}`,
                    color: pasteResult.ok ? colors.green : colors.red,
                    lineHeight: 1.5,
                  }}>
                    {pasteResult.ok ? '✓ ' : '⚠ '}{pasteResult.msg}
                  </div>
                )}
              </div>
            </div>
          </>
        )}

        {view === 'positions' && (
          <>
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '20px' }}>
              <SectionHeader>◆ Open new position</SectionHeader>
              <div style={{ fontSize: '11px', color: colors.textDim, marginBottom: '14px' }}>
                Positions track open trades separately from the closed-trade Journal. Closing a position auto-writes a paired entry into Journal so realised P&amp;L still flows through campaign stats.
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', fontSize: '11px', marginBottom: '12px' }}>
                <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Shares</div><input type="number" placeholder="Shares" value={positionForm.shares} onChange={(e) => setPositionForm({ ...positionForm, shares: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
                <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Entry price (USD)</div><input type="number" placeholder="Entry" value={positionForm.entryPrice} onChange={(e) => setPositionForm({ ...positionForm, entryPrice: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
                <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Stop (optional)</div><input type="number" placeholder="Stop" value={positionForm.stop} onChange={(e) => setPositionForm({ ...positionForm, stop: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
                <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Target (optional)</div><input type="number" placeholder="Target" value={positionForm.target} onChange={(e) => setPositionForm({ ...positionForm, target: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
                <div style={{ gridColumn: 'span 2' }}><div style={{ color: colors.textMute, marginBottom: '4px' }}>Tag / origin</div><input type="text" placeholder="e.g. ROTATE-BUY, HOARD-SELL, MANUAL" value={positionForm.tag} onChange={(e) => setPositionForm({ ...positionForm, tag: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
                <div style={{ gridColumn: 'span 2' }}><div style={{ color: colors.textMute, marginBottom: '4px' }}>Notes</div><input type="text" placeholder="Optional notes" value={positionForm.notes} onChange={(e) => setPositionForm({ ...positionForm, notes: e.target.value })} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} /></div>
              </div>
              <button onClick={() => openPosition()} disabled={!positionForm.shares || !positionForm.entryPrice} style={{ width: '100%', background: positionForm.shares && positionForm.entryPrice ? colors.green : colors.border, color: '#fff', border: 'none', padding: '10px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.15em', cursor: positionForm.shares && positionForm.entryPrice ? 'pointer' : 'not-allowed' }}>
                OPEN POSITION
              </button>
            </div>

            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px' }}>
              <SectionHeader>◆ Positions ({positions.filter(p => p.status === 'OPEN').length} open · {positions.filter(p => p.status === 'CLOSED').length} closed)</SectionHeader>
              {positions.length === 0 ? (
                <div style={{ color: colors.textFaint, fontSize: '12px', textAlign: 'center', padding: '20px 0' }}>No positions yet. Open one above, or tap OPEN on a live trigger from the Dashboard.</div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  {[...positions].sort((a, b) => (b.openedAt || '').localeCompare(a.openedAt || '')).map(p => {
                    const isOpen = p.status === 'OPEN';
                    const livePnL = isOpen ? (mstrPrice - p.entryPrice) * p.shares : (p.exitPrice - p.entryPrice) * p.shares - (p.exitFees || 0);
                    const livePnLPct = isOpen ? ((mstrPrice / p.entryPrice) - 1) * 100 : ((p.exitPrice / p.entryPrice) - 1) * 100;
                    const pnlColor = livePnL >= 0 ? colors.green : colors.red;
                    return (
                      <div key={p.id} style={{ background: colors.bg, border: `1px solid ${isOpen ? colors.border : '#222'}`, padding: '12px', opacity: isOpen ? 1 : 0.65 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '8px', gap: '8px', flexWrap: 'wrap' }}>
                          <div>
                            <span style={{ fontSize: '10px', color: isOpen ? colors.green : colors.textMute, letterSpacing: '0.15em', textTransform: 'uppercase' }}>{p.status}</span>
                            <span style={{ fontSize: '10px', color: colors.textMute, marginLeft: '8px', letterSpacing: '0.1em' }}>{p.tag}</span>
                          </div>
                          <div style={{ fontSize: '10px', color: colors.textFaint }}>{(p.openedAt || '').slice(0, 10)}</div>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', fontSize: '11px', marginBottom: '8px' }}>
                          <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Shares</div><div style={{ color: colors.text, fontWeight: 600 }}>{p.shares}</div></div>
                          <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Entry</div><div style={{ color: colors.text, fontWeight: 600 }}>${p.entryPrice.toFixed(2)}</div></div>
                          <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>{isOpen ? 'Live' : 'Exit'}</div><div style={{ color: pnlColor, fontWeight: 600 }}>{isOpen ? `$${mstrPrice.toFixed(2)}` : `$${p.exitPrice.toFixed(2)}`}</div></div>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '11px', marginBottom: isOpen ? '10px' : 0 }}>
                          <div style={{ color: colors.textMute }}>
                            {p.stop ? `Stop $${p.stop}` : '—'} · {p.target ? `Target $${p.target}` : '—'}
                          </div>
                          <div style={{ color: pnlColor, fontWeight: 600 }}>
                            {livePnL >= 0 ? '+' : ''}${livePnL.toFixed(0)} ({livePnLPct >= 0 ? '+' : ''}{livePnLPct.toFixed(1)}%)
                          </div>
                        </div>
                        {p.notes && <div style={{ fontSize: '10px', color: colors.textFaint, fontStyle: 'italic', marginBottom: isOpen ? '10px' : 0 }}>{p.notes}</div>}
                        {isOpen && (
                          <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                            <input
                              type="number"
                              placeholder="Exit price"
                              value={exitPrices[p.id] ?? ''}
                              onChange={(e) => setExitPrices(prev => ({ ...prev, [p.id]: e.target.value }))}
                              style={{ flex: 1, background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '6px 8px', fontFamily: serif, fontSize: '11px', borderRadius: '2px' }}
                            />
                            <button
                              onClick={() => {
                                const v = exitPrices[p.id];
                                if (v && !isNaN(parseFloat(v))) {
                                  closePosition(p.id, v, 0);
                                  setExitPrices(prev => { const next = { ...prev }; delete next[p.id]; return next; });
                                }
                              }}
                              disabled={!exitPrices[p.id]}
                              style={{
                                background: exitPrices[p.id] ? colors.red : colors.border,
                                color: '#fff', border: 'none', padding: '6px 12px',
                                fontFamily: serif, fontSize: '10px', letterSpacing: '0.1em',
                                cursor: exitPrices[p.id] ? 'pointer' : 'not-allowed', borderRadius: '2px', fontWeight: 600,
                              }}>CLOSE</button>
                            <button onClick={() => deletePosition(p.id)} style={{ background: 'transparent', border: `1px solid ${colors.border}`, color: colors.textMute, padding: '6px 10px', fontFamily: serif, fontSize: '10px', cursor: 'pointer', borderRadius: '2px' }}>✕</button>
                          </div>
                        )}
                        {!isOpen && (
                          <div style={{ marginTop: '8px', display: 'flex', justifyContent: 'flex-end' }}>
                            <button onClick={() => deletePosition(p.id)} style={{ background: 'transparent', border: `1px solid ${colors.border}`, color: colors.textMute, padding: '4px 8px', fontFamily: serif, fontSize: '9px', cursor: 'pointer' }}>DELETE</button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </>
        )}

        {view === 'backup' && (
          <>
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '20px' }}>
              <SectionHeader>◆ Export state</SectionHeader>
              <div style={{ fontSize: '11px', color: colors.textDim, marginBottom: '14px', lineHeight: 1.6 }}>
                Full JSON snapshot — settings, trades, positions, snapshots. State auto-persists in this browser's local storage; export is your portable backup, useful for moving between devices or as a periodic safety copy.
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                <button onClick={exportJSONFile} style={{ background: colors.gold, color: '#000', border: 'none', padding: '10px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.15em', cursor: 'pointer', borderRadius: '2px', fontWeight: 600 }}>DOWNLOAD .JSON</button>
                <button onClick={exportJSON} style={{ background: 'transparent', color: colors.gold, border: `1px solid ${colors.gold}`, padding: '10px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.15em', cursor: 'pointer', borderRadius: '2px' }}>COPY TO CLIPBOARD</button>
              </div>
              {importResult?.payload && (
                <textarea readOnly value={importResult.payload} style={{ width: '100%', marginTop: '12px', height: '160px', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: 'monospace', fontSize: '10px' }} />
              )}
            </div>
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px' }}>
              <SectionHeader>◆ Import state</SectionHeader>
              <div style={{ fontSize: '11px', color: colors.textDim, marginBottom: '14px', lineHeight: 1.6 }}>
                Upload a previously-downloaded <code style={{ background: colors.bg, padding: '1px 4px', fontSize: '10px' }}>.json</code> file, or paste the payload manually. Overwrites trades, positions, snapshots, and settings.
              </div>
              <label style={{ display: 'block', marginBottom: '12px' }}>
                <span style={{ display: 'inline-block', background: 'transparent', color: colors.textDim, border: `1px dashed ${colors.border}`, padding: '8px 14px', fontFamily: serif, fontSize: '10px', letterSpacing: '0.1em', cursor: 'pointer', borderRadius: '2px', textTransform: 'uppercase' }}>
                  Choose .json file
                </span>
                <input type="file" accept="application/json,.json" onChange={(e) => importJSONFile(e.target.files?.[0])} style={{ display: 'none' }} />
              </label>
              <textarea value={importText} onChange={(e) => setImportText(e.target.value)} placeholder='{"version":13,...}' style={{ width: '100%', height: '140px', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: 'monospace', fontSize: '10px', marginBottom: '12px' }} />
              <button onClick={importJSON} disabled={!importText.trim()} style={{ width: '100%', background: importText.trim() ? colors.green : colors.border, color: '#fff', border: 'none', padding: '10px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.15em', cursor: importText.trim() ? 'pointer' : 'not-allowed', borderRadius: '2px', fontWeight: 600 }}>IMPORT JSON</button>
              {importResult && (
                <div style={{ marginTop: '12px', fontSize: '11px', color: importResult.ok ? colors.green : colors.red, padding: '8px 12px', border: `1px dashed ${importResult.ok ? colors.green : colors.red}` }}>
                  {importResult.ok ? '✓ ' : '⚠ '}{importResult.msg}
                </div>
              )}
            </div>
          </>
        )}

        {view === 'journal' && (
          <>
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '20px' }}>
              <SectionHeader>◆ Campaign progress</SectionHeader>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', fontSize: '12px', marginBottom: '16px' }}>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Starting shares</div><input type="number" value={startingShares} onChange={(e) => setStartingShares(Number(e.target.value))} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.highlight, padding: '6px 10px', fontFamily: serif, fontSize: '15px', marginTop: '4px' }} /></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Current shares</div><div style={{ color: colors.highlight, fontSize: '20px', marginTop: '4px', fontWeight: 600 }}>{journalStats.currentShares.toFixed(0)}</div></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Δ shares</div><div style={{ color: journalStats.sharesDelta >= 0 ? colors.green : colors.red, fontSize: '20px', marginTop: '4px', fontWeight: 600 }}>{journalStats.sharesDelta >= 0 ? '+' : ''}{journalStats.sharesDelta.toFixed(0)} ({journalStats.sharesPct.toFixed(1)}%)</div></div>
                <div><div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Net cash flow</div><div style={{ color: colors.highlight, fontSize: '15px', marginTop: '4px' }}>${journalStats.totalCash.toFixed(0)}</div></div>
              </div>
              <div style={{ paddingTop: '14px', borderTop: `1px solid ${colors.border}` }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', fontSize: '12px' }}>
                  <div>
                    <div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Rotation shares</div>
                    <div style={{ color: journalStats.rotationShares >= 0 ? colors.green : colors.red, fontSize: '20px', marginTop: '4px', fontWeight: 600 }}>
                      {journalStats.rotationShares >= 0 ? '+' : ''}{journalStats.rotationShares.toFixed(0)}
                    </div>
                    <div style={{ color: colors.textMute, fontSize: '10px', marginTop: '2px' }}>from {journalStats.completedRotations} completed rotation{journalStats.completedRotations !== 1 ? 's' : ''}</div>
                  </div>
                  <div>
                    <div style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Avg per rotation</div>
                    <div style={{ color: colors.highlight, fontSize: '20px', marginTop: '4px', fontWeight: 600 }}>
                      {journalStats.completedRotations > 0 ? `+${(journalStats.rotationShares / journalStats.completedRotations).toFixed(1)}` : '—'}
                    </div>
                    <div style={{ color: colors.textMute, fontSize: '10px', marginTop: '2px' }}>shares per cycle</div>
                  </div>
                </div>
                <div style={{ fontSize: '10px', color: colors.textMute, marginTop: '12px', lineHeight: 1.5, fontStyle: 'italic' }}>
                  Rotation shares = cumulative SELL→BUY pair differences. Pairs match each SELL with the next BUY. Direct buys (no preceding SELL) count as accumulation, not rotation.
                </div>
              </div>
            </div>

            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '20px' }}>
              <SectionHeader>◆ Add trade</SectionHeader>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '12px' }}>
                <div style={{ display: 'flex', gap: '8px' }}>
                  <button onClick={() => setTradeType('SELL')} style={{ flex: 1, background: tradeType === 'SELL' ? colors.red : 'transparent', color: tradeType === 'SELL' ? '#fff' : colors.textDim, border: `1px solid ${tradeType === 'SELL' ? colors.red : colors.border}`, padding: '8px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.1em', cursor: 'pointer' }}>SELL</button>
                  <button onClick={() => setTradeType('BUY')} style={{ flex: 1, background: tradeType === 'BUY' ? colors.green : 'transparent', color: tradeType === 'BUY' ? '#fff' : colors.textDim, border: `1px solid ${tradeType === 'BUY' ? colors.green : colors.border}`, padding: '8px', fontFamily: serif, fontSize: '11px', letterSpacing: '0.1em', cursor: 'pointer' }}>BUY</button>
                </div>
                <input type="date" value={tradeDate} onChange={(e) => setTradeDate(e.target.value)} style={{ background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} />
                <input type="number" placeholder="Shares" value={tradeShares} onChange={(e) => setTradeShares(e.target.value)} style={{ background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} />
                <input type="number" placeholder="Price (USD)" value={tradePrice} onChange={(e) => setTradePrice(e.target.value)} style={{ background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} />
                <input type="number" placeholder="Fees (USD, optional)" value={tradeFees} onChange={(e) => setTradeFees(e.target.value)} style={{ gridColumn: 'span 2', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '8px', fontFamily: serif, fontSize: '12px' }} />
              </div>
              <button onClick={addTrade} style={{ width: '100%', background: colors.gold, color: colors.bg, border: 'none', padding: '10px', fontFamily: serif, fontSize: '12px', letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', fontWeight: 600 }}>+ Log trade</button>
            </div>

            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px' }}>
              <SectionHeader>◆ Trade history</SectionHeader>
              {trades.length === 0 ? <div style={{ color: colors.textFaint, fontSize: '12px', textAlign: 'center', padding: '20px 0' }}>No trades logged yet.</div>
                : [...trades].sort((a, b) => b.date.localeCompare(a.date)).map(t => (
                  <div key={t.id} style={{ display: 'grid', gridTemplateColumns: '60px 1fr 1fr 1fr 30px', gap: '10px', padding: '10px 0', borderBottom: `1px solid ${colors.border}`, fontSize: '12px', alignItems: 'center' }}>
                    <span style={{ color: t.type === 'SELL' ? colors.red : colors.green, fontWeight: 600, letterSpacing: '0.1em', fontSize: '10px' }}>{t.type}</span>
                    <span style={{ color: colors.textDim }}>{t.date}</span>
                    <span style={{ color: colors.text }}>{t.shares} sh</span>
                    <span style={{ color: colors.gold }}>${t.price}</span>
                    <button onClick={() => deleteTrade(t.id)} style={{ background: 'transparent', border: 'none', color: colors.textFaint, cursor: 'pointer', fontSize: '14px' }}>×</button>
                  </div>
                ))}
            </div>
          </>
        )}

        {view === 'snapshots' && (
          <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px' }}>
            <SectionHeader>◆ Signal evolution log</SectionHeader>
            <div style={{ fontSize: '11px', color: colors.textDim, marginBottom: '16px', lineHeight: 1.6 }}>Save weekly snapshots. Trends matter more than any single reading.</div>
            {snapshots.length === 0 ? <div style={{ color: colors.textFaint, fontSize: '12px', textAlign: 'center', padding: '20px 0' }}>No snapshots saved yet.</div>
              : [...snapshots].reverse().map((s) => (
                <div key={s.date} style={{ padding: '12px 0', borderBottom: `1px solid ${colors.border}`, fontSize: '11px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                    <span style={{ color: colors.textDim }}>{new Date(s.date).toLocaleDateString()} {new Date(s.date).toLocaleTimeString().slice(0,5)}</span>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                      <span style={{ color: modeCfg[s.mode]?.color || colors.gold, fontWeight: 600, fontSize: '10px', letterSpacing: '0.1em' }}>{s.mode}</span>
                      <button onClick={() => deleteSnapshot(s.date)} style={{ background: 'transparent', border: 'none', color: colors.textFaint, cursor: 'pointer', fontSize: '14px' }}>×</button>
                    </div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '8px', color: colors.textMute, fontSize: '10px' }}>
                    <span>MSTR ${s.mstrPrice?.toFixed(0)}</span>
                    <span>BTC ${(s.btcPrice/1000).toFixed(0)}k</span>
                    <span>mNAV {s.mNAV}x</span>
                    <span>Bear {s.bearScore}</span>
                    <span>Bottom {s.bottomScore}</span>
                  </div>
                </div>
              ))}
          </div>
        )}

        <div style={{ textAlign: 'center', marginTop: '32px', fontSize: '10px', color: colors.textFaint, letterSpacing: '0.15em' }}>
          NOT FINANCIAL ADVICE · YOUR THESIS · YOUR CONVICTION · YOUR DECISION
        </div>
      </div>
    </div>
  );
}

// =====================================================================
// APP ROOT (handles gate → tool transition)
// =====================================================================
function App() {
  const [unlocked, setUnlocked] = useState(() => {
    if (!AUTH_REQUIRED) return true;
    try { return sessionStorage.getItem(AUTH_SESSION_KEY) === '1'; } catch (e) { return false; }
  });

  if (!unlocked) return <Gate onUnlock={() => setUnlocked(true)} />;
  return <MSTRCycleTool />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
