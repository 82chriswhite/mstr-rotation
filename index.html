<script>
  const PASSWORD_HASH = '021ab4d101785587d5ddc3e3715150393924c9df228cb6732c40da48a6cfc7c4';
  const AUTH_REQUIRED = true;
  const AUTH_SESSION_KEY = 'mstr:auth';
  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function tryUnlock(input) {
    const h = await sha256Hex(input);
    return h === PASSWORD_HASH;
  }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

function Gate({ onUnlock }) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!pw) return;
    setBusy(true); setErr('');
    const ok = await tryUnlock(pw);
    setBusy(false);
    if (ok) { try { sessionStorage.setItem(AUTH_SESSION_KEY,'1'); } catch(e){} onUnlock(); }
    else { setErr('Incorrect password.'); setPw(''); }
  };
  return (
    <div className="gate"><div className="gate-card">
      <div className="gate-title">MSTR Cycle Tool</div>
      <div className="gate-sub">Enter password to continue.</div>
      <input type="password" className="gate-input" autoFocus value={pw}
        onChange={e=>setPw(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submit();}} placeholder="Password"/>
      <button className="gate-btn" onClick={submit} disabled={busy||!pw}>{busy?'Checking…':'Unlock'}</button>
      <div className="gate-err">{err}</div>
    </div></div>
  );
}

function ZoneHitPrompt({ hit, onActed, onMissed, onDismiss }) {
  if (!hit) return null;
  const isSell = hit.side === 'SELL';
  const bc = isSell ? '#c73e1d' : '#2d8659';
  return (
    <div className="zone-overlay">
      <div className="zone-card" style={{border:`2px solid ${bc}`}}>
        <div style={{fontSize:'9px',color:'#8a7a65',letterSpacing:'0.2em',textTransform:'uppercase',marginBottom:'8px'}}>Zone detected · {new Date().toLocaleTimeString().slice(0,5)}</div>
        <div style={{fontSize:'16px',color:bc,fontWeight:700,letterSpacing:'0.05em',marginBottom:'6px'}}>{isSell?'▲ SELL ZONE HIT':'▼ BUY ZONE HIT'}</div>
        <div style={{fontSize:'13px',color:'#d4c8b8',marginBottom:'4px'}}>{hit.label}</div>
        <div style={{fontSize:'12px',color:'#a89580',marginBottom:'20px'}}>Zone: {hit.zone} · Current: ${hit.price.toFixed(2)}</div>
        <div style={{fontSize:'13px',color:'#d4c8b8',marginBottom:'16px',fontStyle:'italic'}}>Did you act on this zone?</div>
        <div style={{display:'flex',gap:'10px'}}>
          <button onClick={onActed} style={{flex:1,background:bc,color:'#fff',border:'none',padding:'11px',fontFamily:'Georgia,serif',fontSize:'11px',letterSpacing:'0.15em',textTransform:'uppercase',cursor:'pointer',fontWeight:700,borderRadius:'2px'}}>Yes — log trade</button>
          <button onClick={onMissed} style={{flex:1,background:'transparent',color:'#a89580',border:'1px solid #2a2520',padding:'11px',fontFamily:'Georgia,serif',fontSize:'11px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer',borderRadius:'2px'}}>No — missed</button>
        </div>
        <button onClick={onDismiss} style={{width:'100%',marginTop:'8px',background:'transparent',color:'#5a5048',border:'none',padding:'6px',fontFamily:'Georgia,serif',fontSize:'10px',letterSpacing:'0.1em',cursor:'pointer'}}>dismiss without logging</button>
      </div>
    </div>
  );
}

    const diverged=mNAVdiscrepancy!==null&&mNAVdiscrepancy>MNAV_WARN;

    return{value:mNAV,overridden:false,parsedWas:null};
  },[recomputedMnav,mNAV,mNAVdiscrepancy,parsedMnav]);

  const MVRV_PEAK=3.0,MVRV_FLOOR=0.8;

    const ath=new Date('2025-10-06'),target=new Date('2026-10-06'),now=new Date();
    const totalDays=Math.round((target-ath)/86400000);
    const elapsed=Math.round((now-ath)/86400000);
    const remaining=Math.round((target-now)/86400000);
    const progress=Math.min(100,Math.max(0,(elapsed/totalDays)*100));
    return{totalDays,elapsed,remaining,progress};

    const progress=Math.min(100,Math.max(0,((MVRV_PEAK-mvrv)/(MVRV_PEAK-MVRV_FLOOR))*100));
    let zone,zoneColor;
    if(mvrv>=3.0){zone='Euphoria — peak distribution risk';zoneColor='#c73e1d';}

    else if(mvrv>=1.0){zone='Healthy — within normal range';zoneColor='#d4a017';}
    else if(mvrv>=0.8){zone='Compressed — approaching floor';zoneColor='#2d8659';}
    else{zone='Capitulation — below cost basis';zoneColor='#2d8659';}
    const pctToFloor=Math.max(0,((mvrv-MVRV_FLOOR)/(MVRV_PEAK-MVRV_FLOOR))*100);
    return{progress,zone,zoneColor,pctToFloor};
  },[mvrv]);

  const daysSinceBaseUpdate=useMemo(()=>{
    if(!corporateBaseUpdated)return null;
    return Math.floor((new Date()-new Date(corporateBaseUpdated))/86400000);

      }

  const addTrade=()=>{
    const sharesNum = parseFloat(tradeShares);
    const inputNum = parseFloat(tradePriceInput);
    if(!sharesNum || sharesNum <= 0 || !inputNum || inputNum <= 0) return;

    let finalPriceUsd = 0;
    let totalProceedsGbp = 0;

    if(tradePriceMode === 'USD') {
      finalPriceUsd = inputNum;
      totalProceedsGbp = (sharesNum * finalPriceUsd) / gbpUsd;
    } else if(tradePriceMode === 'GBP_TOTAL') {
      totalProceedsGbp = inputNum;
      const pricePerShareGbp = totalProceedsGbp / sharesNum;
      finalPriceUsd = pricePerShareGbp * gbpUsd;
    } else if(tradePriceMode === 'GBP_PRICE') {
      totalProceedsGbp = inputNum * sharesNum;
      finalPriceUsd = inputNum * gbpUsd;
    } else if(tradePriceMode === 'GBX') {
      const pricePerShareGbp = inputNum / 100;
      totalProceedsGbp = pricePerShareGbp * sharesNum;
      finalPriceUsd = pricePerShareGbp * gbpUsd;
    }

    const trade={
      id: Date.now(),
      date: tradeDate,
      type: tradeType,
      shares: sharesNum,
      price: parseFloat(finalPriceUsd.toFixed(2)),
      priceGbp: parseFloat((totalProceedsGbp / sharesNum).toFixed(2)),
      totalGbp: parseFloat(totalProceedsGbp.toFixed(2)),
      fees: parseFloat(tradeFees)||0
    };

    const updated=[...trades, trade];
    setTrades(updated);
    try{localStorage.setItem('mstr:trades',JSON.stringify(updated));}catch(e){}

    if(autoSyncCash) {
      if(tradeType === 'SELL') {
        const newCash = cashBuffer + totalProceedsGbp;
        setCashBuffer(parseFloat(newCash.toFixed(2)));
      } else {
        const newCash = Math.max(0, cashBuffer - totalProceedsGbp);
        setCashBuffer(parseFloat(newCash.toFixed(2)));
      }
    }

    setTradeShares('');
    setTradePriceInput('');
    setTradeFees('');
  };

        {priceRange?.pct!==null&&priceRange?.pct!==undefined&&mode==='ROTATE'&&(

        {mode==='DEPLOY'&&levelsAuto&&dynamicLevels&&<div style={{marginBottom:'14px',padding:'8px 12px',background:'#0d1510',border:`1px dashed ${C.green}`,borderRadius:'3px',fontSize:'10px',color:C.mute,lineHeight:1.5}}>

                  </div>
                </div>);

              return(<div style={{background:'rgba(45,134,89,0.08)',border:`1px solid ${C.green}`,padding:'12px',borderRadius:'3px'}}>
                <div style={{fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:C.green,marginBottom:'8px',fontWeight:600}}>● Buy trigger live</div>
                {bh.map(h=><div key={h.tag} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'4px'}}>
                  <div style={{fontSize:'11px',color:C.text}}><div style={{fontSize:'12px',fontWeight:600}}>{h.label}</div><div style={{fontSize:'11px',color:C.dim}}>@ {h.zone}</div></div>
                  <button onClick={()=>{setView('positions');setPositionForm(pf=>({...pf,entryPrice:String(h.price),tag:h.tag}));}} style={{background:C.green,border:'none',color:'#fff',padding:'6px 12px',fontFamily:S,fontSize:'10px',letterSpacing:'0.12em',fontWeight:600,cursor:'pointer',borderRadius:'2px'}}>BUY</button>
                </div>)}
              </div>);
            })()}
          </div>);

        <div style={{paddingTop:'16px',borderTop:`1px solid ${C.border}`}}>
          <div className="g-auto-3" style={{gap:'14px'}}>
            <div>
              <div style={{fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:C.mute,marginBottom:'6px'}}>Sell zone</div>
              {hoardSellThrottled
                ? <div style={{color:C.green,fontWeight:600,fontSize:'13px'}}>Throttled</div>

              {!hoardSellThrottled&&(mode==='ROTATE'||mode==='HOARD')&&alertLevels[mode.toLowerCase()].sellAlert!=null&&<div style={{fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',color:C.gold,marginTop:'6px',fontWeight:500}}>Alert ${alertLevels[mode.toLowerCase()].sellAlert.toFixed(2)}</div>}
              {hoardSellThrottled&&<div style={{fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',color:C.green,marginTop:'6px',fontWeight:500,lineHeight:1.5}}>Cash ≥{HOARD_SELL_CEILING_PCT}%<br/>Sell suspended</div>}
            </div>
            <div>
              <div style={{fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:C.mute,marginBottom:'6px'}}>Buy zone</div>
              <div style={{color:C.hi,fontWeight:600,fontSize:mode==='DEPLOY'?'10px':'13px',lineHeight:1.3}}>{currentLevels.buy}</div>
              {mode==='ROTATE'&&alertLevels.rotate.buyAlert!=null&&<div style={{fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',color:C.gold,marginTop:'6px',fontWeight:500}}>Alert ${alertLevels.rotate.buyAlert.toFixed(2)}</div>}
              {mode==='HOARD'&&<div style={{fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',color:C.gold,marginTop:'6px',fontWeight:500,lineHeight:1.5}}>Alert ${alertLevels.hoard.buyAlert.toFixed(2)}{alertLevels.hoard.buyDeepAlert!=null&&<><br/>+ ${alertLevels.hoard.buyDeepAlert.toFixed(2)} deep</>}</div>}
              {mode==='DEPLOY'&&alertLevels.deploy.ladder.length>0&&<div style={{fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',color:C.gold,marginTop:'6px',fontWeight:500,lineHeight:1.5}}>Set {alertLevels.deploy.ladder.length} alerts:<br/>{alertLevels.deploy.ladder.map(l=>`$${l.toFixed(2)}`).join(' · ')}</div>}

        </div>

        {(mode==='ROTATE'||mode==='HOARD')&&(
          <div style={{marginTop:'20px',paddingTop:'16px',borderTop:`1px solid ${C.border}`}}>

            <div style={{display:'flex',gap:'8px',marginBottom:'10px',flexWrap:'wrap'}}>
              <div style={{flex:'1 1 100px',minWidth:'90px'}}>
                <div style={{fontSize:'9px',color:C.mute,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:'4px'}}>Shares to sell</div>
                <input type="number" placeholder={sizingGuardrail?String(sizingGuardrail.maxSellShares):'e.g. 50'} value={beqSellShares} onChange={e=>setBeqSellShares(e.target.value)} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'7px 10px',fontFamily:S,fontSize:'13px'}}/>
              </div>
              <div style={{flex:'1 1 100px',minWidth:'90px'}}>
                <div style={{fontSize:'9px',color:C.mute,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:'4px'}}>Sell price (USD)</div>
                <input type="number" placeholder={`${mstrPrice.toFixed(2)}`} value={beqSellPrice} onChange={e=>setBeqSellPrice(e.target.value)} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'7px 10px',fontFamily:S,fontSize:'13px'}}/>
              </div>
            </div>
            {beqCalc?(
              <div style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:'3px',padding:'12px 14px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'10px'}}>
                  <div>
                    <div style={{fontSize:'9px',color:C.mute,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'2px'}}>Breakeven buyback</div>
                    <div style={{color:C.gold,fontSize:'20px',fontWeight:700}}>${beqCalc.breakeven.toFixed(2)}</div>
                    <div style={{fontSize:'9px',color:C.mute,marginTop:'2px'}}>buy back ≤ this price to net ≥1 extra share</div>

                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:'9px',color:C.mute,marginBottom:'2px'}}>Proceeds</div>
                    <div style={{color:C.text,fontSize:'13px',fontWeight:600}}>${Math.round(beqCalc.proceeds).toLocaleString()}</div>
                    <div style={{fontSize:'9px',color:C.mute,marginTop:'2px'}}>{beqCalc.sh.toFixed(0)} sh @ ${beqCalc.sp.toFixed(2)}</div>

                <div style={{borderTop:`1px solid ${C.border}`,paddingTop:'8px'}}>
                  <div style={{fontSize:'9px',color:C.mute,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'6px'}}>Shares gained at buyback discount</div>
                  {beqCalc.steps.map(step=>(
                    <div key={step.pct} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:'11px',marginBottom:'3px'}}>
                      <span style={{color:C.mute}}>−{step.pct.toFixed(0)}% → ${step.buyPrice.toFixed(2)}</span>
                      <span style={{color:step.netExtra>0?C.green:C.red,fontWeight:600}}>{step.netExtra>0?'+':''}{step.netExtra.toFixed(2)} sh net</span>

          </div>

        <SH>◆ Portfolio</SH>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',fontSize:'12px',marginBottom:'16px'}}>
          <div><div style={{color:C.mute,fontSize:'10px',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'4px'}}>Position</div><div style={{color:C.hi,fontSize:'20px',fontWeight:600}}>{journalStats.currentShares.toFixed(0)} sh</div><div style={{color:C.gold,fontSize:'13px',marginTop:'2px'}}>£{portfolio.positionGBP.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div style={{color:C.mute,fontSize:'10px',marginTop:'2px'}}>${portfolio.positionUSD.toLocaleString(undefined,{maximumFractionDigits:0})} · {portfolio.positionPct.toFixed(0)}%</div></div>
          <div><div style={{color:C.mute,fontSize:'10px',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'4px'}}>Cash buffer</div><div style={{color:C.hi,fontSize:'20px',fontWeight:600}}>£{cashBuffer.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div style={{color:portfolio.cashPct>50?C.gold:C.mute,fontSize:'10px',marginTop:'6px'}}>{portfolio.cashPct.toFixed(0)}% of total</div></div>
        </div>
        <div style={{paddingTop:'12px',borderTop:`1px solid ${C.border}`,display:'flex',justifyContent:'space-between',alignItems:'baseline'}}><span style={{color:C.mute,fontSize:'10px',letterSpacing:'0.1em',textTransform:'uppercase'}}>Total portfolio</span><span style={{color:C.hi,fontSize:'18px',fontWeight:600}}>£{portfolio.totalGBP.toLocaleString(undefined,{maximumFractionDigits:0})}</span></div>
        <div style={{paddingTop:'8px',display:'flex',justifyContent:'space-between',alignItems:'baseline'}}><span style={{color:C.mute,fontSize:'10px',letterSpacing:'0.1em',textTransform:'uppercase'}}>USD buying power</span><span style={{color:C.gold,fontSize:'14px',fontWeight:600}}>${(cashBuffer*gbpUsd).toLocaleString(undefined,{maximumFractionDigits:0})}</span></div>
        <div style={{marginTop:'14px'}}>
          <NI value={cashBuffer} onChange={handleCashBufferChange} step={500} label="Cash buffer (GBP)" min={0} max={500000}/>
          <NI value={gbpUsd} onChange={setGbpUsd} step={0.01} label="GBP/USD rate" precision={2} min={0.5} max={3.0}/>
        </div>
      </div>

      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'24px'}}>
        <SH>◆ BTC cycle structure</SH>
        <div style={{marginBottom:'16px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'10px',gap:'8px'}}>
            <div><div style={{fontSize:'10px',color:C.mute,letterSpacing:'0.1em',textTransform:'uppercase'}}>Current MVRV</div><div style={{fontSize:'20px',color:C.gold,fontWeight:600,marginTop:'2px'}}>{mvrv.toFixed(2)}</div></div>
            <div style={{textAlign:'center'}}><div style={{fontSize:'28px',color:C.gold,fontWeight:600}}>{mvrvClock.progress.toFixed(0)}%</div><div style={{fontSize:'10px',color:C.mute,letterSpacing:'0.1em',textTransform:'uppercase'}}>correction progress</div></div>
            <div style={{textAlign:'right'}}><div style={{fontSize:'10px',color:C.mute,letterSpacing:'0.1em',textTransform:'uppercase'}}>Floor target</div><div style={{fontSize:'14px',color:C.dim,marginTop:'2px'}}>MVRV ≤ 0.8</div><div style={{fontSize:'11px',color:C.gold,marginTop:'1px'}}>capitulation zone</div></div>
          </div>
          <div style={{position:'relative',height:'8px',background:C.bg,border:`1px solid ${C.border}`,borderRadius:'4px',overflow:'hidden',marginBottom:'6px'}}>
            <div style={{width:`${mvrvClock.progress}%`,height:'100%',background:`linear-gradient(90deg,${C.gold} 0%,${mvrvClock.progress>70?C.green:mvrvClock.progress>40?C.gold:C.red} 100%)`,transition:'width 0.3s ease'}}/>
          </div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'24px'}}>
        <div style={{background:C.panel,padding:'16px',border:`1px solid ${C.border}`}}>
          <div style={{fontSize:'10px',color:C.mute,letterSpacing:'0.15em',textTransform:'uppercase',marginBottom:'8px'}}>Bear signals</div>
          <div style={{fontSize:'28px',color:bearScore>=6?C.red:C.gold,fontWeight:600}}>{bearScore}<span style={{fontSize:'14px',color:C.faint}}> / 20</span></div>
          <div style={{fontSize:'10px',color:C.mute,marginTop:'4px'}}>≥6 → HOARD</div>
          {bearItems.length>0&&<button onClick={()=>setBearBreakdownOpen(o=>!o)} style={{marginTop:'8px',background:'transparent',border:`1px solid ${C.border}`,color:C.mute,padding:'3px 8px',fontFamily:S,fontSize:'9px',letterSpacing:'0.1em',textTransform:'uppercase',cursor:'pointer',borderRadius:'2px',width:'100%'}}>{bearBreakdownOpen?'▲ hide':'▼ breakdown'}</button>}
          {bearBreakdownOpen&&<div style={{marginTop:'8px',borderTop:`1px solid ${C.border}`,paddingTop:'8px'}}>
            {bearItems.map((item,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:'9px',color:C.dim,marginBottom:'3px',lineHeight:1.4}}>
              <span style={{flex:1,marginRight:'6px'}}>{item.label}</span>
              <span style={{color:C.red,fontWeight:600,flexShrink:0}}>+{item.pts}</span>
            </div>)}
          </div>}
        </div>
        <div style={{background:C.panel,padding:'16px',border:`1px solid ${C.border}`}}>
          <div style={{fontSize:'10px',color:C.mute,letterSpacing:'0.15em',textTransform:'uppercase',marginBottom:'8px'}}>Bottom signals</div>
          <div style={{fontSize:'28px',color:bottomScore>=7?C.green:C.gold,fontWeight:600}}>{bottomScore}<span style={{fontSize:'14px',color:C.faint}}> / 20</span></div>
          <div style={{fontSize:'10px',color:C.mute,marginTop:'4px'}}>≥{DEPLOY_SCORE_MIN} + MSTR&lt;${dynamicCeiling} → DEPLOY</div>
          {bottomItems.length>0&&<button onClick={()=>setBottomBreakdownOpen(o=>!o)} style={{marginTop:'8px',background:'transparent',border:`1px solid ${C.border}`,color:C.mute,padding:'3px 8px',fontFamily:S,fontSize:'9px',letterSpacing:'0.1em',textTransform:'uppercase',cursor:'pointer',borderRadius:'2px',width:'100%'}}>{bottomBreakdownOpen?'▲ hide':'▼ breakdown'}</button>}
          {bottomBreakdownOpen&&<div style={{marginTop:'8px',borderTop:`1px solid ${C.border}`,paddingTop:'8px'}}>
            {bottomItems.map((item,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:'9px',color:C.dim,marginBottom:'3px',lineHeight:1.4}}>
              <span style={{flex:1,marginRight:'6px'}}>{item.label}</span>
              <span style={{color:C.green,fontWeight:600,flexShrink:0}}>+{item.pts}</span>
            </div>)}
          </div>}
        </div>
      </div>

      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'24px'}}>
        <SH>◆ Legacy NAV view (per-share)</SH>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',fontSize:'12px',marginBottom:'14px'}}>
          <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>BTC per share</div><div style={{color:C.hi,fontSize:'15px',marginTop:'2px'}}>{btcPerShare.toFixed(5)} BTC</div></div>
          <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>Fair value</div><div style={{color:C.hi,fontSize:'15px',marginTop:'2px'}}>${fairValue.toFixed(2)}</div></div>
          <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>Current price</div><div style={{color:C.hi,fontSize:'15px',marginTop:'2px'}}>${mstrPrice.toFixed(2)}</div></div>
          <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>Legacy mNAV</div><div style={{color:mnt(legacyMnav),fontSize:'15px',marginTop:'2px',fontWeight:600}}>{legacyMnav.toFixed(2)}x</div></div>
        </div>
        <div style={{marginTop:'14px'}}>
          <NI value={btcHoldings} onChange={handleHoldingsChange} step={100} label="BTC holdings" min={0} max={5000000}/>
          <NI value={dilutedShares} onChange={handleSharesChange} step={1} label="Diluted shares (M)" precision={1} min={1} max={2000}/>
        </div>
      </div>

      <button onClick={saveSnapshot} style={{width:'100%',background:C.panel,border:`1px solid ${C.gold}`,color:C.gold,padding:'12px',fontFamily:S,fontSize:'12px',letterSpacing:'0.15em',textTransform:'uppercase',cursor:'pointer',marginBottom:'24px'}}>◆ Save snapshot to log</button>

      <div style={{marginBottom:'24px'}}>
        <SH>◆ Manual price override</SH>
        <NI value={mstrPrice} onChange={setMstrPrice} step={1} label="MSTR price" suffix="USD" min={1} max={1000}/>
        <NI value={btcPrice} onChange={setBtcPrice} step={500} label="BTC price" suffix="USD" min={1000} max={500000}/>
      </div>

      {/* PROMPT */}
      <div style={{background:C.panel,border:`1px solid ${C.gold}`,padding:'20px',marginBottom:'24px'}}>
        <SH>◆ Prompt-driven update (3 steps)</SH>
        <div style={{fontSize:'11px',color:C.dim,marginBottom:'12px',lineHeight:1.6}}><strong style={{color:C.gold}}>Step 1:</strong> copy prompt below. <strong style={{color:C.gold}}>Step 2:</strong> paste into Claude/Gemini with web search. <strong style={{color:C.gold}}>Step 3:</strong> paste response below.</div>
        <textarea ref={promptTextareaRef} readOnly value={claudePrompt} onClick={handlePromptTextareaClick} style={{width:'100%',height:'220px',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'12px',fontFamily:'Menlo,monospace',fontSize:'11px',resize:'vertical',lineHeight:1.5,boxSizing:'border-box'}}/>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:'8px',marginTop:'10px'}}>
          <button onClick={copyPrompt} style={{background:promptCopied?C.green:C.gold,color:C.bg,border:'none',padding:'10px',fontFamily:S,fontSize:'12px',letterSpacing:'0.15em',textTransform:'uppercase',cursor:'pointer',fontWeight:600}}>{promptCopied?'✓ copied':'◆ copy prompt'}</button>
          <button onClick={handlePromptTextareaClick} style={{background:'transparent',color:C.gold,border:`1px solid ${C.gold}`,padding:'10px',fontFamily:S,fontSize:'10px',letterSpacing:'0.1em',textTransform:'uppercase',cursor:'pointer'}}>select all</button>
        </div>
        {promptSelectMsg&&<div style={{marginTop:'8px',fontSize:'11px',color:C.gold,padding:'8px 10px',background:'#1a1611',border:`1px dashed ${C.gold}`}}>{promptSelectMsg}</div>}
        <div style={{marginTop:'20px',paddingTop:'20px',borderTop:`1px solid ${C.border}`}}>
          <div style={{fontSize:'11px',letterSpacing:'0.15em',color:C.dim,textTransform:'uppercase',marginBottom:'10px',fontFamily:S}}>◆ Paste response here</div>
          <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)} placeholder={'Paste the data block here.\n\n---BEGIN DATA---\nMSTR_PRICE: 134.73\nBTC_PRICE: 80866\nMNAV: 1.02\n...\n---END DATA---'} style={{width:'100%',height:'160px',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'12px',fontFamily:'Menlo,monospace',fontSize:'11px',resize:'vertical',lineHeight:1.5,boxSizing:'border-box'}}/>
          <button onClick={applyPaste} style={{width:'100%',marginTop:'10px',background:C.green,color:'#fff',border:'none',padding:'10px',fontFamily:S,fontSize:'12px',letterSpacing:'0.15em',textTransform:'uppercase',cursor:'pointer',fontWeight:600}}>◆ apply readings</button>
          {pasteResult&&<div style={{marginTop:'10px',fontSize:'11px',padding:'10px 12px',background:pasteResult.ok?'#0f1a13':'#1a0f0d',border:`1px dashed ${pasteResult.ok?C.green:C.red}`,color:pasteResult.ok?C.green:C.red,lineHeight:1.5}}>{pasteResult.ok?'✓ ':'⚠ '}{pasteResult.msg}</div>}
        </div>
      </div>
    </>)}

    {/* POSITIONS TAB */}
    {view==='positions'&&(<>
      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'20px'}}>
        <SH>◆ Open new position</SH>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',fontSize:'11px',marginBottom:'12px'}}>
          <div><div style={{color:C.mute,marginBottom:'4px'}}>Shares</div><input type="number" placeholder="Shares" value={positionForm.shares} onChange={e=>setPositionForm({...positionForm,shares:e.target.value})} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'8px',fontFamily:S,fontSize:'12px'}}/></div>
          <div><div style={{color:C.mute,marginBottom:'4px'}}>Entry price (USD)</div><input type="number" placeholder="Entry" value={positionForm.entryPrice} onChange={e=>setPositionForm({...positionForm,entryPrice:e.target.value})} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'8px',fontFamily:S,fontSize:'12px'}}/></div>
        </div>
        <button onClick={()=>openPosition()} disabled={!positionForm.shares||!positionForm.entryPrice} style={{width:'100%',background:positionForm.shares&&positionForm.entryPrice?C.green:C.border,color:'#fff',border:'none',padding:'10px',fontFamily:S,fontSize:'11px',letterSpacing:'0.15em',cursor:'pointer'}}>OPEN POSITION</button>
      </div>
    </>)}

    {/* PROJECT TAB */}
    {view==='project'&&(
      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'20px'}}>
        <SH>◆ What-if projection</SH>
        <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
          {projectionScenarios.map(sc=>(
            <div key={sc.label} style={{padding:'14px 16px',background:C.bg,border:`1px solid ${sc.color}`,borderRadius:'3px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
                <div style={{fontSize:'11px',color:sc.color,fontWeight:700,letterSpacing:'0.2em',textTransform:'uppercase'}}>{sc.label}</div>
                <div style={{fontSize:'10px',color:sc.vsCurrentPct>=0?C.green:C.red,fontWeight:600}}>{sc.vsCurrentPct>=0?'+':''}{sc.vsCurrentPct.toFixed(0)}% vs today</div>
              </div>
              <div className="g-auto-4">
                <div><div style={{fontSize:'9px',color:C.faint,textTransform:'uppercase',marginBottom:'2px'}}>MSTR</div><div style={{color:sc.color,fontSize:'12px',fontWeight:600}}>${sc.impliedPrice.toFixed(0)}</div></div>
                <div><div style={{fontSize:'9px',color:C.faint,textTransform:'uppercase',marginBottom:'2px'}}>Portfolio</div><div style={{color:sc.color,fontSize:'12px',fontWeight:600}}>£{Math.round(sc.totalGBP).toLocaleString()}</div></div>
              </div>
            </div>
          ))}
        </div>
      </div>
    )}

    {/* BACKUP TAB */}
    {view==='backup'&&(<>
      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'20px'}}>
        <SH>◆ Export state</SH>
        <button onClick={exportJSONFile} style={{width:'100%',background:C.gold,color:'#000',border:'none',padding:'10px',fontFamily:S,fontSize:'11px',letterSpacing:'0.15em',cursor:'pointer',borderRadius:'2px',fontWeight:600}}>DOWNLOAD .JSON</button>
      </div>
    </>)}

    {/* JOURNAL TAB */}
    {view==='journal'&&(<>
      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'20px'}}>
        <SH>◆ Campaign progress</SH>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',fontSize:'12px',marginBottom:'16px'}}>
          <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>Starting shares</div><input type="number" value={startingShares} onChange={e=>setStartingShares(Number(e.target.value))} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.hi,padding:'6px 10px',fontFamily:S,fontSize:'15px',marginTop:'4px'}}/></div>
          <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>Current shares</div><div style={{color:C.hi,fontSize:'20px',marginTop:'4px',fontWeight:600}}>{journalStats.currentShares.toFixed(0)}</div></div>
        </div>
      </div>

      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'20px'}}>
        <SH>◆ Add Trade / DCA Log</SH>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'12px'}}>
          <div style={{display:'flex',gap:'8px',gridColumn:'span 2'}}>
            <button onClick={()=>setTradeType('SELL')} style={{flex:1,background:tradeType==='SELL'?C.red:'transparent',color:tradeType==='SELL'?'#fff':C.dim,border:`1px solid ${tradeType==='SELL'?C.red:C.border}`,padding:'8px',fontFamily:S,fontSize:'11px',letterSpacing:'0.1em',cursor:'pointer',fontWeight:700}}>SELL</button>
            <button onClick={()=>setTradeType('BUY')} style={{flex:1,background:tradeType==='BUY'?C.green:'transparent',color:tradeType==='BUY'?'#fff':C.dim,border:`1px solid ${tradeType==='BUY'?C.green:C.border}`,padding:'8px',fontFamily:S,fontSize:'11px',letterSpacing:'0.1em',cursor:'pointer',fontWeight:700}}>BUY</button>
          </div>
          <input type="date" value={tradeDate} onChange={e=>setTradeDate(e.target.value)} style={{background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'8px',fontFamily:S,fontSize:'12px'}}/>
          <input type="number" placeholder="Shares Count" value={tradeShares} onChange={e=>setTradeShares(e.target.value)} style={{background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'8px',fontFamily:S,fontSize:'12px'}}/>
          
          <div style={{gridColumn:'span 2'}}>
            <div style={{color:C.mute,fontSize:'10px',marginBottom:'4px'}}>Format</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:'6px'}}>
              <button onClick={()=>setTradePriceMode('GBP_TOTAL')} style={{background:tradePriceMode==='GBP_TOTAL'?C.gold:'transparent',color:tradePriceMode==='GBP_TOTAL'?'#000':C.dim,border:`1px solid ${C.border}`,padding:'6px',fontSize:'10px'}}>Total £</button>
              <button onClick={()=>setTradePriceMode('GBX')} style={{background:tradePriceMode==='GBX'?C.gold:'transparent',color:tradePriceMode==='GBX'?'#000':C.dim,border:`1px solid ${C.border}`,padding:'6px',fontSize:'10px'}}>Pence (GBX)</button>
              <button onClick={()=>setTradePriceMode('GBP_PRICE')} style={{background:tradePriceMode==='GBP_PRICE'?C.gold:'transparent',color:tradePriceMode==='GBP_PRICE'?'#000':C.dim,border:`1px solid ${C.border}`,padding:'6px',fontSize:'10px'}}>Price £</button>
              <button onClick={()=>setTradePriceMode('USD')} style={{background:tradePriceMode==='USD'?C.gold:'transparent',color:tradePriceMode==='USD'?'#000':C.dim,border:`1px solid ${C.border}`,padding:'6px',fontSize:'10px'}}>USD ($)</button>
            </div>
          </div>

          <div style={{gridColumn:'span 2'}}>
            <input type="number" step="any" placeholder="Enter Amount / Proceeds" value={tradePriceInput} onChange={e=>setTradePriceInput(e.target.value)} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.gold,padding:'10px',fontFamily:S,fontSize:'14px',fontWeight:600}}/>
          </div>

          <div style={{gridColumn:'span 2',display:'flex',alignItems:'center',gap:'8px'}}>
            <input type="checkbox" id="syncCash" checked={autoSyncCash} onChange={e=>setAutoSyncCash(e.target.checked)}/>
            <label htmlFor="syncCash" style={{fontSize:'11px',color:C.dim,cursor:'pointer'}}>Auto-sync proceeds to SIPP Cash Buffer</label>
          </div>
        </div>
        <button onClick={addTrade} style={{width:'100%',background:C.gold,color:C.bg,border:'none',padding:'10px',fontFamily:S,fontSize:'12px',letterSpacing:'0.15em',textTransform:'uppercase',cursor:'pointer',fontWeight:600}}>+ Log Trade</button>
      </div>

      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px'}}>
        <SH>◆ Trade history</SH>
        {trades.length===0?<div style={{color:C.faint,fontSize:'12px',textAlign:'center',padding:'20px 0'}}>No trades logged yet.</div>
          :[...trades].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>(
            <div key={t.id} style={{display:'grid',gridTemplateColumns:'60px 1fr 1fr 1fr 30px',gap:'10px',padding:'10px 0',borderBottom:`1px solid ${C.border}`,fontSize:'12px',alignItems:'center'}}>
              <span style={{color:t.type==='SELL'?C.red:C.green,fontWeight:600,letterSpacing:'0.1em',fontSize:'10px'}}>{t.type}</span>
              <span style={{color:C.dim}}>{t.date}</span>
              <span style={{color:C.text}}>{t.shares} sh</span>
              <span style={{color:C.gold}}>${t.price} {t.totalGbp&&`(£${t.totalGbp.toLocaleString()})`}</span>
              <button onClick={()=>deleteTrade(t.id)} style={{background:'transparent',border:'none',color:C.faint,cursor:'pointer',fontSize:'14px'}}>×</button>
            </div>
          ))}
      </div>
    </>)}

    {/* SNAPSHOTS TAB */}
    {view==='snapshots'&&(
      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px'}}>
        <SH>◆ Signal evolution log</SH>
        <EquityCurve snapshots={snapshots} startingShares={startingShares} mstrPrice={mstrPrice} gbpUsd={gbpUsd}/>
      </div>
    )}

    <div style={{textAlign:'center',marginTop:'32px',fontSize:'10px',color:C.faint,letterSpacing:'0.15em'}}>
      NOT FINANCIAL ADVICE · YOUR THESIS · YOUR CONVICTION · YOUR DECISION
    </div>
    </div>
    </div>
    </>
  );
}

function App() {
  const [unlocked,setUnlocked]=useState(()=>{if(!AUTH_REQUIRED)return true;try{return sessionStorage.getItem(AUTH_SESSION_KEY)==='1';}catch(e){return false;}});
  if(!unlocked)return <Gate onUnlock={()=>setUnlocked(true)}/>;
  return <MSTRCycleTool/>;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
