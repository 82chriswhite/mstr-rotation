<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0806" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>MSTR Cycle Tool</title>
<!--
  MSTR CYCLE DECISION FRAMEWORK v14.6
  Changes vs v14.5:
  FIX 3: Mobile responsive grids (auto-fit minmax) on Technical Readout, Sizing Guardrail, Snapshots, Projection
  P2: Automatic Band Miss Tracker - zone hit prompt once per zone per calendar day, pre-fills trade logger on "Yes"
  P3: Break-Even Rotation Calculator in Mode Card (ROTATE/HOARD modes)
  All v14.5 features preserved intact.
-->
<script>
  const PASSWORD_HASH = '021ab4d101785587d5ddc3e3715150393924c9df228cb6732c40da48a6cfc7c4';
  const AUTH_REQUIRED = true;
  const AUTH_SESSION_KEY = 'mstr:auth';
  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function tryUnlock(input) {
    const h = await sha256Hex(input);
    return h === PASSWORD_HASH;
  }
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0806; color: #d4c8b8; -webkit-font-smoothing: antialiased; }
  body { font-family: Georgia, "Times New Roman", serif; min-height: 100vh; min-height: 100dvh; }
  input, button, textarea { font-family: inherit; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #loading { display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; color:#8a7a65; font-size:12px; letter-spacing:0.15em; text-transform:uppercase; }
  .gate { display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; padding:24px; }
  .gate-card { background:#14100c; border:1px solid #2a2520; padding:32px; max-width:360px; width:100%; border-radius:3px; }
  .gate-title { font-size:14px; color:#d4a017; letter-spacing:0.2em; text-transform:uppercase; margin-bottom:6px; font-weight:600; }
  .gate-sub { font-size:11px; color:#8a7a65; margin-bottom:24px; }
  .gate-input { width:100%; background:#0a0806; border:1px solid #2a2520; color:#d4c8b8; padding:10px 12px; font-size:14px; letter-spacing:0.05em; margin-bottom:12px; border-radius:2px; outline:none; }
  .gate-input:focus { border-color:#d4a017; }
  .gate-btn { width:100%; background:#d4a017; color:#000; border:none; padding:11px; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer; border-radius:2px; font-weight:600; }
  .gate-btn:disabled { background:#2a2520; color:#5a5048; cursor:not-allowed; }
  .gate-err { font-size:11px; color:#c73e1d; margin-top:10px; min-height:14px; }

  /* P2: Zone hit overlay */
  .zone-overlay { position:fixed; inset:0; z-index:1000; background:rgba(10,8,6,0.9); display:flex; align-items:center; justify-content:center; padding:24px; animation:zfadeIn 0.2s ease; }
  @keyframes zfadeIn { from{opacity:0} to{opacity:1} }
  .zone-card { background:#14100c; padding:24px; max-width:340px; width:100%; border-radius:4px; }

  /* FIX 3: Responsive grid utilities */
  .g-auto-4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(70px,1fr)); gap:12px; }
  .g-auto-3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:8px; }
  .g-auto-2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
  .g-snap-5 { display:grid; grid-template-columns:repeat(auto-fit,minmax(55px,1fr)); gap:6px; }
</style>
</head>
<body>
<div id="root"><div id="loading">Loading…</div></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

function Gate({ onUnlock }) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!pw) return;
    setBusy(true); setErr('');
    const ok = await tryUnlock(pw);
    setBusy(false);
    if (ok) { try { sessionStorage.setItem(AUTH_SESSION_KEY,'1'); } catch(e){} onUnlock(); }
    else { setErr('Incorrect password.'); setPw(''); }
  };
  return (
    <div className="gate"><div className="gate-card">
      <div className="gate-title">MSTR Cycle Tool</div>
      <div className="gate-sub">Enter password to continue.</div>
      <input type="password" className="gate-input" autoFocus value={pw}
        onChange={e=>setPw(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submit();}} placeholder="Password"/>
      <button className="gate-btn" onClick={submit} disabled={busy||!pw}>{busy?'Checking…':'Unlock'}</button>
      <div className="gate-err">{err}</div>
    </div></div>
  );
}

function ZoneHitPrompt({ hit, onActed, onMissed, onDismiss }) {
  if (!hit) return null;
  const isSell = hit.side === 'SELL';
  const bc = isSell ? '#c73e1d' : '#2d8659';
  return (
    <div className="zone-overlay">
      <div className="zone-card" style={{border:`2px solid ${bc}`}}>
        <div style={{fontSize:'9px',color:'#8a7a65',letterSpacing:'0.2em',textTransform:'uppercase',marginBottom:'8px'}}>Zone detected · {new Date().toLocaleTimeString().slice(0,5)}</div>
        <div style={{fontSize:'16px',color:bc,fontWeight:700,letterSpacing:'0.05em',marginBottom:'6px'}}>{isSell?'▲ SELL ZONE HIT':'▼ BUY ZONE HIT'}</div>
        <div style={{fontSize:'13px',color:'#d4c8b8',marginBottom:'4px'}}>{hit.label}</div>
        <div style={{fontSize:'12px',color:'#a89580',marginBottom:'20px'}}>Zone: {hit.zone} · Current: ${hit.price.toFixed(2)}</div>
        <div style={{fontSize:'13px',color:'#d4c8b8',marginBottom:'16px',fontStyle:'italic'}}>Did you act on this zone?</div>
        <div style={{display:'flex',gap:'10px'}}>
          <button onClick={onActed} style={{flex:1,background:bc,color:'#fff',border:'none',padding:'11px',fontFamily:'Georgia,serif',fontSize:'11px',letterSpacing:'0.15em',textTransform:'uppercase',cursor:'pointer',fontWeight:700,borderRadius:'2px'}}>Yes — log trade</button>
          <button onClick={onMissed} style={{flex:1,background:'transparent',color:'#a89580',border:'1px solid #2a2520',padding:'11px',fontFamily:'Georgia,serif',fontSize:'11px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer',borderRadius:'2px'}}>No — missed</button>
        </div>
        <button onClick={onDismiss} style={{width:'100%',marginTop:'8px',background:'transparent',color:'#5a5048',border:'none',padding:'6px',fontFamily:'Georgia,serif',fontSize:'10px',letterSpacing:'0.1em',cursor:'pointer'}}>dismiss without logging</button>
      </div>
    </div>
  );
}


function MSTRCycleTool() {
  const [mstrPrice,setMstrPrice]=useState(187);
  const [btcPrice,setBtcPrice]=useState(80000);
  const [ma200,setMa200]=useState(null);
  const [lastUpdated,setLastUpdated]=useState(null);
  const [pasteText,setPasteText]=useState('');
  const [pasteResult,setPasteResult]=useState(null);
  const [high20,setHigh20]=useState(null);
  const [low20,setLow20]=useState(null);
  const [high50,setHigh50]=useState(null);
  const [low50,setLow50]=useState(null);
  const [low200,setLow200]=useState(null);
  const [atr14,setAtr14]=useState(null);
  const [nupl,setNupl]=useState(19);
  const [mvrv,setMvrv]=useState(1.4);
  const [fundingNegative,setFundingNegative]=useState(false);
  const [derivativesExhaustion,setDerivativesExhaustion]=useState(false);
  const [below200ma,setBelow200ma]=useState(false);
  const [weeklyLowerLow,setWeeklyLowerLow]=useState(false);
  const [dxyAbove110,setDxyAbove110]=useState(false);
  const [btcHoldings,setBtcHoldings]=useState(818869);
  const [dilutedShares,setDilutedShares]=useState(280);
  const [corporateBaseUpdated,setCorporateBaseUpdated]=useState(null);
  const [startingShares,setStartingShares]=useState(0);
  const [cashBuffer,setCashBuffer]=useState(0);
  const [gbpUsd,setGbpUsd]=useState(1.27);
  const [parsedMnav,setParsedMnav]=useState(null);
  const [totalDebt,setTotalDebt]=useState(null);
  const [preferredNotional,setPreferredNotional]=useState(null);
  const [cashPosition,setCashPosition]=useState(null);
  const [sthRealizedPrice,setSthRealizedPrice]=useState(null);
  const [btcBelowSthCost,setBtcBelowSthCost]=useState(false);
  const [etfFlows5d,setEtfFlows5d]=useState(null);
  const [etfOutflowsPersistent,setEtfOutflowsPersistent]=useState(false);
  const [mnavCompressed,setMnavCompressed]=useState(false);
  const [mnavEuphoric,setMnavEuphoric]=useState(false);
  const [btcDominance,setBtcDominance]=useState(null);
  const [mstrShortInt,setMstrShortInt]=useState(null);
  const [atmActive,setAtmActive]=useState(false);
  const [ivRank,setIvRank]=useState(null);
  const [dataTimestamp,setDataTimestamp]=useState(null);
  const [confidence,setConfidence]=useState(null);
  const [staleFields,setStaleFields]=useState(null);
  const [levelsAuto,setLevelsAuto]=useState(true);
  const [manualSellLow,setManualSellLow]=useState(192);
  const [manualSellHigh,setManualSellHigh]=useState(200);
  const [manualBuyLow,setManualBuyLow]=useState(170);
  const [manualBuyHigh,setManualBuyHigh]=useState(180);
  const [trades,setTrades]=useState([]);
  const [snapshots,setSnapshots]=useState([]);
  const [misses,setMisses]=useState([]);
  const [zoneHitKeys,setZoneHitKeys]=useState({});
  const [zoneHitPrompt,setZoneHitPrompt]=useState(null);
  const [aggressionStyle,setAggressionStyle]=useState('moderate');
  const [positions,setPositions]=useState([]);
  const [positionForm,setPositionForm]=useState({shares:'',entryPrice:'',stop:'',target:'',tag:'MANUAL',notes:''});
  const [exitPrices,setExitPrices]=useState({});
  const [view,setView]=useState('dashboard');
  const [tradeType,setTradeType]=useState('SELL');
  const [tradeShares,setTradeShares]=useState('');
  const [tradePrice,setTradePrice]=useState('');
  const [tradeDate,setTradeDate]=useState(new Date().toISOString().slice(0,10));
  const [tradeFees,setTradeFees]=useState('');
  const [promptCopied,setPromptCopied]=useState(false);
  const [promptSelectMsg,setPromptSelectMsg]=useState('');
  const promptTextareaRef=useRef(null);
  const [beqSellShares,setBeqSellShares]=useState('');
  const [beqSellPrice,setBeqSellPrice]=useState('');
  const [projBearBtc,setProjBearBtc]=useState(45000);
  const [projBaseBtc,setProjBaseBtc]=useState(120000);
  const [projBullBtc,setProjBullBtc]=useState(250000);
  const [projBearMnav,setProjBearMnav]=useState(1.0);
  const [projBaseMnav,setProjBaseMnav]=useState(1.6);
  const [projBullMnav,setProjBullMnav]=useState(2.2);
  const [projShares,setProjShares]=useState(null);
  const [importText,setImportText]=useState('');
  const [importResult,setImportResult]=useState(null);

  useEffect(()=>{
    try{const s=JSON.parse(localStorage.getItem('mstr:settings')||'null');if(s){
      if(s.mstrPrice!==undefined)setMstrPrice(s.mstrPrice);
      if(s.btcPrice!==undefined)setBtcPrice(s.btcPrice);
      if(s.ma200!==undefined)setMa200(s.ma200);
      if(s.lastUpdated!==undefined)setLastUpdated(s.lastUpdated);
      if(s.high20!==undefined)setHigh20(s.high20);
      if(s.low20!==undefined)setLow20(s.low20);
      if(s.high50!==undefined)setHigh50(s.high50);
      if(s.low50!==undefined)setLow50(s.low50);
      if(s.low200!==undefined)setLow200(s.low200);
      if(s.atr14!==undefined)setAtr14(s.atr14);
      if(s.nupl!==undefined)setNupl(s.nupl);
      if(s.mvrv!==undefined)setMvrv(s.mvrv);
      if(s.fundingNegative!==undefined)setFundingNegative(s.fundingNegative);
      if(s.derivativesExhaustion!==undefined)setDerivativesExhaustion(s.derivativesExhaustion);
      if(s.below200ma!==undefined)setBelow200ma(s.below200ma);
      if(s.weeklyLowerLow!==undefined)setWeeklyLowerLow(s.weeklyLowerLow);
      if(s.dxyAbove110!==undefined)setDxyAbove110(s.dxyAbove110);
      if(s.btcHoldings!==undefined)setBtcHoldings(s.btcHoldings);
      if(s.dilutedShares!==undefined)setDilutedShares(s.dilutedShares);
      if(s.corporateBaseUpdated!==undefined)setCorporateBaseUpdated(s.corporateBaseUpdated);
      if(s.startingShares!==undefined)setStartingShares(s.startingShares);
      if(s.cashBuffer!==undefined)setCashBuffer(s.cashBuffer);
      if(s.gbpUsd!==undefined)setGbpUsd(s.gbpUsd);
      if(s.levelsAuto!==undefined)setLevelsAuto(s.levelsAuto);
      if(s.manualSellLow!==undefined)setManualSellLow(s.manualSellLow);
      if(s.manualSellHigh!==undefined)setManualSellHigh(s.manualSellHigh);
      if(s.manualBuyLow!==undefined)setManualBuyLow(s.manualBuyLow);
      if(s.manualBuyHigh!==undefined)setManualBuyHigh(s.manualBuyHigh);
      if(s.aggressionStyle!==undefined)setAggressionStyle(s.aggressionStyle);
      if(s.parsedMnav!==undefined)setParsedMnav(s.parsedMnav);
      if(s.totalDebt!==undefined)setTotalDebt(s.totalDebt);
      if(s.preferredNotional!==undefined)setPreferredNotional(s.preferredNotional);
      if(s.cashPosition!==undefined)setCashPosition(s.cashPosition);
      if(s.sthRealizedPrice!==undefined)setSthRealizedPrice(s.sthRealizedPrice);
      if(s.btcBelowSthCost!==undefined)setBtcBelowSthCost(s.btcBelowSthCost);
      if(s.etfFlows5d!==undefined)setEtfFlows5d(s.etfFlows5d);
      if(s.etfOutflowsPersistent!==undefined)setEtfOutflowsPersistent(s.etfOutflowsPersistent);
      if(s.mnavCompressed!==undefined)setMnavCompressed(s.mnavCompressed);
      if(s.mnavEuphoric!==undefined)setMnavEuphoric(s.mnavEuphoric);
      if(s.dataTimestamp!==undefined)setDataTimestamp(s.dataTimestamp);
      if(s.confidence!==undefined)setConfidence(s.confidence);
      if(s.staleFields!==undefined)setStaleFields(s.staleFields);
      if(s.btcDominance!==undefined)setBtcDominance(s.btcDominance);
      if(s.mstrShortInt!==undefined)setMstrShortInt(s.mstrShortInt);
      if(s.atmActive!==undefined)setAtmActive(s.atmActive);
      if(s.ivRank!==undefined)setIvRank(s.ivRank);
      if(s.projBearBtc!==undefined)setProjBearBtc(s.projBearBtc);
      if(s.projBaseBtc!==undefined)setProjBaseBtc(s.projBaseBtc);
      if(s.projBullBtc!==undefined)setProjBullBtc(s.projBullBtc);
      if(s.projBearMnav!==undefined)setProjBearMnav(s.projBearMnav);
      if(s.projBaseMnav!==undefined)setProjBaseMnav(s.projBaseMnav);
      if(s.projBullMnav!==undefined)setProjBullMnav(s.projBullMnav);
      if(s.projShares!==undefined)setProjShares(s.projShares);
    }}catch(e){}
    try{const t=localStorage.getItem('mstr:trades');if(t)setTrades(JSON.parse(t));}catch(e){}
    try{const sn=localStorage.getItem('mstr:snapshots');if(sn)setSnapshots(JSON.parse(sn));}catch(e){}
    try{const pos=localStorage.getItem('mstr:positions');if(pos)setPositions(JSON.parse(pos));}catch(e){}
    try{const ms=localStorage.getItem('mstr:misses');if(ms)setMisses(JSON.parse(ms));}catch(e){}
    try{const zk=localStorage.getItem('mstr:zoneHitKeys');if(zk)setZoneHitKeys(JSON.parse(zk));}catch(e){}
  },[]);

  useEffect(()=>{
    try{localStorage.setItem('mstr:settings',JSON.stringify({
      mstrPrice,btcPrice,ma200,lastUpdated,high20,low20,high50,low50,low200,atr14,
      nupl,mvrv,fundingNegative,derivativesExhaustion,below200ma,weeklyLowerLow,dxyAbove110,
      btcHoldings,dilutedShares,corporateBaseUpdated,startingShares,cashBuffer,gbpUsd,
      levelsAuto,manualSellLow,manualSellHigh,manualBuyLow,manualBuyHigh,aggressionStyle,
      parsedMnav,totalDebt,preferredNotional,cashPosition,sthRealizedPrice,btcBelowSthCost,
      etfFlows5d,etfOutflowsPersistent,mnavCompressed,mnavEuphoric,dataTimestamp,confidence,staleFields,
      btcDominance,mstrShortInt,atmActive,ivRank,
      projBearBtc,projBaseBtc,projBullBtc,projBearMnav,projBaseMnav,projBullMnav,projShares,
    }));}catch(e){}
  },[mstrPrice,btcPrice,ma200,lastUpdated,high20,low20,high50,low50,low200,atr14,
     nupl,mvrv,fundingNegative,derivativesExhaustion,below200ma,weeklyLowerLow,dxyAbove110,
     btcHoldings,dilutedShares,corporateBaseUpdated,startingShares,cashBuffer,gbpUsd,
     levelsAuto,manualSellLow,manualSellHigh,manualBuyLow,manualBuyHigh,aggressionStyle,
     parsedMnav,totalDebt,preferredNotional,cashPosition,sthRealizedPrice,btcBelowSthCost,
     etfFlows5d,etfOutflowsPersistent,mnavCompressed,mnavEuphoric,dataTimestamp,confidence,staleFields,
     btcDominance,mstrShortInt,atmActive,ivRank,
     projBearBtc,projBaseBtc,projBullBtc,projBearMnav,projBaseMnav,projBullMnav,projShares]);

  const handleHoldingsChange=v=>{setBtcHoldings(v);setCorporateBaseUpdated(new Date().toISOString().slice(0,10));};
  const handleSharesChange=v=>{setDilutedShares(v);setCorporateBaseUpdated(new Date().toISOString().slice(0,10));};

  const btcPerShare=useMemo(()=>btcHoldings/(dilutedShares*1_000_000),[btcHoldings,dilutedShares]);
  const fairValue=useMemo(()=>btcPerShare*btcPrice,[btcPerShare,btcPrice]);
  const legacyMnav=useMemo(()=>fairValue>0?mstrPrice/fairValue:0,[mstrPrice,fairValue]);
  const mNAV=useMemo(()=>parsedMnav!==null?parsedMnav:legacyMnav,[parsedMnav,legacyMnav]);
  const mNAVisLegacy=parsedMnav===null;

  const recomputedMnav=useMemo(()=>{
    if(totalDebt===null||preferredNotional===null||cashPosition===null)return null;
    const marketCap=mstrPrice*dilutedShares;
    const ev=marketCap+totalDebt+preferredNotional-cashPosition;
    const btcNav=(btcHoldings*btcPrice)/1_000_000;
    return btcNav>0?ev/btcNav:null;
  },[mstrPrice,dilutedShares,totalDebt,preferredNotional,cashPosition,btcHoldings,btcPrice]);

  const mNAVdiscrepancy=useMemo(()=>{
    if(parsedMnav===null||recomputedMnav===null)return null;
    return Math.abs(Math.round(parsedMnav*100)/100-Math.round(recomputedMnav*100)/100);
  },[parsedMnav,recomputedMnav]);
  const MNAV_WARN=0.15;

  const headerMnavInfo=useMemo(()=>{
    const diverged=mNAVdiscrepancy!==null&&mNAVdiscrepancy>MNAV_WARN;
    if(recomputedMnav!==null&&diverged)return{value:recomputedMnav,overridden:true,parsedWas:parsedMnav};
    return{value:mNAV,overridden:false,parsedWas:null};
  },[recomputedMnav,mNAV,mNAVdiscrepancy,parsedMnav]);

  const MVRV_PEAK=3.0,MVRV_FLOOR=0.8;
  const cycleData=useMemo(()=>{
    const ath=new Date('2025-10-06'),target=new Date('2026-10-06'),now=new Date();
    const totalDays=Math.round((target-ath)/86400000);
    const elapsed=Math.round((now-ath)/86400000);
    const remaining=Math.round((target-now)/86400000);
    const progress=Math.min(100,Math.max(0,(elapsed/totalDays)*100));
    return{totalDays,elapsed,remaining,progress};
  },[lastUpdated]);

  const mvrvClock=useMemo(()=>{
    const progress=Math.min(100,Math.max(0,((MVRV_PEAK-mvrv)/(MVRV_PEAK-MVRV_FLOOR))*100));
    let zone,zoneColor;
    if(mvrv>=3.0){zone='Euphoria — peak distribution risk';zoneColor='#c73e1d';}
    else if(mvrv>=2.0){zone='Distribution — late-cycle elevated';zoneColor='#c73e1d';}
    else if(mvrv>=1.5){zone='Caution — premium above fair value';zoneColor='#d4a017';}
    else if(mvrv>=1.0){zone='Healthy — within normal range';zoneColor='#d4a017';}
    else if(mvrv>=0.8){zone='Compressed — approaching floor';zoneColor='#2d8659';}
    else{zone='Capitulation — below cost basis';zoneColor='#2d8659';}
    const pctToFloor=Math.max(0,((mvrv-MVRV_FLOOR)/(MVRV_PEAK-MVRV_FLOOR))*100);
    return{progress,zone,zoneColor,pctToFloor};
  },[mvrv]);

  const daysSinceBaseUpdate=useMemo(()=>{
    if(!corporateBaseUpdated)return null;
    return Math.floor((new Date()-new Date(corporateBaseUpdated))/86400000);
  },[corporateBaseUpdated,lastUpdated]);

  const freshness=useMemo(()=>{
    let ts=null,source=null;
    if(dataTimestamp){const p=new Date(dataTimestamp);if(!isNaN(p.getTime())){ts=p;source='data-timestamp';}}
    if(!ts&&lastUpdated){const p=new Date(lastUpdated);if(!isNaN(p.getTime())){ts=p;source='paste-time';}}
    if(!ts)return{tier:'none',hours:null,source:null};
    const hours=(Date.now()-ts.getTime())/3600000;
    return{tier:hours>72?'red':hours>24?'amber':'fresh',hours,source,ts};
  },[dataTimestamp,lastUpdated]);

  const dilutionBrakeActive=useMemo(()=>atmActive&&mNAV!==null&&mNAV<1.2,[atmActive,mNAV]);

  const baseProfile=useMemo(()=>{
    switch(aggressionStyle){
      case 'conservative':return{label:'Conservative',rotationSizePctLow:15,rotationSizePctHigh:20,bandWidthMult:0.55,hoardSensitivity:1.15,deployLadderSteepness:0.9};
      case 'aggressive':return{label:'Aggressive',rotationSizePctLow:35,rotationSizePctHigh:45,bandWidthMult:0.28,hoardSensitivity:0.85,deployLadderSteepness:1.15};
      default:return{label:'Moderate (Base)',rotationSizePctLow:25,rotationSizePctHigh:30,bandWidthMult:0.4,hoardSensitivity:1.0,deployLadderSteepness:1.0};
    }
  },[aggressionStyle]);

  const profile=useMemo(()=>{
    if(!dilutionBrakeActive)return baseProfile;

            onFocus={e=>{sfoc(true);e.target.select();}} onBlur={()=>{sfoc(false);commit(ev);}}
            onChange={e=>{const r=e.target.value;if(/^-?\d*\.?\d*$/.test(r))sev(r);}} onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}
            style={{flex:1,minWidth:0,background:C.bg,border:`1px solid ${C.border}`,color:C.gold,padding:'8px 12px',fontFamily:S,fontSize:'15px',fontWeight:600,textAlign:'center'}}/>
          <button onClick={()=>adj(step)} style={{width:'40px',flexShrink:0,background:C.bg,border:`1px solid ${C.border}`,color:C.gold,fontFamily:S,fontSize:'16px',cursor:'pointer'}}>+</button>
        </div>
      </div>
    );
  };

  const EquityCurve=({snapshots,startingShares,mstrPrice,gbpUsd})=>{
    const points=useMemo(()=>snapshots.filter(s=>s.mstrPrice&&(s.currentShares!==undefined||startingShares>0)).map(s=>{const sh=s.currentShares!==undefined?s.currentShares:startingShares;const cash=s.cashBufferGBP||0;const rate=s.gbpUsd||gbpUsd;return{date:s.date,portfolioGBP:(sh*s.mstrPrice/rate)+cash,mstrPrice:s.mstrPrice,shares:sh};}).sort((a,b)=>a.date.localeCompare(b.date)),[snapshots,startingShares,gbpUsd]);
    if(points.length<3)return null;
    const maxVal=Math.max(...points.map(p=>p.portfolioGBP)),minVal=Math.min(...points.map(p=>p.portfolioGBP)),range=maxVal-minVal||1;
    const totalReturn=((points[points.length-1].portfolioGBP-points[0].portfolioGBP)/points[0].portfolioGBP)*100;
    return(
      <div style={{marginTop:'16px',paddingTop:'16px',borderTop:`1px solid ${C.border}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'10px'}}>
          <span style={{fontSize:'10px',color:C.mute,letterSpacing:'0.15em',textTransform:'uppercase'}}>Portfolio equity curve ({points.length} snapshots)</span>
          <span style={{fontSize:'12px',color:totalReturn>=0?C.green:C.red,fontWeight:600}}>{totalReturn>=0?'+':''}{totalReturn.toFixed(1)}% total</span>
        </div>
        <div style={{display:'flex',alignItems:'flex-end',gap:'3px',height:'48px'}}>
          {points.map((p,i)=>{
            const hp=range>0?((p.portfolioGBP-minVal)/range)*100:50,isLast=i===points.length-1;
            const prevVal=i>0?points[i-1].portfolioGBP:p.portfolioGBP;
            const bc=isLast?C.gold:p.portfolioGBP>=prevVal?C.green:C.red;
            return<div key={p.date} style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'flex-end',height:'100%'}} title={`${new Date(p.date).toLocaleDateString()}: £${Math.round(p.portfolioGBP).toLocaleString()} · ${p.shares.toFixed(0)} sh @ $${p.mstrPrice}`}><div style={{background:bc,width:'100%',height:`${Math.max(8,hp)}%`,opacity:isLast?1:0.7,borderRadius:'1px 1px 0 0'}}/></div>;
          })}
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px',fontSize:'9px',color:C.faint}}>
          <span>{new Date(points[0].date).toLocaleDateString()}</span>
          <span style={{color:C.mute}}>hover bars for details</span>
          <span>{new Date(points[points.length-1].date).toLocaleDateString()}</span>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:'8px',fontSize:'10px'}}>
          <span style={{color:C.faint}}>Low: £{Math.round(minVal).toLocaleString()}</span>
          <span style={{color:C.faint}}>High: £{Math.round(maxVal).toLocaleString()}</span>
        </div>
      </div>
    );
  };


  // ============ RENDER ============
  return(
    <>
    <ZoneHitPrompt hit={zoneHitPrompt?.hit} onActed={handleZoneActed} onMissed={handleZoneMissed} onDismiss={handleZoneDismiss}/>
    <div style={{minHeight:'100vh',background:`linear-gradient(180deg,${C.bg} 0%,${C.panel} 100%)`,padding:'24px 16px',fontFamily:S,color:C.text}}>
    <div style={{maxWidth:'720px',margin:'0 auto'}}>

    {/* HEADER */}
    <div style={{marginBottom:'24px',borderBottom:`1px solid ${C.border}`,paddingBottom:'20px'}}>
      <div style={{fontSize:'10px',letterSpacing:'0.3em',color:C.mute,textTransform:'uppercase',marginBottom:'8px'}}>Cycle Decision Framework · v14.6 · prompt v2</div>
      <h1 style={{fontSize:'26px',fontWeight:400,color:C.hi,margin:0,fontStyle:'italic'}}>MSTR Rotation</h1>
      <h2 style={{fontSize:'14px',fontWeight:400,color:C.dim,margin:'4px 0 12px 0',letterSpacing:'0.05em'}}>Rotate · Hoard · Deploy</h2>
      <div style={{display:'flex',gap:'16px',flexWrap:'wrap',fontSize:'12px',marginTop:'12px',alignItems:'center'}}>
        <div><span style={{color:C.mute}}>BTC </span><span style={{color:C.gold}}>${btcPrice.toLocaleString()}</span></div>
        <div><span style={{color:C.mute}}>MSTR </span><span style={{color:C.gold}}>${mstrPrice.toFixed(2)}</span></div>
        <div><span style={{color:C.mute}}>200MA </span><span style={{color:C.gold}}>{ma200?`$${ma200.toFixed(2)}`:'—'}</span></div>
        <div style={{color:C.mute}}>mNAV{' '}<span style={{color:mnt(headerMnavInfo.value)}}>{headerMnavInfo.value?`${headerMnavInfo.value.toFixed(2)}x`:'—'}</span>
          {headerMnavInfo.overridden&&<span title={`Pasted mNAV was ${headerMnavInfo.parsedWas?.toFixed(2)}x — overridden with live recomputed value`} style={{marginLeft:'4px',fontSize:'9px',color:C.gold,border:`1px solid ${C.gold}`,padding:'1px 4px',borderRadius:'2px',letterSpacing:'0.06em',cursor:'help',verticalAlign:'middle'}}>↻ live</span>}
        </div>
        {btcDominance!==null&&<div style={{color:C.mute}}>BTC.D <span style={{color:btcDominance<50?C.red:btcDominance>60?C.green:C.gold}}>{btcDominance.toFixed(1)}%</span></div>}
        {ivRank!==null&&<div style={{color:C.mute}}>IV Rank <span style={{color:ivRank>75?C.red:ivRank>50?C.gold:C.green,fontWeight:ivRank>75?700:400}}>{ivRank}{ivRank>75?' ⚡':''}</span></div>}
      </div>
      <div style={{fontSize:'9px',color:C.faint,marginTop:'6px',letterSpacing:'0.05em',display:'flex',gap:'10px',flexWrap:'wrap'}}>
        <span>Prompt-driven updates. Paste prompt response below to refresh.</span>
        {freshness.hours!==null&&<span style={{color:freshness.tier==='red'?C.red:freshness.tier==='amber'?C.gold:C.green,fontWeight:600}}>· data {freshness.hours<1?`${(freshness.hours*60).toFixed(0)}m`:`${freshness.hours.toFixed(0)}h`} old</span>}
        {confidence&&<span style={{color:confidence==='LOW'?C.red:confidence==='MEDIUM'?C.gold:C.green}}>· conf {confidence}</span>}
      </div>
    </div>

    {/* NAV */}
    <div style={{marginBottom:'20px'}}>
      <div style={{display:'flex',gap:'6px',marginBottom:'6px'}}>
        <NB id="dashboard" label="Dashboard"/><NB id="positions" label={`Open · ${positions.filter(p=>p.status==='OPEN').length}`}/><NB id="journal" label={`Journal · ${trades.length}`}/><NB id="project" label="Project"/>
      </div>
      <div style={{display:'flex',gap:'6px'}}>
        <NB id="snapshots" label={`Log · ${snapshots.length}`} secondary/><NB id="backup" label="Backup" secondary/>
      </div>
    </div>

    {view==='dashboard'&&(<>
      {/* STALENESS BANNER */}
      {(freshness.tier==='amber'||freshness.tier==='red'||confidence==='LOW'||(staleFields&&staleFields!=='NONE'))&&(
        <div style={{background:freshness.tier==='red'||confidence==='LOW'?'#1a0f0d':'#1a1611',border:`2px solid ${freshness.tier==='red'||confidence==='LOW'?C.red:C.gold}`,padding:'14px 16px',marginBottom:'20px',borderRadius:'3px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'6px'}}>
            <span style={{fontSize:'18px',lineHeight:1}}>{freshness.tier==='red'||confidence==='LOW'?'🚨':'⚠'}</span>
            <span style={{color:freshness.tier==='red'||confidence==='LOW'?C.red:C.gold,fontSize:'12px',fontWeight:700,letterSpacing:'0.15em',textTransform:'uppercase'}}>
              {freshness.tier==='red'?'Running on cached indicators — regime update required':confidence==='LOW'?'Low-confidence data — verify before trading':'Data is aging — consider refreshing'}
            </span>
          </div>
          <div style={{fontSize:'11px',color:C.dim,lineHeight:1.5,paddingLeft:'28px'}}>
            {freshness.hours!==null&&<div>Source data is {freshness.hours<1?`${(freshness.hours*60).toFixed(0)} minutes`:`${freshness.hours.toFixed(1)} hours`} old ({freshness.source==='data-timestamp'?'LLM-asserted':'paste-time fallback'}).</div>}
            {confidence&&<div style={{marginTop:'2px'}}>LLM confidence: <span style={{color:confidence==='LOW'?C.red:confidence==='MEDIUM'?C.gold:C.green,fontWeight:600}}>{confidence}</span></div>}
            {staleFields&&staleFields!=='NONE'&&<div style={{marginTop:'2px'}}>Stale fields: <span style={{color:C.red,fontStyle:'italic'}}>{staleFields}</span></div>}
          </div>
        </div>
      )}

      {/* MODE CARD */}
      <div style={{background:cfg.bg,border:`1px solid ${cfg.color}`,padding:'20px',marginBottom:'20px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'18px',gap:'16px',flexWrap:'wrap'}}>
          <div style={{flex:'1 1 auto',minWidth:0}}>
            <div style={{fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:cfg.color,marginBottom:'6px'}}>Active mode</div>
            <div style={{fontSize:'20px',color:cfg.color,fontWeight:600,letterSpacing:'0.02em',lineHeight:1.1}}>{cfg.label}</div>
          </div>
          <div style={{flex:'0 0 auto',textAlign:'right'}}>
            <div style={{fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:C.mute,marginBottom:'6px'}}>MSTR</div>
            <div style={{fontSize:'28px',color:priceRange?.tone||C.hi,fontWeight:600,letterSpacing:'-0.01em',lineHeight:1}}>${mstrPrice.toFixed(2)}</div>
            {priceRange?.verdict&&<div style={{fontSize:'9px',letterSpacing:'0.18em',textTransform:'uppercase',color:priceRange.tone,marginTop:'6px',fontWeight:600}}>{priceRange.verdict}</div>}
          </div>
        </div>

        {priceRange?.pct!==null&&priceRange?.pct!==undefined&&mode==='ROTATE'&&(
          <div style={{marginBottom:'18px'}}>
            <div style={{position:'relative',height:'6px',background:'#0a0806',borderRadius:'3px',overflow:'hidden',border:`1px solid ${C.border}`}}>
              <div style={{position:'absolute',left:0,top:0,bottom:0,width:`${((priceRange.buyHigh-priceRange.lo)/(priceRange.hi-priceRange.lo))*100}%`,background:'rgba(45,134,89,0.25)'}}/>
              <div style={{position:'absolute',right:0,top:0,bottom:0,width:`${((priceRange.hi-priceRange.sellLow)/(priceRange.hi-priceRange.lo))*100}%`,background:'rgba(199,62,29,0.25)'}}/>
              <div style={{position:'absolute',left:`${priceRange.pct*100}%`,top:'-3px',bottom:'-3px',width:'2px',background:priceRange.tone,boxShadow:`0 0 6px ${priceRange.tone}`}}/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:C.mute,marginTop:'4px'}}>
              <span>${priceRange.lo.toFixed(0)}</span><span style={{color:C.faint}}>Buy band · Sell band</span><span>${priceRange.hi.toFixed(0)}</span>
            </div>
          </div>
        )}

        <div style={{fontSize:'13px',color:C.text,lineHeight:1.55,marginBottom:'18px'}}>{cfg.action}</div>

        {deployImminent&&<div style={{marginBottom:'14px',padding:'12px 14px',background:'#111a12',border:`1px solid ${C.green}`,borderRadius:'3px'}}><div style={{color:C.green,fontSize:'12px',fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:'4px'}}>● DEPLOY approaching</div><div style={{color:C.dim,fontSize:'11px',lineHeight:1.55}}>Bottom score is <span style={{color:C.green,fontWeight:600}}>{bottomScore}/20</span> — {7-bottomScore} point{7-bottomScore!==1?'s':''} and a break below $140 will flip to DEPLOY.</div></div>}
        {ivRank!==null&&ivRank>75&&bearScore>=6&&<div style={{marginBottom:'14px',padding:'10px 12px',background:'#1a0f0d',border:`1px dashed ${C.red}`,borderRadius:'3px',fontSize:'11px',color:C.red,lineHeight:1.5}}>⚡ IV Rank {ivRank} — peak options speculation zone. +1 bear signal. Premium collapse risk elevated.</div>}
        {deploySuppressed&&<div style={{fontSize:'11px',color:C.gold,marginBottom:'14px',padding:'10px 12px',background:'#1a1611',border:`1px dashed ${C.gold}`,borderRadius:'3px'}}>⚠ Bottom score at deploy threshold, but MSTR still above $140. Holding HOARD.</div>}
        {levelsAuto&&!technicals&&<div style={{fontSize:'11px',color:C.red,marginBottom:'14px',padding:'10px 12px',background:'#1a0f0d',border:`1px dashed ${C.red}`,borderRadius:'3px'}}>⚠ Auto-levels unavailable — paste a prompt response below, or switch to manual override.</div>}
        {mode==='DEPLOY'&&levelsAuto&&dynamicLevels&&<div style={{marginBottom:'14px',padding:'8px 12px',background:'#0d1510',border:`1px dashed ${C.green}`,borderRadius:'3px',fontSize:'10px',color:C.mute,lineHeight:1.5}}>
          {dynamicLevels.deploy.anchorMode==='sth'?<span>Ladder anchored to <span style={{color:C.green,fontWeight:600}}>STH realized price floor</span> — ${sthMstrFloor?.toFixed(2)} MSTR equivalent.</span>:dynamicLevels.deploy.anchorMode==='200ma'?<span>Ladder anchored to <span style={{color:C.gold}}>200-day MA</span>.</span>:<span>Ladder anchored to current price steps.</span>}
        </div>}

        {bandHits.length>0&&(()=>{
          const sh=bandHits.filter(h=>h.side==='SELL'),bh=bandHits.filter(h=>h.side==='BUY');
          return(<div style={{display:'grid',gridTemplateColumns:sh.length&&bh.length?'1fr 1fr':'1fr',gap:'10px',marginBottom:'18px'}}>
            {sh.length>0&&<div style={{background:'rgba(199,62,29,0.08)',border:`1px solid ${C.red}`,padding:'12px',borderRadius:'3px'}}>
              <div style={{fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:C.red,marginBottom:'8px',fontWeight:600}}>● Sell trigger live</div>
              {sh.map(h=><div key={h.tag} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'4px'}}>
                <div style={{fontSize:'11px',color:C.text}}><div style={{fontSize:'12px',fontWeight:600}}>{h.label}</div><div style={{fontSize:'11px',color:C.dim}}>@ {h.zone}</div></div>
                <button onClick={()=>{setView('positions');setPositionForm(pf=>({...pf,entryPrice:String(h.price),tag:h.tag}));}} style={{background:C.red,border:'none',color:'#fff',padding:'6px 12px',fontFamily:S,fontSize:'10px',letterSpacing:'0.12em',fontWeight:600,cursor:'pointer',borderRadius:'2px'}}>SELL</button>
              </div>)}
            </div>}
            {bh.length>0&&(()=>{
              // CASH GATE: evaluate macro regime and portfolio health BEFORE rendering any buy action.
              // HOARD mode below its mandatory 40% cash floor suppresses all executable buy signals.
              const buyGateFailed=mode==='HOARD'&&portfolio.cashPct<HOARD_CASH_MIN_PCT;
              if(buyGateFailed){
                // Muted / restricted state — price target reached but liquidity is insufficient
                return(<div style={{background:'#111318',border:'1px solid #2a3040',padding:'12px',borderRadius:'3px'}}>
                  <div style={{fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:'#7a8aaa',marginBottom:'8px',fontWeight:600}}>● Watching local floor</div>
                  {bh.map(h=><div key={h.tag} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'4px',gap:'8px'}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:'12px',fontWeight:600,color:'#a0aac0'}}>{h.label}</div>
                      <div style={{fontSize:'11px',color:'#5a6478'}}>@ {h.zone}</div>
                    </div>
                    <div style={{background:'#1c2030',border:'1px solid #2a3040',color:'#c8b84a',padding:'6px 10px',fontFamily:S,fontSize:'9px',letterSpacing:'0.1em',fontWeight:700,borderRadius:'2px',textAlign:'center',whiteSpace:'nowrap',lineHeight:1.3}}>
                      TARGET REACHED<br/>LIQUIDITY RESTRICTED
                    </div>
                  </div>)}
                  <div style={{marginTop:'10px',padding:'7px 10px',background:'#0d1018',border:'1px dashed #2a3040',borderRadius:'3px',fontSize:'9px',color:'#7a8aaa',lineHeight:1.5}}>
                    ⛔ CASH HOARD regime requires ≥{HOARD_CASH_MIN_PCT}% cash. Current: <span style={{color:'#c8b84a',fontWeight:600}}>{portfolio.cashPct.toFixed(1)}%</span>. Executable buy suspended until cash buffer is restored.
                  </div>
                </div>);
              }
              // Cash gate passed — render standard executable buy trigger
              return(<div style={{background:'rgba(45,134,89,0.08)',border:`1px solid ${C.green}`,padding:'12px',borderRadius:'3px'}}>
                <div style={{fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:C.green,marginBottom:'8px',fontWeight:600}}>● Buy trigger live</div>
                {bh.map(h=><div key={h.tag} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'4px'}}>
                  <div style={{fontSize:'11px',color:C.text}}><div style={{fontSize:'12px',fontWeight:600}}>{h.label}</div><div style={{fontSize:'11px',color:C.dim}}>@ {h.zone}</div></div>
                  <button onClick={()=>{setView('positions');setPositionForm(pf=>({...pf,entryPrice:String(h.price),tag:h.tag}));}} style={{background:C.green,border:'none',color:'#fff',padding:'6px 12px',fontFamily:S,fontSize:'10px',letterSpacing:'0.12em',fontWeight:600,cursor:'pointer',borderRadius:'2px'}}>BUY</button>
                </div>)}
              </div>);
            })()}
          </div>);
        })()}

        {/* Level grid — FIX 3: responsive */}
        <div style={{paddingTop:'16px',borderTop:`1px solid ${C.border}`}}>
          <div className="g-auto-3" style={{gap:'14px'}}>
            <div>
              <div style={{fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:C.mute,marginBottom:'6px'}}>Sell zone</div>
              <div style={{color:C.hi,fontWeight:600,fontSize:'13px'}}>{currentLevels.sell}</div>
              {(mode==='ROTATE'||mode==='HOARD')&&alertLevels[mode.toLowerCase()].sellAlert!=null&&<div style={{fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',color:C.gold,marginTop:'6px',fontWeight:500}}>Alert ${alertLevels[mode.toLowerCase()].sellAlert.toFixed(2)}</div>}
            </div>
            <div>
              <div style={{fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:C.mute,marginBottom:'6px'}}>Buy zone</div>
              <div style={{color:C.hi,fontWeight:600,fontSize:mode==='DEPLOY'?'10px':'13px',lineHeight:1.3}}>{currentLevels.buy}</div>
              {mode==='ROTATE'&&alertLevels.rotate.buyAlert!=null&&<div style={{fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',color:C.gold,marginTop:'6px',fontWeight:500}}>Alert ${alertLevels.rotate.buyAlert.toFixed(2)}</div>}
              {mode==='HOARD'&&<div style={{fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',color:C.gold,marginTop:'6px',fontWeight:500,lineHeight:1.5}}>Alert ${alertLevels.hoard.buyAlert.toFixed(2)}{alertLevels.hoard.buyDeepAlert!=null&&<><br/>+ ${alertLevels.hoard.buyDeepAlert.toFixed(2)} deep</>}</div>}
              {mode==='DEPLOY'&&alertLevels.deploy.ladder.length>0&&<div style={{fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',color:C.gold,marginTop:'6px',fontWeight:500,lineHeight:1.5}}>Set {alertLevels.deploy.ladder.length} alerts:<br/>{alertLevels.deploy.ladder.map(l=>`$${l.toFixed(2)}`).join(' · ')}</div>}
            </div>
            <div>
              <div style={{fontSize:'9px',letterSpacing:'0.15em',textTransform:'uppercase',color:C.mute,marginBottom:'6px'}}>Cash hold</div>
              <div style={{color:C.hi,fontWeight:600,fontSize:'13px'}}>{cfg.cash}</div>
            </div>
          </div>
        </div>

        {/* P3: BREAK-EVEN CALCULATOR */}
        {(mode==='ROTATE'||mode==='HOARD')&&(
          <div style={{marginTop:'20px',paddingTop:'16px',borderTop:`1px solid ${C.border}`}}>
            <div style={{fontSize:'10px',color:C.mute,letterSpacing:'0.15em',textTransform:'uppercase',marginBottom:'10px'}}>Break-even rotation calculator</div>
            <div style={{display:'flex',gap:'8px',marginBottom:'10px',flexWrap:'wrap'}}>
              <div style={{flex:'1 1 100px',minWidth:'90px'}}>
                <div style={{fontSize:'9px',color:C.mute,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:'4px'}}>Shares to sell</div>
                <input type="number" placeholder={sizingGuardrail?String(sizingGuardrail.maxSellShares):'e.g. 50'} value={beqSellShares} onChange={e=>setBeqSellShares(e.target.value)} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'7px 10px',fontFamily:S,fontSize:'13px'}}/>
              </div>
              <div style={{flex:'1 1 100px',minWidth:'90px'}}>
                <div style={{fontSize:'9px',color:C.mute,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:'4px'}}>Sell price (USD)</div>
                <input type="number" placeholder={`${mstrPrice.toFixed(2)}`} value={beqSellPrice} onChange={e=>setBeqSellPrice(e.target.value)} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'7px 10px',fontFamily:S,fontSize:'13px'}}/>
              </div>
            </div>
            {beqCalc?(
              <div style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:'3px',padding:'12px 14px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'10px'}}>
                  <div>
                    <div style={{fontSize:'9px',color:C.mute,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'2px'}}>Breakeven buyback</div>
                    <div style={{color:C.gold,fontSize:'20px',fontWeight:700}}>${beqCalc.breakeven.toFixed(2)}</div>
                    <div style={{fontSize:'9px',color:C.mute,marginTop:'2px'}}>buy back ≤ this price to net ≥1 extra share</div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:'9px',color:C.mute,marginBottom:'2px'}}>Proceeds</div>
                    <div style={{color:C.text,fontSize:'13px',fontWeight:600}}>${Math.round(beqCalc.proceeds).toLocaleString()}</div>
                    <div style={{fontSize:'9px',color:C.mute,marginTop:'2px'}}>{beqCalc.sh.toFixed(0)} sh @ ${beqCalc.sp.toFixed(2)}</div>
                  </div>
                </div>
                <div style={{borderTop:`1px solid ${C.border}`,paddingTop:'8px'}}>
                  <div style={{fontSize:'9px',color:C.mute,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'6px'}}>Shares gained at buyback discount</div>
                  {beqCalc.steps.map(step=>(

                    <div><div style={{color:C.mute,fontSize:'9px',textTransform:'uppercase'}}>Shares</div><div style={{color:C.text,fontWeight:600}}>{p.shares}</div></div>
                    <div><div style={{color:C.mute,fontSize:'9px',textTransform:'uppercase'}}>Entry</div><div style={{color:C.text,fontWeight:600}}>${p.entryPrice.toFixed(2)}</div></div>

                  </div>}
                  {!isOpen&&<div style={{marginTop:'8px',display:'flex',justifyContent:'flex-end'}}><button onClick={()=>deletePosition(p.id)} style={{background:'transparent',border:`1px solid ${C.border}`,color:C.mute,padding:'4px 8px',fontFamily:S,fontSize:'9px',cursor:'pointer'}}>DELETE</button></div>}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </>)}

    {/* PROJECT TAB */}
    {view==='project'&&(
      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'20px'}}>
        <SH>◆ What-if projection</SH>
        <div style={{fontSize:'11px',color:C.dim,marginBottom:'16px',lineHeight:1.6}}>Implied MSTR price = (BTC holdings × future BTC) ÷ (future diluted shares) × mNAV. Not a forecast.</div>
        <div style={{marginBottom:'20px'}}>
          <div style={{fontSize:'10px',color:C.mute,letterSpacing:'0.15em',textTransform:'uppercase',marginBottom:'12px'}}>Scenario inputs</div>
          <div className="g-auto-3" style={{marginBottom:'12px'}}>
            <div><div style={{fontSize:'9px',color:C.red,textTransform:'uppercase',marginBottom:'4px'}}>Bear BTC</div><input type="number" value={projBearBtc} onChange={e=>setProjBearBtc(Number(e.target.value))} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'7px 8px',fontFamily:S,fontSize:'12px'}}/></div>
            <div><div style={{fontSize:'9px',color:C.gold,textTransform:'uppercase',marginBottom:'4px'}}>Base BTC</div><input type="number" value={projBaseBtc} onChange={e=>setProjBaseBtc(Number(e.target.value))} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'7px 8px',fontFamily:S,fontSize:'12px'}}/></div>
            <div><div style={{fontSize:'9px',color:C.green,textTransform:'uppercase',marginBottom:'4px'}}>Bull BTC</div><input type="number" value={projBullBtc} onChange={e=>setProjBullBtc(Number(e.target.value))} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'7px 8px',fontFamily:S,fontSize:'12px'}}/></div>
          </div>
          <div className="g-auto-3" style={{marginBottom:'12px'}}>
            <div><div style={{fontSize:'9px',color:C.red,textTransform:'uppercase',marginBottom:'4px'}}>Bear mNAV</div><input type="number" step="0.1" value={projBearMnav} onChange={e=>setProjBearMnav(Number(e.target.value))} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'7px 8px',fontFamily:S,fontSize:'12px'}}/></div>
            <div><div style={{fontSize:'9px',color:C.gold,textTransform:'uppercase',marginBottom:'4px'}}>Base mNAV</div><input type="number" step="0.1" value={projBaseMnav} onChange={e=>setProjBaseMnav(Number(e.target.value))} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'7px 8px',fontFamily:S,fontSize:'12px'}}/></div>
            <div><div style={{fontSize:'9px',color:C.green,textTransform:'uppercase',marginBottom:'4px'}}>Bull mNAV</div><input type="number" step="0.1" value={projBullMnav} onChange={e=>setProjBullMnav(Number(e.target.value))} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'7px 8px',fontFamily:S,fontSize:'12px'}}/></div>
          </div>
          <div><div style={{fontSize:'9px',color:C.mute,textTransform:'uppercase',marginBottom:'4px'}}>Future diluted shares (M) — blank = current ({dilutedShares}M)</div><input type="number" step="1" placeholder={`${dilutedShares} (current)`} value={projShares===null?'':projShares} onChange={e=>setProjShares(e.target.value===''?null:Number(e.target.value))} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'7px 8px',fontFamily:S,fontSize:'12px'}}/></div>
        </div>
        <div style={{fontSize:'10px',color:C.mute,marginBottom:'16px',padding:'8px 10px',background:C.bg,border:`1px solid ${C.border}`,borderRadius:'3px',lineHeight:1.5}}>
          Current: {journalStats.currentShares.toFixed(0)} sh · £{portfolio.totalGBP.toLocaleString(undefined,{maximumFractionDigits:0})} total · {btcHoldings.toLocaleString()} BTC held
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
          {projectionScenarios.map(sc=>(
            <div key={sc.label} style={{padding:'14px 16px',background:C.bg,border:`1px solid ${sc.color}`,borderRadius:'3px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
                <div style={{fontSize:'11px',color:sc.color,fontWeight:700,letterSpacing:'0.2em',textTransform:'uppercase'}}>{sc.label}</div>
                <div style={{fontSize:'10px',color:sc.vsCurrentPct>=0?C.green:C.red,fontWeight:600}}>{sc.vsCurrentPct>=0?'+':''}{sc.vsCurrentPct.toFixed(0)}% vs today</div>
              </div>
              <div className="g-auto-4">
                <div><div style={{fontSize:'9px',color:C.faint,textTransform:'uppercase',marginBottom:'2px'}}>BTC</div><div style={{color:C.text,fontSize:'12px',fontWeight:600}}>${sc.btc.toLocaleString()}</div></div>
                <div><div style={{fontSize:'9px',color:C.faint,textTransform:'uppercase',marginBottom:'2px'}}>mNAV</div><div style={{color:C.text,fontSize:'12px',fontWeight:600}}>{sc.mnav.toFixed(1)}x</div></div>
                <div><div style={{fontSize:'9px',color:C.faint,textTransform:'uppercase',marginBottom:'2px'}}>MSTR</div><div style={{color:sc.color,fontSize:'12px',fontWeight:600}}>${sc.impliedPrice.toFixed(0)}</div></div>
                <div><div style={{fontSize:'9px',color:C.faint,textTransform:'uppercase',marginBottom:'2px'}}>Portfolio</div><div style={{color:sc.color,fontSize:'12px',fontWeight:600}}>£{Math.round(sc.totalGBP).toLocaleString()}</div></div>
              </div>
            </div>
          ))}
        </div>
        <div style={{marginTop:'14px',fontSize:'10px',color:C.faint,lineHeight:1.5,fontStyle:'italic'}}>Uses current BTC holdings ({btcHoldings.toLocaleString()}) and share count ({journalStats.currentShares.toFixed(0)} sh). NOT a forecast.</div>
      </div>
    )}

    {/* BACKUP TAB */}
    {view==='backup'&&(<>
      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'20px'}}>
        <SH>◆ Export state</SH>
        <div style={{fontSize:'11px',color:C.dim,marginBottom:'14px',lineHeight:1.6}}>Full JSON — settings, trades, positions, snapshots, miss events. Auto-persists in localStorage; export is your portable backup.</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
          <button onClick={exportJSONFile} style={{background:C.gold,color:'#000',border:'none',padding:'10px',fontFamily:S,fontSize:'11px',letterSpacing:'0.15em',cursor:'pointer',borderRadius:'2px',fontWeight:600}}>DOWNLOAD .JSON</button>
          <button onClick={exportJSON} style={{background:'transparent',color:C.gold,border:`1px solid ${C.gold}`,padding:'10px',fontFamily:S,fontSize:'11px',letterSpacing:'0.15em',cursor:'pointer',borderRadius:'2px'}}>COPY TO CLIPBOARD</button>
        </div>
        {importResult?.payload&&<textarea readOnly value={importResult.payload} style={{width:'100%',marginTop:'12px',height:'160px',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'8px',fontFamily:'monospace',fontSize:'10px'}}/>}
      </div>
      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px'}}>
        <SH>◆ Import state</SH>
        <label style={{display:'block',marginBottom:'12px'}}><span style={{display:'inline-block',background:'transparent',color:C.dim,border:`1px dashed ${C.border}`,padding:'8px 14px',fontFamily:S,fontSize:'10px',letterSpacing:'0.1em',cursor:'pointer',borderRadius:'2px',textTransform:'uppercase'}}>Choose .json file</span><input type="file" accept="application/json,.json" onChange={e=>importJSONFile(e.target.files?.[0])} style={{display:'none'}}/></label>
        <textarea value={importText} onChange={e=>setImportText(e.target.value)} placeholder='{"version":14.6,...}' style={{width:'100%',height:'140px',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'8px',fontFamily:'monospace',fontSize:'10px',marginBottom:'12px'}}/>
        <button onClick={importJSON} disabled={!importText.trim()} style={{width:'100%',background:importText.trim()?C.green:C.border,color:'#fff',border:'none',padding:'10px',fontFamily:S,fontSize:'11px',letterSpacing:'0.15em',cursor:importText.trim()?'pointer':'not-allowed',borderRadius:'2px',fontWeight:600}}>IMPORT JSON</button>
        {importResult&&<div style={{marginTop:'12px',fontSize:'11px',color:importResult.ok?C.green:C.red,padding:'8px 12px',border:`1px dashed ${importResult.ok?C.green:C.red}`}}>{importResult.ok?'✓ ':'⚠ '}{importResult.msg}</div>}
      </div>
    </>)}

    {/* JOURNAL TAB */}
    {view==='journal'&&(<>
      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'20px'}}>
        <SH>◆ Campaign progress</SH>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',fontSize:'12px',marginBottom:'16px'}}>
          <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>Starting shares</div><input type="number" value={startingShares} onChange={e=>setStartingShares(Number(e.target.value))} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.hi,padding:'6px 10px',fontFamily:S,fontSize:'15px',marginTop:'4px'}}/></div>
          <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>Current shares</div><div style={{color:C.hi,fontSize:'20px',marginTop:'4px',fontWeight:600}}>{journalStats.currentShares.toFixed(0)}</div></div>
          <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>Δ shares</div><div style={{color:journalStats.sharesDelta>=0?C.green:C.red,fontSize:'20px',marginTop:'4px',fontWeight:600}}>{journalStats.sharesDelta>=0?'+':''}{journalStats.sharesDelta.toFixed(0)} ({journalStats.sharesPct.toFixed(1)}%)</div></div>
          <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>Net cash flow</div><div style={{color:C.hi,fontSize:'15px',marginTop:'4px'}}>${journalStats.totalCash.toFixed(0)}</div></div>
        </div>
        {journalStats.weightedAvgCost!==null&&<div style={{marginBottom:'14px',padding:'10px 12px',background:C.bg,border:`1px solid ${C.border}`,borderRadius:'3px'}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
            <div><div style={{fontSize:'9px',color:C.mute,textTransform:'uppercase',marginBottom:'2px'}}>Wtd avg cost (trades only)</div><div style={{color:C.gold,fontSize:'15px',fontWeight:600}}>${journalStats.weightedAvgCost.toFixed(2)}</div><div style={{fontSize:'9px',color:mstrPrice>=journalStats.weightedAvgCost?C.green:C.red,marginTop:'2px'}}>{mstrPrice>=journalStats.weightedAvgCost?`+${(((mstrPrice-journalStats.weightedAvgCost)/journalStats.weightedAvgCost)*100).toFixed(1)}% above cost`:`${(((mstrPrice-journalStats.weightedAvgCost)/journalStats.weightedAvgCost)*100).toFixed(1)}% below cost`}</div></div>
            <div><div style={{fontSize:'9px',color:C.mute,textTransform:'uppercase',marginBottom:'2px'}}>Total buy cash</div><div style={{color:C.text,fontSize:'15px',fontWeight:600}}>${Math.round(journalStats.totalBuyCash).toLocaleString()}</div><div style={{fontSize:'9px',color:C.mute,marginTop:'2px'}}>all BUY legs inc. fees</div></div>
          </div>
        </div>}
        <div style={{paddingTop:'14px',borderTop:`1px solid ${C.border}`}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',fontSize:'12px'}}>
            <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>Rotation shares gained</div><div style={{color:journalStats.rotationShares>=0?C.green:C.red,fontSize:'20px',marginTop:'4px',fontWeight:600}}>{journalStats.completedRotations>0?`${journalStats.rotationShares>=0?'+':''}${journalStats.rotationShares.toFixed(0)}`:'—'}</div><div style={{color:C.mute,fontSize:'10px',marginTop:'2px'}}>{journalStats.completedRotations} completed rotation{journalStats.completedRotations!==1?'s':''}</div>{journalStats.rotationShares>0&&thesisPerf.rotationAlphaGBP>0&&<div style={{color:C.green,fontSize:'11px',marginTop:'4px',fontWeight:600}}>≈ £{Math.round(thesisPerf.rotationAlphaGBP).toLocaleString()} alpha value</div>}</div>
            <div><div style={{color:C.mute,fontSize:'10px',textTransform:'uppercase'}}>Avg per rotation</div><div style={{color:C.hi,fontSize:'20px',marginTop:'4px',fontWeight:600}}>{journalStats.completedRotations>0?`+${(journalStats.rotationShares/journalStats.completedRotations).toFixed(1)}`:'—'}</div><div style={{color:C.mute,fontSize:'10px',marginTop:'2px'}}>shares per cycle</div>{journalStats.accrualRateAnnual!==null&&<div style={{color:C.gold,fontSize:'10px',marginTop:'4px'}}>{journalStats.accrualRateAnnual.toFixed(1)} sh/yr annualised</div>}</div>
          </div>
          {journalStats.completedRotations>0&&<div style={{marginTop:'14px',paddingTop:'14px',borderTop:`1px solid ${C.border}`}}>
            <div style={{fontSize:'10px',color:C.mute,textTransform:'uppercase',marginBottom:'8px'}}>Accrual efficiency</div>
            {journalStats.costPerExtraShare!==null&&journalStats.rotationShares>0?(
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
                <div><div style={{color:C.mute,fontSize:'9px',textTransform:'uppercase'}}>Cost per extra share</div><div style={{color:C.gold,fontSize:'16px',marginTop:'2px',fontWeight:600}}>${journalStats.costPerExtraShare.toFixed(0)}</div><div style={{color:C.mute,fontSize:'9px',marginTop:'2px'}}>vs current ${mstrPrice.toFixed(0)}</div></div>
                <div><div style={{color:C.mute,fontSize:'9px',textTransform:'uppercase'}}>Efficiency vs market</div><div style={{display:'flex',alignItems:'center',gap:'6px',marginTop:'2px'}}><div style={{color:journalStats.costPerExtraShare<mstrPrice?C.green:C.red,fontSize:'16px',fontWeight:600}}>{journalStats.costPerExtraShare<mstrPrice?`${(((mstrPrice-journalStats.costPerExtraShare)/mstrPrice)*100).toFixed(0)}% below`:`${(((journalStats.costPerExtraShare-mstrPrice)/mstrPrice)*100).toFixed(0)}% above`}</div>{thesisPerf.alphaConfirmed&&<span style={{fontSize:'9px',color:C.green,border:`1px solid ${C.green}`,padding:'1px 5px',borderRadius:'2px',letterSpacing:'0.06em',fontWeight:700}}>ALPHA ✓</span>}</div></div>
              </div>
            ):<div style={{fontSize:'11px',color:C.mute,fontStyle:'italic',padding:'8px 10px',background:C.bg,border:`1px dashed ${C.border}`}}>{journalStats.rotationShares<=0?'Net rotation shares zero or negative.':'Awaiting completed cycle…'}</div>}
            <div style={{fontSize:'10px',color:C.mute,marginTop:'10px',lineHeight:1.5,fontStyle:'italic'}}>Efficiency = cash in paired BUY legs ÷ net shares gained. Below market = positive alpha.</div>
          </div>}
          {journalStats.completedRotations===0&&trades.length>0&&<div style={{fontSize:'11px',color:C.mute,fontStyle:'italic',padding:'10px 12px',background:C.bg,border:`1px dashed ${C.border}`,marginTop:'16px'}}>Awaiting completed cycle… Log a paired SELL → BUY to see accrual efficiency.</div>}
          <div style={{fontSize:'10px',color:C.mute,marginTop:'12px',lineHeight:1.5,fontStyle:'italic'}}>Rotation shares = paired SELL→BUY differences only. Direct buys tracked in share count but not rotation metrics.</div>
        </div>
      </div>

      {/* P2: EXECUTION DISCIPLINE */}
      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'20px'}}>
        <SH>◆ Execution discipline</SH>
        <div style={{fontSize:'11px',color:C.dim,marginBottom:'14px',lineHeight:1.6}}>Tracks zone hits detected on dashboard load. "Yes" = logged trade. "No" = missed. Dismissals not counted.</div>
        <div className="g-auto-2" style={{marginBottom:'16px'}}>
          <div style={{padding:'10px',background:C.bg,border:`1px solid ${C.border}`,borderRadius:'3px'}}>
            <div style={{fontSize:'9px',color:C.mute,textTransform:'uppercase',marginBottom:'4px'}}>Sell zone exec rate</div>
            <div style={{color:missStats.execRateSell===null?C.faint:missStats.execRateSell>=70?C.green:missStats.execRateSell>=40?C.gold:C.red,fontSize:'20px',fontWeight:700}}>{missStats.execRateSell!==null?`${missStats.execRateSell}%`:'—'}</div>
            <div style={{fontSize:'9px',color:C.mute,marginTop:'2px'}}>{missStats.actedSell} acted · {missStats.sellMisses} missed</div>
          </div>
          <div style={{padding:'10px',background:C.bg,border:`1px solid ${C.border}`,borderRadius:'3px'}}>
            <div style={{fontSize:'9px',color:C.mute,textTransform:'uppercase',marginBottom:'4px'}}>Buy zone exec rate</div>
            <div style={{color:missStats.execRateBuy===null?C.faint:missStats.execRateBuy>=70?C.green:missStats.execRateBuy>=40?C.gold:C.red,fontSize:'20px',fontWeight:700}}>{missStats.execRateBuy!==null?`${missStats.execRateBuy}%`:'—'}</div>
            <div style={{fontSize:'9px',color:C.mute,marginTop:'2px'}}>{missStats.actedBuy} acted · {missStats.buyMisses} missed</div>
          </div>
        </div>
        {misses.length===0?<div style={{fontSize:'11px',color:C.faint,fontStyle:'italic',textAlign:'center',padding:'12px 0'}}>No missed zones recorded. Prompts appear automatically on dashboard load.</div>:(
          <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
            {[...misses].reverse().map(m=>(
              <div key={m.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',background:C.bg,border:`1px solid ${m.side==='SELL'?'rgba(199,62,29,0.3)':'rgba(45,134,89,0.3)'}`,borderRadius:'3px'}}>
                <div>
                  <div style={{fontSize:'10px',color:m.side==='SELL'?C.red:C.green,fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase'}}>MISSED {m.side} · {m.tag}</div>
                  <div style={{fontSize:'9px',color:C.mute,marginTop:'2px'}}>{m.date} {m.time} · {m.zone} · ${m.price?.toFixed(2)} · {m.mode}</div>
                </div>
                <button onClick={()=>deleteMiss(m.id)} style={{background:'transparent',border:'none',color:C.faint,cursor:'pointer',fontSize:'14px',padding:'0 4px'}}>×</button>
              </div>
            ))}
          </div>
        )}
        <div style={{fontSize:'9px',color:C.faint,marginTop:'12px',lineHeight:1.5,fontStyle:'italic'}}>Target ≥70% execution rate on both sides for consistent accumulation discipline.</div>
      </div>

      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px',marginBottom:'20px'}}>
        <SH>◆ Add trade</SH>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'12px'}}>
          <div style={{display:'flex',gap:'8px'}}>
            <button onClick={()=>setTradeType('SELL')} style={{flex:1,background:tradeType==='SELL'?C.red:'transparent',color:tradeType==='SELL'?'#fff':C.dim,border:`1px solid ${tradeType==='SELL'?C.red:C.border}`,padding:'8px',fontFamily:S,fontSize:'11px',letterSpacing:'0.1em',cursor:'pointer'}}>SELL</button>
            <button onClick={()=>setTradeType('BUY')} style={{flex:1,background:tradeType==='BUY'?C.green:'transparent',color:tradeType==='BUY'?'#fff':C.dim,border:`1px solid ${tradeType==='BUY'?C.green:C.border}`,padding:'8px',fontFamily:S,fontSize:'11px',letterSpacing:'0.1em',cursor:'pointer'}}>BUY</button>
          </div>
          <input type="date" value={tradeDate} onChange={e=>setTradeDate(e.target.value)} style={{background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'8px',fontFamily:S,fontSize:'12px'}}/>

          <input type="number" placeholder="Price (USD)" value={tradePrice} onChange={e=>setTradePrice(e.target.value)} style={{background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'8px',fontFamily:S,fontSize:'12px'}}/>
          <input type="number" placeholder="Fees (USD, optional)" value={tradeFees} onChange={e=>setTradeFees(e.target.value)} style={{gridColumn:'span 2',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'8px',fontFamily:S,fontSize:'12px'}}/>
        </div>
        {(()=>{const buyRestricted=tradeType==='BUY'&&mode==='HOARD'&&portfolio.cashPct<HOARD_CASH_MIN_PCT;return(<button onClick={buyRestricted?undefined:addTrade} disabled={buyRestricted} style={{width:'100%',background:buyRestricted?C.border:C.gold,color:buyRestricted?C.dim:C.bg,border:'none',padding:'10px',fontFamily:S,fontSize:'12px',letterSpacing:'0.15em',textTransform:'uppercase',cursor:buyRestricted?'not-allowed':'pointer',fontWeight:600}}>{buyRestricted?'⛔ BUYING RESTRICTED (CASH CAP)':'+ Log trade'}</button>);})()}
      </div>

      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px'}}>
        <SH>◆ Trade history</SH>
        {trades.length===0?<div style={{color:C.faint,fontSize:'12px',textAlign:'center',padding:'20px 0'}}>No trades logged yet.</div>
          :[...trades].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>(
            <div key={t.id} style={{display:'grid',gridTemplateColumns:'60px 1fr 1fr 1fr 30px',gap:'10px',padding:'10px 0',borderBottom:`1px solid ${C.border}`,fontSize:'12px',alignItems:'center'}}>
              <span style={{color:t.type==='SELL'?C.red:C.green,fontWeight:600,letterSpacing:'0.1em',fontSize:'10px'}}>{t.type}</span>
              <span style={{color:C.dim}}>{t.date}</span>
              <span style={{color:C.text}}>{t.shares} sh</span>
              <span style={{color:C.gold}}>${t.price}</span>
              <button onClick={()=>deleteTrade(t.id)} style={{background:'transparent',border:'none',color:C.faint,cursor:'pointer',fontSize:'14px'}}>×</button>
            </div>
          ))}
      </div>
    </>)}

    {/* SNAPSHOTS TAB */}
    {view==='snapshots'&&(
      <div style={{background:C.panel,border:`1px solid ${C.border}`,padding:'20px'}}>
        <SH>◆ Signal evolution log</SH>
        <div style={{fontSize:'11px',color:C.dim,marginBottom:'16px',lineHeight:1.6}}>Save weekly snapshots. Trends matter more than any single reading.</div>
        <EquityCurve snapshots={snapshots} startingShares={startingShares} mstrPrice={mstrPrice} gbpUsd={gbpUsd}/>
        {snapshots.length===0?<div style={{color:C.faint,fontSize:'12px',textAlign:'center',padding:'20px 0'}}>No snapshots saved yet.</div>
          :[...snapshots].reverse().map(s=>(
            <div key={s.date} style={{padding:'12px 0',borderBottom:`1px solid ${C.border}`,fontSize:'11px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px'}}>
                <span style={{color:C.dim}}>{new Date(s.date).toLocaleDateString()} {new Date(s.date).toLocaleTimeString().slice(0,5)}</span>
                <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                  <span style={{color:modeCfg[s.mode]?.color||C.gold,fontWeight:600,fontSize:'10px',letterSpacing:'0.1em'}}>{s.mode}</span>
                  <button onClick={()=>deleteSnapshot(s.date)} style={{background:'transparent',border:'none',color:C.faint,cursor:'pointer',fontSize:'14px'}}>×</button>
                </div>
              </div>
              {/* FIX 3: responsive snapshot grid */}
              <div className="g-snap-5" style={{color:C.mute,fontSize:'10px'}}>
                <span>MSTR ${s.mstrPrice?.toFixed(0)}</span>
                <span>BTC ${(s.btcPrice/1000).toFixed(0)}k</span>
                <span>mNAV {s.mNAV}x</span>
                <span>Bear {s.bearScore}</span>
                <span>Bot {s.bottomScore}</span>
              </div>
              {s.currentShares!==undefined&&<div style={{marginTop:'4px',fontSize:'9px',color:C.faint}}>{s.currentShares.toFixed(0)} sh · £{Math.round((s.currentShares*s.mstrPrice/(s.gbpUsd||gbpUsd))+(s.cashBufferGBP||0)).toLocaleString()} portfolio</div>}
              {(s.etfFlows5d!==undefined||s.btcBelowSthCost||s.btcDominance!==undefined||s.ivRank!==undefined)&&(
                <div style={{display:'flex',gap:'12px',marginTop:'4px',color:C.faint,fontSize:'9px',flexWrap:'wrap'}}>
                  {s.etfFlows5d!==undefined&&s.etfFlows5d!==null&&<span>ETF 5D {s.etfFlows5d>=0?'+':''}${s.etfFlows5d}M</span>}
                  {s.btcBelowSthCost&&<span style={{color:C.red}}>BTC&lt;STH</span>}
                  {s.etfOutflowsPersistent&&<span style={{color:C.red}}>ETF out</span>}
                  {s.btcDominance!==undefined&&s.btcDominance!==null&&<span>BTC.D {s.btcDominance.toFixed(1)}%</span>}
                  {s.mstrShortInt!==undefined&&s.mstrShortInt!==null&&<span>Short {s.mstrShortInt.toFixed(1)}%</span>}
                  {s.atmActive&&<span style={{color:C.gold}}>ATM ON</span>}
                  {s.ivRank!==undefined&&s.ivRank!==null&&<span style={{color:s.ivRank>75?C.red:C.faint}}>IV {s.ivRank}{s.ivRank>75?' ⚡':''}</span>}
                </div>
              )}
            </div>
          ))}
      </div>
    )}

    <div style={{textAlign:'center',marginTop:'32px',fontSize:'10px',color:C.faint,letterSpacing:'0.15em'}}>
      NOT FINANCIAL ADVICE · YOUR THESIS · YOUR CONVICTION · YOUR DECISION
    </div>
    </div>
    </div>
    </>
  );
}

function App() {
  const [unlocked,setUnlocked]=useState(()=>{if(!AUTH_REQUIRED)return true;try{return sessionStorage.getItem(AUTH_SESSION_KEY)==='1';}catch(e){return false;}});
  if(!unlocked)return <Gate onUnlock={()=>setUnlocked(true)}/>;
  return <MSTRCycleTool/>;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
