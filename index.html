<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>MSTR Cycle Tool</title>

<!--
  =================================================================
  MSTR CYCLE DECISION FRAMEWORK · v14.1 (web build)
  =================================================================

  CHANGES IN v14.1 vs v14.0
  -------------------------
  Hardening pass focused on data quality and parser robustness.

    1. Hardened prompt: forces LLM to (a) state its sense of "now",
       (b) prefer real-time sources over articles, (c) self-rate
       confidence HIGH/MEDIUM/LOW with explicit criteria, (d) emit
       DATA_TIMESTAMP and STALE_FIELDS for structured staleness
       detection. The prompt is now ~2.5x longer but extracts much
       more reliable, dated data.

    2. Staleness banner: top-of-dashboard warning when data is stale.
       Two-tier (amber >24h, red >72h) plus a separate flag when LLM
       confidence is LOW or any STALE_FIELDS are reported. Driven by
       LLM-asserted DATA_TIMESTAMP when available (preferred), falling
       back to paste-time. Stale data at source is now distinguishable
       from stale paste.

    3. Parser hardening: replaced parseFloat/!isNaN combo with
       Number.isFinite-based safeNum helper that explicitly rejects
       NaN, Infinity, -Infinity, and (configurably) negative/zero
       values. Number coercion is now explicit via Number() inside
       safeNum, eliminating any path for non-numeric values to enter
       state.

    4. USD buying power: portfolio section now shows cashBuffer × gbpUsd
       as a USD figure alongside the GBP one, so cash is directly
       comparable to USD-quoted ladder rungs. In DEPLOY mode, also
       shows estimated per-rung dollar amount and share equivalent.

    5. lastUpdated bug fix: previously sliced to YYYY-MM-DD, which
       made the staleness check unable to distinguish minutes-old
       from 23-hours-old paste. Now stores full ISO timestamp.

  CHANGES IN v14.0 vs v13.2
  -------------------------
  Three new on-chain / corporate signals added per the framework
  research note. All three are sourced via the augmented prompt and
  parsed automatically into state. No new manual data entry burden.

    1. mNAV (computed): The primary valuation metric for BTC treasury
       companies. EV / BTC NAV. Two thresholds drive scoring:
         - mNAV < 1.05  → +2 bottom (capitulation / sub-NAV print zone)
         - mNAV 1.05–1.20 → +1 bear (premium-engine stall — ATM less effective)
         - mNAV > 2.5  → +2 bear (late-cycle euphoria)
       UI ladder rewritten: green <1.05, neutral 1.05–1.8, amber 1.8–2.5, red >2.5

    2. BTC below STH cost basis: Short-term holders are recent buyers;
       when spot < STH realized price they're underwater and structural
       sell pressure rises. +1 bear, +1 bottom when ON.

    3. ETF outflows persistent: 5-day cumulative net spot BTC ETF flows.
       More than $500M outflows over 5 trading days flips this ON.
       +1 bear. Measures institutional risk-off (the marginal spot
       buyer/seller that funding rates do NOT capture).

  Max bear score: 13 → 17
  Max bottom score: 17 → 19
  HOARD threshold ≥6 and DEPLOY threshold ≥7 unchanged (proportional).

  New dashboard card "On-chain & corporate signals" surfaces all three
  new readings with their threshold proximity, so users see the
  underlying numbers rather than just the boolean.

  Prompt updated to request: STH_REALIZED_PRICE, ETF_FLOWS_5D, MNAV,
  TOTAL_DEBT, PREFERRED_NOTIONAL, CASH_POSITION. Plus four new binary
  flags (BTC_BELOW_STH_COST, ETF_OUTFLOWS_PERSISTENT, MNAV_COMPRESSED,
  MNAV_EUPHORIC).

  IMPORTANT: legacy MNAV calculation from BTC_HOLDINGS / DILUTED_SHARES
  is retained as a sanity-check (shown as "computed mNAV" alongside the
  parsed value). They will diverge slightly because the legacy calc
  ignores debt + preferred − cash. The new parsed value is authoritative.

  CHANGING THE PASSWORD
  ---------------------
  (unchanged from v13.2 — see PASSWORD_HASH below)
-->

<script>
  // === GATE CONFIG ============================================
  const PASSWORD_HASH = '021ab4d101785587d5ddc3e3715150393924c9df228cb6732c40da48a6cfc7c4';
  const AUTH_REQUIRED = true;
  const AUTH_SESSION_KEY = 'mstr:auth';
  // ============================================================

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function tryUnlock(input) {
    const h = await sha256Hex(input);
    return h === PASSWORD_HASH;
  }
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0806; color: #d4c8b8; -webkit-font-smoothing: antialiased; }
  body { font-family: Georgia, "Times New Roman", serif; min-height: 100vh; min-height: 100dvh; }
  input, button, textarea { font-family: inherit; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; color: #8a7a65; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; }
  .gate { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 24px; }
  .gate-card { background: #14100c; border: 1px solid #2a2520; padding: 32px; max-width: 360px; width: 100%; border-radius: 3px; }
  .gate-title { font-size: 14px; color: #d4a017; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
  .gate-sub { font-size: 11px; color: #8a7a65; margin-bottom: 24px; }
  .gate-input { width: 100%; background: #0a0806; border: 1px solid #2a2520; color: #d4c8b8; padding: 10px 12px; font-size: 14px; letter-spacing: 0.05em; margin-bottom: 12px; border-radius: 2px; outline: none; }
  .gate-input:focus { border-color: #d4a017; }
  .gate-btn { width: 100%; background: #d4a017; color: #000; border: none; padding: 11px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; border-radius: 2px; font-weight: 600; }
  .gate-btn:disabled { background: #2a2520; color: #5a5048; cursor: not-allowed; }

<body>
<div id="root"><div id="loading">Loading…</div></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

function Gate({ onUnlock }) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    if (!pw) return;
    setBusy(true); setErr('');
    const ok = await tryUnlock(pw);
    setBusy(false);
    if (ok) {
      try { sessionStorage.setItem(AUTH_SESSION_KEY, '1'); } catch (e) {}
      onUnlock();
    } else {
      setErr('Incorrect password.');
      setPw('');
    }
  };

  return (
    <div className="gate">
      <div className="gate-card">
        <div className="gate-title">MSTR Cycle Tool</div>
        <div className="gate-sub">Enter password to continue.</div>
        <input
          type="password" className="gate-input" autoFocus
          value={pw}
          onChange={(e) => setPw(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
          placeholder="Password"
        />
        <button className="gate-btn" onClick={submit} disabled={busy || !pw}>
          {busy ? 'Checking…' : 'Unlock'}
        </button>
        <div className="gate-err">{err}</div>
      </div>
    </div>
  );
}

function MSTRCycleTool() {
  // ============ CORE PRICE STATE ============
  const [mstrPrice, setMstrPrice] = useState(187);
  const [btcPrice, setBtcPrice] = useState(80000);
  const [ma200, setMa200] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [pasteText, setPasteText] = useState('');
  const [pasteResult, setPasteResult] = useState(null);

  // ============ TECHNICAL LEVELS ============
  const [high20, setHigh20] = useState(null);
  const [low20, setLow20] = useState(null);
  const [high50, setHigh50] = useState(null);
  const [low50, setLow50] = useState(null);
  const [low200, setLow200] = useState(null);
  const [atr14, setAtr14] = useState(null);

  // ============ STRATEGY STATE (persisted) ============
  const [nupl, setNupl] = useState(19);
  const [mvrv, setMvrv] = useState(1.4);
  const [fundingNegative, setFundingNegative] = useState(false);
  const [derivativesExhaustion, setDerivativesExhaustion] = useState(false);
  const [below200ma, setBelow200ma] = useState(false);
  const [weeklyLowerLow, setWeeklyLowerLow] = useState(false);
  const [dxyAbove110, setDxyAbove110] = useState(false);
  const [btcHoldings, setBtcHoldings] = useState(818869);
  const [dilutedShares, setDilutedShares] = useState(280);
  const [corporateBaseUpdated, setCorporateBaseUpdated] = useState(null);
  const [startingShares, setStartingShares] = useState(211);
  const [cashBuffer, setCashBuffer] = useState(0);
  const [gbpUsd, setGbpUsd] = useState(1.27);

  // ============ v14 NEW STATE: mNAV / STH / ETF flows ============
  // mNAV is parsed from prompt response directly (LLM computes it including debt+preferred-cash).
  // We also retain a legacy mNAV computed from just holdings+shares so users can sanity-check.
  const [parsedMnav, setParsedMnav] = useState(null);
  const [totalDebt, setTotalDebt] = useState(null);          // millions USD
  const [preferredNotional, setPreferredNotional] = useState(null);  // millions USD
  const [cashPosition, setCashPosition] = useState(null);    // millions USD
  const [sthRealizedPrice, setSthRealizedPrice] = useState(null);
  const [btcBelowSthCost, setBtcBelowSthCost] = useState(false);
  const [etfFlows5d, setEtfFlows5d] = useState(null);        // millions USD, signed
  const [etfOutflowsPersistent, setEtfOutflowsPersistent] = useState(false);
  const [mnavCompressed, setMnavCompressed] = useState(false);
  const [mnavEuphoric, setMnavEuphoric] = useState(false);

  // v14.1: data freshness tracking — driven by the LLM's stated DATA_TIMESTAMP
  // rather than paste-time, because data can be stale-at-source even if you
  // pasted it 5 seconds ago.
  const [dataTimestamp, setDataTimestamp] = useState(null);  // ISO string from LLM
  const [confidence, setConfidence] = useState(null);         // HIGH | MEDIUM | LOW
  const [staleFields, setStaleFields] = useState(null);       // comma-sep string or "NONE"

  // Level overrides
  const [levelsAuto, setLevelsAuto] = useState(true);
  const [manualSellLow, setManualSellLow] = useState(192);
  const [manualSellHigh, setManualSellHigh] = useState(200);
  const [manualBuyLow, setManualBuyLow] = useState(170);
  const [manualBuyHigh, setManualBuyHigh] = useState(180);

  // Journal/snapshots
  const [trades, setTrades] = useState([]);
  const [snapshots, setSnapshots] = useState([]);

  // ============ AGGRESSION PROFILE ============
  const [aggressionStyle, setAggressionStyle] = useState('moderate');

  // ============ ACTIVE POSITIONS ============
  const [positions, setPositions] = useState([]);
  const [positionForm, setPositionForm] = useState({ shares: '', entryPrice: '', stop: '', target: '', tag: 'MANUAL', notes: '' });
  const [exitPrices, setExitPrices] = useState({});
  const [view, setView] = useState('dashboard');
  const [tradeType, setTradeType] = useState('SELL');
  const [tradeShares, setTradeShares] = useState('');
  const [tradePrice, setTradePrice] = useState('');
  const [tradeDate, setTradeDate] = useState(new Date().toISOString().slice(0, 10));
  const [tradeFees, setTradeFees] = useState('');
  const [promptCopied, setPromptCopied] = useState(false);

  // ============ LOAD/PERSIST ============
  useEffect(() => {
    const load = async () => {
      try {
        const settings = ({ value: localStorage.getItem('mstr:settings') });
        if (settings?.value) {
          const s = JSON.parse(settings.value);
          if (s.mstrPrice !== undefined) setMstrPrice(s.mstrPrice);
          if (s.btcPrice !== undefined) setBtcPrice(s.btcPrice);
          if (s.ma200 !== undefined) setMa200(s.ma200);
          if (s.lastUpdated !== undefined) setLastUpdated(s.lastUpdated);
          if (s.high20 !== undefined) setHigh20(s.high20);
          if (s.low20 !== undefined) setLow20(s.low20);
          if (s.high50 !== undefined) setHigh50(s.high50);
          if (s.low50 !== undefined) setLow50(s.low50);
          if (s.low200 !== undefined) setLow200(s.low200);
          if (s.atr14 !== undefined) setAtr14(s.atr14);
          if (s.nupl !== undefined) setNupl(s.nupl);
          if (s.mvrv !== undefined) setMvrv(s.mvrv);
          if (s.fundingNegative !== undefined) setFundingNegative(s.fundingNegative);
          if (s.derivativesExhaustion !== undefined) setDerivativesExhaustion(s.derivativesExhaustion);
          if (s.below200ma !== undefined) setBelow200ma(s.below200ma);
          if (s.weeklyLowerLow !== undefined) setWeeklyLowerLow(s.weeklyLowerLow);
          if (s.dxyAbove110 !== undefined) setDxyAbove110(s.dxyAbove110);
          if (s.btcHoldings !== undefined) setBtcHoldings(s.btcHoldings);
          if (s.dilutedShares !== undefined) setDilutedShares(s.dilutedShares);
          if (s.corporateBaseUpdated !== undefined) setCorporateBaseUpdated(s.corporateBaseUpdated);
          if (s.startingShares !== undefined) setStartingShares(s.startingShares);
          if (s.cashBuffer !== undefined) setCashBuffer(s.cashBuffer);
          if (s.gbpUsd !== undefined) setGbpUsd(s.gbpUsd);
          if (s.levelsAuto !== undefined) setLevelsAuto(s.levelsAuto);
          if (s.manualSellLow !== undefined) setManualSellLow(s.manualSellLow);
          if (s.manualSellHigh !== undefined) setManualSellHigh(s.manualSellHigh);
          if (s.manualBuyLow !== undefined) setManualBuyLow(s.manualBuyLow);
          if (s.manualBuyHigh !== undefined) setManualBuyHigh(s.manualBuyHigh);
          if (s.aggressionStyle !== undefined) setAggressionStyle(s.aggressionStyle);
          // v14 fields
          if (s.parsedMnav !== undefined) setParsedMnav(s.parsedMnav);
          if (s.totalDebt !== undefined) setTotalDebt(s.totalDebt);
          if (s.preferredNotional !== undefined) setPreferredNotional(s.preferredNotional);
          if (s.cashPosition !== undefined) setCashPosition(s.cashPosition);
          if (s.sthRealizedPrice !== undefined) setSthRealizedPrice(s.sthRealizedPrice);
          if (s.btcBelowSthCost !== undefined) setBtcBelowSthCost(s.btcBelowSthCost);
          if (s.etfFlows5d !== undefined) setEtfFlows5d(s.etfFlows5d);
          if (s.etfOutflowsPersistent !== undefined) setEtfOutflowsPersistent(s.etfOutflowsPersistent);
          if (s.mnavCompressed !== undefined) setMnavCompressed(s.mnavCompressed);
          if (s.mnavEuphoric !== undefined) setMnavEuphoric(s.mnavEuphoric);
          // v14.1 freshness fields
          if (s.dataTimestamp !== undefined) setDataTimestamp(s.dataTimestamp);
          if (s.confidence !== undefined) setConfidence(s.confidence);
          if (s.staleFields !== undefined) setStaleFields(s.staleFields);
        }
      } catch (e) {}
      try { const t = ({ value: localStorage.getItem('mstr:trades') }); if (t?.value) setTrades(JSON.parse(t.value)); } catch (e) {}
      try { const sn = ({ value: localStorage.getItem('mstr:snapshots') }); if (sn?.value) setSnapshots(JSON.parse(sn.value)); } catch (e) {}
      try { const pos = ({ value: localStorage.getItem('mstr:positions') }); if (pos?.value) setPositions(JSON.parse(pos.value)); } catch (e) {}
    };
    load();
  }, []);

  useEffect(() => {
    const save = async () => {
      try {
        localStorage.setItem('mstr:settings', JSON.stringify({
          mstrPrice, btcPrice, ma200, lastUpdated,
          high20, low20, high50, low50, low200, atr14,
          nupl, mvrv, fundingNegative, derivativesExhaustion, below200ma,
          weeklyLowerLow, dxyAbove110, btcHoldings, dilutedShares,
          corporateBaseUpdated, startingShares, cashBuffer, gbpUsd,
          levelsAuto, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh,
          aggressionStyle,
          // v14 fields
          parsedMnav, totalDebt, preferredNotional, cashPosition,
          sthRealizedPrice, btcBelowSthCost, etfFlows5d, etfOutflowsPersistent,
          mnavCompressed, mnavEuphoric,
          // v14.1
          dataTimestamp, confidence, staleFields,
        }));
      } catch (e) {}
    };
    save();
  }, [mstrPrice, btcPrice, ma200, lastUpdated,
      high20, low20, high50, low50, low200, atr14,
      nupl, mvrv, fundingNegative, derivativesExhaustion, below200ma,
      weeklyLowerLow, dxyAbove110, btcHoldings, dilutedShares,
      corporateBaseUpdated, startingShares, cashBuffer, gbpUsd,
      levelsAuto, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh,
      aggressionStyle,
      parsedMnav, totalDebt, preferredNotional, cashPosition,
      sthRealizedPrice, btcBelowSthCost, etfFlows5d, etfOutflowsPersistent,
      mnavCompressed, mnavEuphoric,
      dataTimestamp, confidence, staleFields]);

  const handleHoldingsChange = (v) => { setBtcHoldings(v); setCorporateBaseUpdated(new Date().toISOString().slice(0, 10)); };
  const handleSharesChange = (v) => { setDilutedShares(v); setCorporateBaseUpdated(new Date().toISOString().slice(0, 10)); };

  // ============ DERIVED CALCS ============
  const btcPerShare = useMemo(() => btcHoldings / (dilutedShares * 1_000_000), [btcHoldings, dilutedShares]);
  const fairValue = useMemo(() => btcPerShare * btcPrice, [btcPerShare, btcPrice]);

  // Legacy mNAV (market cap only) — kept as a sanity-check display
  const legacyMnav = useMemo(() => fairValue > 0 ? mstrPrice / fairValue : 0, [mstrPrice, fairValue]);

  // Authoritative mNAV: prefer the parsed value from the LLM (which includes debt + preferred − cash).
  // If we don't have it yet, fall back to the legacy figure with a flag so the UI can label it.
  const mNAV = useMemo(() => parsedMnav !== null ? parsedMnav : legacyMnav, [parsedMnav, legacyMnav]);
  const mNAVisLegacy = parsedMnav === null;

  // Recompute mNAV from corporate inputs as a cross-check. Returns null if any input is missing.
  // This is what the LLM should produce; if our recompute differs by >0.1x from parsedMnav we flag it.
  const recomputedMnav = useMemo(() => {
    if (totalDebt === null || preferredNotional === null || cashPosition === null) return null;
    const marketCap = mstrPrice * dilutedShares;                              // millions USD
    const ev = marketCap + totalDebt + preferredNotional - cashPosition;      // millions USD
    const btcNav = (btcHoldings * btcPrice) / 1_000_000;                      // millions USD
    return btcNav > 0 ? ev / btcNav : null;
  }, [mstrPrice, dilutedShares, totalDebt, preferredNotional, cashPosition, btcHoldings, btcPrice]);

  const mNAVdiscrepancy = useMemo(() => {
    if (parsedMnav === null || recomputedMnav === null) return null;
    return Math.abs(parsedMnav - recomputedMnav);
  }, [parsedMnav, recomputedMnav]);

  const cycleData = useMemo(() => {
    const ath = new Date('2025-10-06');
    const target = new Date('2026-10-06');
    const now = new Date();
    const totalDays = Math.round((target - ath) / 86400000);
    const elapsed = Math.round((now - ath) / 86400000);
    const remaining = Math.round((target - now) / 86400000);
    const progress = Math.min(100, Math.max(0, (elapsed / totalDays) * 100));
    return { totalDays, elapsed, remaining, progress };
  }, [lastUpdated]);

  const daysSinceBaseUpdate = useMemo(() => {
    if (!corporateBaseUpdated) return null;
    return Math.floor((new Date() - new Date(corporateBaseUpdated)) / 86400000);
  }, [corporateBaseUpdated, lastUpdated]);

  // ============ v14.1 FRESHNESS DERIVATION ============
  // Two-tier staleness: amber >24h, red >72h. Driven by LLM-asserted DATA_TIMESTAMP
  // when available (preferred — captures stale-at-source data); falls back to paste
  // time (`lastUpdated`) only if the LLM didn't provide a timestamp.
  // We re-evaluate on every render via Date.now() rather than memoising tightly so
  // the banner updates as time passes without a state change.
  const freshness = useMemo(() => {
    // Prefer the LLM-asserted source timestamp; fall back to paste-time
    let ts = null;
    let source = null;
    if (dataTimestamp) {
      const parsed = new Date(dataTimestamp);
      if (!isNaN(parsed.getTime())) { ts = parsed; source = 'data-timestamp'; }
    }
    if (!ts && lastUpdated) {
      const parsed = new Date(lastUpdated);
      if (!isNaN(parsed.getTime())) { ts = parsed; source = 'paste-time'; }
    }
    if (!ts) return { tier: 'none', hours: null, source: null, label: 'No data loaded' };

    const hours = (Date.now() - ts.getTime()) / 3600000;
    let tier = 'fresh';
    if (hours > 72) tier = 'red';
    else if (hours > 24) tier = 'amber';
    return { tier, hours, source, ts };
  }, [dataTimestamp, lastUpdated]);

  // ============ AGGRESSION PROFILE ============
  const profile = useMemo(() => {
    switch (aggressionStyle) {
      case 'conservative':
        return {
          label: 'Conservative',
          rotationSizePctLow: 15,
          rotationSizePctHigh: 20,
          bandWidthMult: 0.55,
          hoardSensitivity: 1.15,
          deployLadderSteepness: 0.9,
          note: 'Wider bands, smaller rotations, quicker to HOARD.',
        };
      case 'aggressive':
        return {
          label: 'Aggressive',
          rotationSizePctLow: 35,
          rotationSizePctHigh: 45,
          bandWidthMult: 0.28,
          hoardSensitivity: 0.85,
          deployLadderSteepness: 1.15,
          note: 'Tighter bands, larger rotations, holds ROTATE longer.',
        };
      default:
        return {
          label: 'Moderate (Base)',
          rotationSizePctLow: 25,
          rotationSizePctHigh: 30,
          bandWidthMult: 0.4,
          hoardSensitivity: 1.0,
          deployLadderSteepness: 1.0,
          note: 'Balanced — base case per the playbook.',
        };
    }
  }, [aggressionStyle]);

  // ============ DYNAMIC LEVELS ============
  const technicals = useMemo(() => {
    if (high20 === null || low20 === null || atr14 === null) return null;
    return { high20, low20, high50, low50, low200, atr14 };
  }, [high20, low20, high50, low50, low200, atr14]);

  const dynamicLevels = useMemo(() => {
    if (!technicals) return null;
    const { high20, low20, atr14 } = technicals;
    const current = mstrPrice;

    const rotateSellTarget = Math.max(high20, current + atr14);
    const rotateBuyTarget = Math.min(low20, current - atr14);
    const bandWidth = atr14 * profile.bandWidthMult;

    const hoardBuyAnchor = ma200 ? ma200 * 0.85 : current - atr14 * 2;
    const hoardBuyDeep = ma200 ? ma200 * 0.75 : current - atr14 * 3;
    const hoardBuyTarget = current - (current - hoardBuyAnchor) / profile.hoardSensitivity;
    const hoardBuyDeepTarget = current - (current - hoardBuyDeep) / profile.hoardSensitivity;

    const deployRungs = ma200
      ? [
          { level: current, pct: 25 },
          { level: current - (current - ma200 * 0.85) * 0.5 * profile.deployLadderSteepness, pct: 25 },
          { level: current - (current - ma200 * 0.85) * profile.deployLadderSteepness, pct: 25 },
          { level: current - (current - ma200 * 0.65) * profile.deployLadderSteepness, pct: 25 },
        ]
      : [
          { level: current, pct: 25 },

          if (n !== null) {
            const shares = n > 10000 ? n / 1_000_000 : n;
            handleSharesChange(shares); applied.push(`Shares ${shares}M`);
          } else skipped.push(key);
          break;
        }
        case 'BELOW_200MA':
          setBelow200ma(boolVal); applied.push(`200MA ${boolVal ? 'ON' : 'OFF'}`);
          break;
        case 'WEEKLY_LL':
          setWeeklyLowerLow(boolVal); applied.push(`WeeklyLL ${boolVal ? 'ON' : 'OFF'}`);
          break;
        case 'SHORTING':
          setFundingNegative(boolVal);
          if (boolVal) setDerivativesExhaustion(false);
          applied.push(`Shorting ${boolVal ? 'ON' : 'OFF'}`);
          break;
        case 'EXHAUSTION':
          setDerivativesExhaustion(boolVal);
          if (boolVal) setFundingNegative(false);
          applied.push(`Exhaustion ${boolVal ? 'ON' : 'OFF'}`);
          break;
        case 'DXY_ABOVE_110':
          setDxyAbove110(boolVal); applied.push(`DXY>110 ${boolVal ? 'ON' : 'OFF'}`);
          break;
        // v14 numeric fields
        case 'STH_REALIZED_PRICE': {
          const n = safeNum(cleanedVal);
          if (n !== null) { setSthRealizedPrice(n); applied.push(`STH cost $${n.toLocaleString()}`); } else skipped.push(key);
          break;
        }
        case 'ETF_FLOWS_5D': {
          // Flows are signed and can be zero
          const n = safeNum(cleanedVal, { allowNegative: true, allowZero: true });
          if (n !== null) { setEtfFlows5d(n); applied.push(`ETF 5D ${n >= 0 ? '+' : ''}${n}M`); } else skipped.push(key);
          break;
        }
        case 'TOTAL_DEBT': {
          const n = safeNum(cleanedVal, { allowZero: true });
          if (n !== null) { setTotalDebt(n); applied.push(`Debt $${n}M`); } else skipped.push(key);
          break;
        }
        case 'PREFERRED_NOTIONAL': {
          const n = safeNum(cleanedVal, { allowZero: true });
          if (n !== null) { setPreferredNotional(n); applied.push(`Pref $${n}M`); } else skipped.push(key);
          break;
        }
        case 'CASH_POSITION': {
          const n = safeNum(cleanedVal, { allowZero: true });
          if (n !== null) { setCashPosition(n); applied.push(`Cash $${n}M`); } else skipped.push(key);
          break;
        }
        case 'MNAV': {
          const n = safeNum(cleanedVal);
          if (n !== null) { setParsedMnav(n); applied.push(`mNAV ${n}x`); } else skipped.push(key);
          break;
        }
        case 'DXY': {
          // Numeric DXY is informational; the binary DXY_ABOVE_110 drives scoring
          const n = safeNum(cleanedVal);
          if (n !== null) { applied.push(`DXY ${n}`); } else skipped.push(key);
          break;
        }
        // v14 binary flags
        case 'BTC_BELOW_STH_COST':
          setBtcBelowSthCost(boolVal); applied.push(`BTC<STH ${boolVal ? 'ON' : 'OFF'}`);
          break;
        case 'ETF_OUTFLOWS_PERSISTENT':
          setEtfOutflowsPersistent(boolVal); applied.push(`ETF out ${boolVal ? 'ON' : 'OFF'}`);
          break;
        case 'MNAV_COMPRESSED':
          setMnavCompressed(boolVal);
          if (boolVal) setMnavEuphoric(false);
          applied.push(`mNAV comp ${boolVal ? 'ON' : 'OFF'}`);
          break;
        case 'MNAV_EUPHORIC':
          setMnavEuphoric(boolVal);
          if (boolVal) setMnavCompressed(false);
          applied.push(`mNAV euph ${boolVal ? 'ON' : 'OFF'}`);
          break;
        // v14.1 freshness fields
        case 'DATA_TIMESTAMP': {
          // Validate ISO-8601 parseability before storing
          const d = new Date(val);
          if (!isNaN(d.getTime())) { setDataTimestamp(val); applied.push(`Data @ ${val}`); }
          else skipped.push(key);
          break;
        }
        case 'CONFIDENCE': {
          const upper = val.toUpperCase();
          if (upper === 'HIGH' || upper === 'MEDIUM' || upper === 'LOW') {
            setConfidence(upper); applied.push(`Conf ${upper}`);
          } else skipped.push(key);
          break;
        }
        case 'STALE_FIELDS': {
          // String value: comma-separated field names or "NONE"
          setStaleFields(val); applied.push(`Stale: ${val.length > 30 ? val.slice(0, 30) + '…' : val}`);
          break;
        }
        default:
          skipped.push(key);
      }
    }

    if (applied.length === 0) {
      setPasteResult({ ok: false, msg: 'No recognised fields. Check format — expect KEY: VALUE per line.' });
    } else {
      // v14.1: store the full ISO timestamp so freshness math works in hours.
      // Previously this was sliced to date only (YYYY-MM-DD), which made the
      // staleness banner unable to distinguish "5 minutes ago" from "23 hours ago".
      setLastUpdated(new Date().toISOString());
      setPasteResult({
        ok: true,
        msg: `Applied ${applied.length} field${applied.length > 1 ? 's' : ''}${skipped.length ? ` (${skipped.length} skipped)` : ''}: ${applied.slice(0, 6).join(' · ')}${applied.length > 6 ? '…' : ''}`,
      });
      setPasteText('');
      setTimeout(() => setPasteResult(null), 6000);
    }
  };

  const saveSnapshot = async () => {
    const snap = {
      date: new Date().toISOString(),
      mstrPrice, btcPrice, nupl, mvrv,
      mNAV: Number(mNAV.toFixed(2)),
      bearScore, bottomScore, mode,
      // v14 additions in snapshots
      sthRealizedPrice, btcBelowSthCost, etfFlows5d, etfOutflowsPersistent,
    };
    const updated = [...snapshots, snap];
    setSnapshots(updated);
    try { localStorage.setItem('mstr:snapshots', JSON.stringify(updated)); } catch (e) {}
  };

  const addTrade = async () => {
    if (!tradeShares || !tradePrice) return;
    const trade = { id: Date.now(), date: tradeDate, type: tradeType, shares: parseFloat(tradeShares), price: parseFloat(tradePrice), fees: parseFloat(tradeFees) || 0 };
    const updated = [...trades, trade];
    setTrades(updated);
    try { localStorage.setItem('mstr:trades', JSON.stringify(updated)); } catch (e) {}
    setTradeShares(''); setTradePrice(''); setTradeFees('');
  };

  const deleteTrade = async (id) => {
    const updated = trades.filter(t => t.id !== id);
    setTrades(updated);
    try { localStorage.setItem('mstr:trades', JSON.stringify(updated)); } catch (e) {}
  };

  const openPosition = async (overrides = {}) => {
    const f = { ...positionForm, ...overrides };
    if (!f.shares || !f.entryPrice) return;
    const pos = {
      id: Date.now(),
      openedAt: new Date().toISOString(),
      shares: parseFloat(f.shares),
      entryPrice: parseFloat(f.entryPrice),
      stop: f.stop ? parseFloat(f.stop) : null,
      target: f.target ? parseFloat(f.target) : null,
      tag: f.tag || 'MANUAL',
      notes: f.notes || '',
      status: 'OPEN',
    };
    const updated = [...positions, pos];
    setPositions(updated);
    try { localStorage.setItem('mstr:positions', JSON.stringify(updated)); } catch (e) {}
    setPositionForm({ shares: '', entryPrice: '', stop: '', target: '', tag: 'MANUAL', notes: '' });
  };

  const closePosition = async (id, exitPrice, exitFees = 0) => {
    const pos = positions.find(p => p.id === id);
    if (!pos) return;
    const exit = parseFloat(exitPrice);
    if (!exit || isNaN(exit)) return;
    const updated = positions.map(p => p.id === id ? { ...p, status: 'CLOSED', closedAt: new Date().toISOString(), exitPrice: exit, exitFees: parseFloat(exitFees) || 0 } : p);
    setPositions(updated);
    try { localStorage.setItem('mstr:positions', JSON.stringify(updated)); } catch (e) {}
    const closingTrade = { id: Date.now(), date: new Date().toISOString().slice(0, 10), type: 'SELL', shares: pos.shares, price: exit, fees: parseFloat(exitFees) || 0, fromPositionId: id };
    const tradesUpdated = [...trades, closingTrade];
    setTrades(tradesUpdated);
    try { localStorage.setItem('mstr:trades', JSON.stringify(tradesUpdated)); } catch (e) {}
  };

  const deletePosition = async (id) => {
    const updated = positions.filter(p => p.id !== id);
    setPositions(updated);
    try { localStorage.setItem('mstr:positions', JSON.stringify(updated)); } catch (e) {}
  };

  // ============ JSON BACKUP / RESTORE ============
  const [importText, setImportText] = useState('');
  const [importResult, setImportResult] = useState(null);

  const buildExportPayload = () => ({
    version: 14.1,
    exportedAt: new Date().toISOString(),
    settings: {
      mstrPrice, btcPrice, ma200, lastUpdated,
      high20, low20, high50, low50, low200, atr14,
      nupl, mvrv, fundingNegative, derivativesExhaustion, below200ma,
      weeklyLowerLow, dxyAbove110, btcHoldings, dilutedShares,
      corporateBaseUpdated, startingShares, cashBuffer, gbpUsd,
      levelsAuto, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh,
      aggressionStyle,
      parsedMnav, totalDebt, preferredNotional, cashPosition,
      sthRealizedPrice, btcBelowSthCost, etfFlows5d, etfOutflowsPersistent,
      mnavCompressed, mnavEuphoric,
      // v14.1
      dataTimestamp, confidence, staleFields,
    },
    trades,
    snapshots,
    positions,
  });

  const exportJSON = async () => {
    const text = JSON.stringify(buildExportPayload(), null, 2);
    try {
      await navigator.clipboard.writeText(text);
      setImportResult({ ok: true, msg: `Exported ${trades.length} trades, ${positions.length} positions, ${snapshots.length} snapshots to clipboard.` });
    } catch (e) {
      setImportResult({ ok: true, msg: 'Export ready below — copy manually (clipboard blocked).', payload: text });
    }
    setTimeout(() => setImportResult(null), 8000);
  };

  const exportJSONFile = () => {
    const text = JSON.stringify(buildExportPayload(), null, 2);
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `mstr-cycle-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setImportResult({ ok: true, msg: `Downloaded mstr-cycle-${stamp}.json` });
    setTimeout(() => setImportResult(null), 6000);
  };

  const importJSONFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => { setImportText(String(e.target.result || '')); };
    reader.readAsText(file);
  };

  const importJSON = async () => {
    if (!importText.trim()) return;
    try {
      const p = JSON.parse(importText);
      if (p.settings) {
        const s = p.settings;
        if (s.mstrPrice !== undefined) setMstrPrice(s.mstrPrice);
        if (s.btcPrice !== undefined) setBtcPrice(s.btcPrice);
        if (s.ma200 !== undefined) setMa200(s.ma200);
        if (s.lastUpdated !== undefined) setLastUpdated(s.lastUpdated);
        if (s.high20 !== undefined) setHigh20(s.high20);
        if (s.low20 !== undefined) setLow20(s.low20);
        if (s.high50 !== undefined) setHigh50(s.high50);
        if (s.low50 !== undefined) setLow50(s.low50);
        if (s.low200 !== undefined) setLow200(s.low200);
        if (s.atr14 !== undefined) setAtr14(s.atr14);
        if (s.nupl !== undefined) setNupl(s.nupl);
        if (s.mvrv !== undefined) setMvrv(s.mvrv);
        if (s.fundingNegative !== undefined) setFundingNegative(s.fundingNegative);
        if (s.derivativesExhaustion !== undefined) setDerivativesExhaustion(s.derivativesExhaustion);
        if (s.below200ma !== undefined) setBelow200ma(s.below200ma);
        if (s.weeklyLowerLow !== undefined) setWeeklyLowerLow(s.weeklyLowerLow);
        if (s.dxyAbove110 !== undefined) setDxyAbove110(s.dxyAbove110);
        if (s.btcHoldings !== undefined) setBtcHoldings(s.btcHoldings);
        if (s.dilutedShares !== undefined) setDilutedShares(s.dilutedShares);
        if (s.corporateBaseUpdated !== undefined) setCorporateBaseUpdated(s.corporateBaseUpdated);
        if (s.startingShares !== undefined) setStartingShares(s.startingShares);
        if (s.cashBuffer !== undefined) setCashBuffer(s.cashBuffer);
        if (s.gbpUsd !== undefined) setGbpUsd(s.gbpUsd);
        if (s.levelsAuto !== undefined) setLevelsAuto(s.levelsAuto);
        if (s.manualSellLow !== undefined) setManualSellLow(s.manualSellLow);
        if (s.manualSellHigh !== undefined) setManualSellHigh(s.manualSellHigh);
        if (s.manualBuyLow !== undefined) setManualBuyLow(s.manualBuyLow);
        if (s.manualBuyHigh !== undefined) setManualBuyHigh(s.manualBuyHigh);
        if (s.aggressionStyle !== undefined) setAggressionStyle(s.aggressionStyle);
        // v14
        if (s.parsedMnav !== undefined) setParsedMnav(s.parsedMnav);
        if (s.totalDebt !== undefined) setTotalDebt(s.totalDebt);
        if (s.preferredNotional !== undefined) setPreferredNotional(s.preferredNotional);
        if (s.cashPosition !== undefined) setCashPosition(s.cashPosition);
        if (s.sthRealizedPrice !== undefined) setSthRealizedPrice(s.sthRealizedPrice);
        if (s.btcBelowSthCost !== undefined) setBtcBelowSthCost(s.btcBelowSthCost);
        if (s.etfFlows5d !== undefined) setEtfFlows5d(s.etfFlows5d);
        if (s.etfOutflowsPersistent !== undefined) setEtfOutflowsPersistent(s.etfOutflowsPersistent);
        if (s.mnavCompressed !== undefined) setMnavCompressed(s.mnavCompressed);
        if (s.mnavEuphoric !== undefined) setMnavEuphoric(s.mnavEuphoric);
        // v14.1
        if (s.dataTimestamp !== undefined) setDataTimestamp(s.dataTimestamp);
        if (s.confidence !== undefined) setConfidence(s.confidence);
        if (s.staleFields !== undefined) setStaleFields(s.staleFields);
      }
      if (Array.isArray(p.trades)) {
        setTrades(p.trades);
        try { localStorage.setItem('mstr:trades', JSON.stringify(p.trades)); } catch (e) {}
      }
      if (Array.isArray(p.snapshots)) {
        setSnapshots(p.snapshots);
        try { localStorage.setItem('mstr:snapshots', JSON.stringify(p.snapshots)); } catch (e) {}
      }
      if (Array.isArray(p.positions)) {
        setPositions(p.positions);
        try { localStorage.setItem('mstr:positions', JSON.stringify(p.positions)); } catch (e) {}
      }
      setImportText('');
      setImportResult({ ok: true, msg: `Imported: ${p.trades?.length ?? 0} trades, ${p.positions?.length ?? 0} positions, ${p.snapshots?.length ?? 0} snapshots.` });
    } catch (e) {
      setImportResult({ ok: false, msg: `Import failed: ${e.message}` });
    }
    setTimeout(() => setImportResult(null), 8000);
  };

  const deleteSnapshot = async (date) => {
    const updated = snapshots.filter(s => s.date !== date);
    setSnapshots(updated);
    try { localStorage.setItem('mstr:snapshots', JSON.stringify(updated)); } catch (e) {}
  };

  // ============ STYLES ============
  const colors = {
    bg: '#0a0806', panel: '#14100c', border: '#2a2520',
    text: '#d4c8b8', textDim: '#a89580', textMute: '#8a7a65', textFaint: '#5a5048',
    gold: '#d4a017', red: '#c73e1d', green: '#2d8659', highlight: '#e8dcc8',
  };
  const serif = 'Georgia, "Times New Roman", serif';

  const t = {
    eyebrow: { fontSize: '9px', letterSpacing: '0.15em', textTransform: 'uppercase', color: colors.textMute },
    meta:    { fontSize: '11px', color: colors.textDim },
    body:    { fontSize: '13px', color: colors.text, lineHeight: 1.55 },
    value:   { fontSize: '15px', color: colors.text, fontWeight: 600 },
    hero:    { fontSize: '28px', color: colors.highlight, fontWeight: 600, letterSpacing: '-0.01em' },
  };

  const staleColor = !daysSinceBaseUpdate && daysSinceBaseUpdate !== 0 ? colors.textFaint
    : daysSinceBaseUpdate > 60 ? colors.red
    : daysSinceBaseUpdate > 30 ? colors.gold
    : colors.textMute;

  // ============ v14 mNAV TONE LADDER ============
  // Replaces previous binary >1.5 = red logic with a graded ladder:
  //   <1.05  green   (sub-NAV / capitulation buying opportunity)
  //   1.05–1.20 amber-light (premium-engine stall — flagged in scoring)
  //   1.20–1.80 gold (standard healthy premium)
  //   1.80–2.50 amber (elevated)
  //   >2.50  red    (euphoria — late cycle)
  const mNavTone = (m) => {
    if (!m || m <= 0) return colors.textFaint;
    if (m < 1.05) return colors.green;
    if (m < 1.20) return colors.gold;
    if (m < 1.80) return colors.gold;
    if (m < 2.50) return colors.red;
    return colors.red;
  };
  const mNavLabel = (m) => {
    if (!m || m <= 0) return '—';
    if (m < 1.05) return 'sub-NAV — capitulation zone';
    if (m < 1.20) return 'compressed — premium-engine stall';
    if (m < 1.80) return 'healthy premium';
    if (m < 2.50) return 'elevated premium';
    return 'euphoria zone';
  };

  const SignalToggle = ({ value, onChange, label, helperUrl, bottomTone }) => (
    <div style={{ marginBottom: '8px' }}>
      <div onClick={() => onChange(!value)} style={{
        display: 'flex', alignItems: 'center', padding: '10px 14px',
        background: value ? (bottomTone ? '#0f1a13' : '#2a1f1a') : '#0f0d0a',
        border: `1px solid ${value ? (bottomTone ? colors.green : colors.red) : colors.border}`,
        borderRadius: '4px', cursor: 'pointer', transition: 'all 0.2s',
      }}>
        <div style={{ width: '14px', height: '14px', borderRadius: '2px',
          border: `2px solid ${value ? (bottomTone ? colors.green : colors.red) : colors.textFaint}`,
          background: value ? (bottomTone ? colors.green : colors.red) : 'transparent',
          marginRight: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '10px', color: '#000', flexShrink: 0 }}>{value && '✓'}</div>
        <span style={{ color: colors.text, fontSize: '13px', fontFamily: serif, flex: 1 }}>{label}</span>
      </div>
      <div style={{ display: 'flex', justifyContent: 'flex-start', marginTop: '4px', paddingLeft: '14px', fontSize: '10px' }}>
        {helperUrl && <a href={helperUrl} target="_blank" rel="noopener noreferrer" style={{ color: colors.gold, textDecoration: 'none', letterSpacing: '0.05em' }}>check →</a>}
      </div>
    </div>
  );

  const NumberInput = ({ value, onChange, step, label, suffix = '', precision = 0, min, max }) => {
    const [editValue, setEditValue] = useState(String(value));
    const [isFocused, setIsFocused] = useState(false);

    useEffect(() => {
      if (!isFocused) setEditValue(String(value));
    }, [value, isFocused]);

    const commit = (raw) => {
      let cleaned = raw.replace(/^0+(\d)/, '$1');
      if (cleaned === '' || cleaned === '-' || cleaned === '.') {
        onChange(0); setEditValue('0'); return;
      }
      const n = Number(cleaned);
      if (isNaN(n)) { setEditValue(String(value)); return; }
      let bounded = n;
      if (min !== undefined) bounded = Math.max(min, bounded);
      if (max !== undefined) bounded = Math.min(max, bounded);
      const final = Number(bounded.toFixed(precision));
      onChange(final);
      setEditValue(String(final));
    };

    const adjust = (delta) => {
      let next = Number(value) + delta;
      if (min !== undefined) next = Math.max(min, next);
      if (max !== undefined) next = Math.min(max, next);
      const final = Number(next.toFixed(precision));
      onChange(final);
      setEditValue(String(final));
    };

    return (
      <div style={{ marginBottom: '14px', minWidth: 0 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px', alignItems: 'center' }}>
          <span style={{ color: colors.textDim, fontSize: '11px', letterSpacing: '0.08em', textTransform: 'uppercase', fontFamily: serif }}>{label}</span>
          {suffix && <span style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.05em' }}>{suffix.trim()}</span>}
        </div>
        <div style={{ display: 'flex', gap: '6px', alignItems: 'stretch', minWidth: 0 }}>
          <button onClick={() => adjust(-step)} style={{
            width: '40px', flexShrink: 0,
            background: colors.bg, border: `1px solid ${colors.border}`,
            color: colors.gold, fontFamily: serif, fontSize: '16px', cursor: 'pointer',
          }}>−</button>
          <input
            type="text"
            inputMode="decimal"
            value={editValue}
            onFocus={() => setIsFocused(true)}
            onBlur={() => { setIsFocused(false); commit(editValue); }}
            onChange={(e) => {
              const raw = e.target.value;
              if (/^-?\d*\.?\d*$/.test(raw)) {
                setEditValue(raw);
                if (raw !== '' && raw !== '-' && raw !== '.' && raw !== '-.') {
                  const n = Number(raw);
                  if (!isNaN(n)) onChange(n);
                }
              }
            }}
            onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
            style={{
              flex: 1, minWidth: 0,
              background: colors.bg, border: `1px solid ${colors.border}`,
              color: colors.gold, padding: '8px 12px', fontFamily: serif,
              fontSize: '15px', fontWeight: 600, textAlign: 'center',
              boxSizing: 'border-box',
            }}
          />
          <button onClick={() => adjust(step)} style={{
            width: '40px', flexShrink: 0,
            background: colors.bg, border: `1px solid ${colors.border}`,
            color: colors.gold, fontFamily: serif, fontSize: '16px', cursor: 'pointer',
          }}>+</button>
        </div>
      </div>
    );
  };

  const SectionHeader = ({ children }) => (
    <div style={{ fontSize: '11px', letterSpacing: '0.2em', color: colors.textDim, textTransform: 'uppercase', marginBottom: '16px', borderBottom: `1px solid ${colors.border}`, paddingBottom: '8px', fontFamily: serif }}>{children}</div>
  );

  const NavButton = ({ id, label, secondary }) => (
    <button onClick={() => setView(id)} style={{
      background: view === id ? colors.panel : 'transparent',
      color: view === id ? colors.gold : (secondary ? colors.textMute : colors.textDim),
      border: `1px solid ${view === id ? colors.gold : colors.border}`,
      padding: secondary ? '5px 10px' : '8px 14px',
      fontFamily: serif,
      fontSize: secondary ? '10px' : '11px',
      letterSpacing: '0.1em', textTransform: 'uppercase', cursor: 'pointer', flex: 1,
      fontWeight: view === id ? 600 : 400,
      transition: 'all 0.15s', borderRadius: '2px',
    }}>{label}</button>
  );

  return (
    <div style={{ minHeight: '100vh', background: `linear-gradient(180deg, ${colors.bg} 0%, ${colors.panel} 100%)`, padding: '24px 16px', fontFamily: serif, color: colors.text }}>
      <div style={{ maxWidth: '720px', margin: '0 auto' }}>
        {/* HEADER */}
        <div style={{ marginBottom: '24px', borderBottom: `1px solid ${colors.border}`, paddingBottom: '20px' }}>
          <div style={{ fontSize: '10px', letterSpacing: '0.3em', color: colors.textMute, textTransform: 'uppercase', marginBottom: '8px' }}>
            Cycle Decision Framework · v14.1
          </div>
          <h1 style={{ fontSize: '26px', fontWeight: 400, color: colors.highlight, margin: 0, fontStyle: 'italic' }}>MSTR Rotation</h1>
          <h2 style={{ fontSize: '14px', fontWeight: 400, color: colors.textDim, margin: '4px 0 12px 0', letterSpacing: '0.05em' }}>Rotate · Hoard · Deploy</h2>
          <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap', fontSize: '12px', marginTop: '12px', alignItems: 'center' }}>
            <div><span style={{ color: colors.textMute }}>BTC </span><span style={{ color: colors.gold }}>${btcPrice.toLocaleString()}</span></div>
            <div><span style={{ color: colors.textMute }}>MSTR </span><span style={{ color: colors.gold }}>${mstrPrice.toFixed(2)}</span></div>
            <div><span style={{ color: colors.textMute }}>200MA </span><span style={{ color: colors.gold }}>{ma200 ? `$${ma200.toFixed(2)}` : '—'}</span></div>
            <div style={{ color: colors.textMute }}>mNAV <span style={{ color: mNavTone(mNAV) }}>{mNAV ? `${mNAV.toFixed(2)}x` : '—'}</span></div>
          </div>
          {/* v14.1: show data freshness inline in the header */}
          <div style={{ fontSize: '9px', color: colors.textFaint, marginTop: '6px', letterSpacing: '0.05em', display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
            <span>Prompt-driven updates. Paste prompt response below to refresh.</span>
            {freshness.hours !== null && (
              <span style={{
                color: freshness.tier === 'red' ? colors.red :
                       freshness.tier === 'amber' ? colors.gold :
                       colors.green,
                fontWeight: 600,
              }}>
                · data {freshness.hours < 1 ? `${(freshness.hours * 60).toFixed(0)}m` : `${freshness.hours.toFixed(0)}h`} old
              </span>
            )}
            {confidence && (
              <span style={{ color: confidence === 'LOW' ? colors.red : confidence === 'MEDIUM' ? colors.gold : colors.green }}>
                · conf {confidence}
              </span>
            )}
          </div>
        </div>

        <div style={{ marginBottom: '20px' }}>
          <div style={{ display: 'flex', gap: '6px', marginBottom: '6px' }}>
            <NavButton id="dashboard" label="Dashboard" />
            <NavButton id="positions" label={`Open · ${positions.filter(p => p.status === 'OPEN').length}`} />
            <NavButton id="journal" label={`Journal · ${trades.length}`} />
          </div>
          <div style={{ display: 'flex', gap: '6px' }}>
            <NavButton id="snapshots" label={`Log · ${snapshots.length}`} secondary />
            <NavButton id="backup" label="Backup" secondary />
          </div>
        </div>

        {view === 'dashboard' && (
          <>
            {/* ============================================================
                v14.1 STALENESS BANNER — top of dashboard, before mode card.
                Two-tier:
                  amber (>24h):  "Volatile readings may be stale, consider refresh"
                  red (>72h):    "Data is stale, full refresh required"
                Also surfaces LLM confidence and per-field staleness list when
                provided. Only renders when there's something to flag, so the
                dashboard stays clean on fresh data.
                ============================================================ */}
            {(freshness.tier === 'amber' || freshness.tier === 'red' || confidence === 'LOW' || (staleFields && staleFields !== 'NONE')) && (
              <div style={{
                background: freshness.tier === 'red' || confidence === 'LOW' ? '#1a0f0d' : '#1a1611',
                border: `2px solid ${freshness.tier === 'red' || confidence === 'LOW' ? colors.red : colors.gold}`,
                padding: '14px 16px', marginBottom: '20px', borderRadius: '3px',
              }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px' }}>
                  <span style={{ fontSize: '18px', lineHeight: 1 }}>{freshness.tier === 'red' || confidence === 'LOW' ? '🚨' : '⚠'}</span>
                  <span style={{ color: freshness.tier === 'red' || confidence === 'LOW' ? colors.red : colors.gold, fontSize: '12px', fontWeight: 700, letterSpacing: '0.15em', textTransform: 'uppercase' }}>
                    {freshness.tier === 'red' ? 'Running on cached indicators — regime update required' :
                     confidence === 'LOW' ? 'Low-confidence data — verify before trading' :
                     'Data is aging — consider refreshing'}
                  </span>
                </div>
                <div style={{ fontSize: '11px', color: colors.textDim, lineHeight: 1.5, paddingLeft: '28px' }}>
                  {freshness.hours !== null && (
                    <div>Source data is {freshness.hours < 1 ? `${(freshness.hours * 60).toFixed(0)} minutes` : `${freshness.hours.toFixed(1)} hours`} old ({freshness.source === 'data-timestamp' ? 'LLM-asserted' : 'paste-time fallback'}).</div>
                  )}
                  {confidence && <div style={{ marginTop: '2px' }}>LLM confidence: <span style={{ color: confidence === 'LOW' ? colors.red : confidence === 'MEDIUM' ? colors.gold : colors.green, fontWeight: 600 }}>{confidence}</span></div>}
                  {staleFields && staleFields !== 'NONE' && (
                    <div style={{ marginTop: '2px' }}>Stale fields flagged: <span style={{ color: colors.red, fontStyle: 'italic' }}>{staleFields}</span></div>
                  )}
                </div>
              </div>
            )}

            {/* MODE CARD */}
            <div style={{
              background: cfg.bg, border: `1px solid ${cfg.color}`,
              padding: '20px', marginBottom: '20px', position: 'relative',
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '18px', gap: '16px', flexWrap: 'wrap' }}>
                <div style={{ flex: '1 1 auto', minWidth: 0 }}>
                  <div style={{ ...t.eyebrow, color: cfg.color, marginBottom: '6px' }}>Active mode</div>
                  <div style={{ fontSize: '20px', color: cfg.color, fontWeight: 600, letterSpacing: '0.02em', lineHeight: 1.1 }}>{cfg.label}</div>
                </div>
                <div style={{ flex: '0 0 auto', textAlign: 'right' }}>
                  <div style={{ ...t.eyebrow, marginBottom: '6px' }}>MSTR</div>
                  <div style={{ ...t.hero, color: priceRange?.tone || colors.highlight, lineHeight: 1 }}>${mstrPrice.toFixed(2)}</div>
                  {priceRange?.verdict && (
                    <div style={{ ...t.eyebrow, color: priceRange.tone, marginTop: '6px', letterSpacing: '0.18em', fontWeight: 600 }}>{priceRange.verdict}</div>
                  )}
                </div>
              </div>

              {priceRange?.pct !== null && priceRange?.pct !== undefined && mode === 'ROTATE' && (
                <div style={{ marginBottom: '18px' }}>
                  <div style={{ position: 'relative', height: '6px', background: '#0a0806', borderRadius: '3px', overflow: 'hidden', border: `1px solid ${colors.border}` }}>
                    <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0,
                      width: `${((priceRange.buyHigh - priceRange.lo) / (priceRange.hi - priceRange.lo)) * 100}%`,
                      background: 'rgba(45, 134, 89, 0.25)' }} />
                    <div style={{ position: 'absolute', right: 0, top: 0, bottom: 0,
                      width: `${((priceRange.hi - priceRange.sellLow) / (priceRange.hi - priceRange.lo)) * 100}%`,
                      background: 'rgba(199, 62, 29, 0.25)' }} />
                    <div style={{ position: 'absolute', left: `${priceRange.pct * 100}%`, top: '-3px', bottom: '-3px', width: '2px',
                      background: priceRange.tone, boxShadow: `0 0 6px ${priceRange.tone}` }} />
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', ...t.eyebrow, marginTop: '4px' }}>
                    <span>${priceRange.lo.toFixed(0)}</span>
                    <span style={{ color: colors.textFaint }}>Buy band &nbsp;·&nbsp; Sell band</span>
                    <span>${priceRange.hi.toFixed(0)}</span>
                  </div>
                </div>
              )}

              <div style={{ ...t.body, marginBottom: '18px' }}>{cfg.action}</div>

              {deploySuppressed && (
                <div style={{ ...t.meta, color: colors.gold, marginBottom: '14px', padding: '10px 12px', background: '#1a1611', border: `1px dashed ${colors.gold}`, borderRadius: '3px' }}>
                  ⚠ Bottom score is at deploy threshold, but MSTR is still above $140. Holding HOARD until price confirms.
                </div>
              )}
              {levelsAuto && !technicals && (
                <div style={{ ...t.meta, color: colors.red, marginBottom: '14px', padding: '10px 12px', background: '#1a0f0d', border: `1px dashed ${colors.red}`, borderRadius: '3px' }}>
                  ⚠ Auto-levels unavailable — paste a prompt response below, or switch to manual override.
                </div>
              )}

              {bandHits.length > 0 && (() => {
                const sellHits = bandHits.filter(h => h.side === 'SELL');
                const buyHits = bandHits.filter(h => h.side === 'BUY');
                return (
                  <div style={{ display: 'grid', gridTemplateColumns: sellHits.length && buyHits.length ? '1fr 1fr' : '1fr', gap: '10px', marginBottom: '18px' }}>
                    {sellHits.length > 0 && (
                      <div style={{ background: 'rgba(199, 62, 29, 0.08)', border: `1px solid ${colors.red}`, padding: '12px', borderRadius: '3px' }}>
                        <div style={{ ...t.eyebrow, color: colors.red, marginBottom: '8px', fontWeight: 600 }}>● Sell trigger live</div>
                        {sellHits.map(h => (
                          <div key={h.tag} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '4px' }}>
                            <div style={{ ...t.meta, color: colors.text }}>
                              <div style={{ fontSize: '12px', fontWeight: 600 }}>{h.label}</div>
                              <div style={{ ...t.meta }}>@ {h.zone}</div>
                            </div>
                            <button onClick={() => { setView('positions'); setPositionForm(pf => ({ ...pf, entryPrice: String(h.price), tag: h.tag })); }}
                              style={{ background: colors.red, border: 'none', color: '#fff', padding: '6px 12px', fontFamily: serif, fontSize: '10px', letterSpacing: '0.12em', fontWeight: 600, cursor: 'pointer', borderRadius: '2px' }}>
                              SELL
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                    {buyHits.length > 0 && (
                      <div style={{ background: 'rgba(45, 134, 89, 0.08)', border: `1px solid ${colors.green}`, padding: '12px', borderRadius: '3px' }}>
                        <div style={{ ...t.eyebrow, color: colors.green, marginBottom: '8px', fontWeight: 600 }}>● Buy trigger live</div>
                        {buyHits.map(h => (
                          <div key={h.tag} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '4px' }}>
                            <div style={{ ...t.meta, color: colors.text }}>
                              <div style={{ fontSize: '12px', fontWeight: 600 }}>{h.label}</div>
                              <div style={{ ...t.meta }}>@ {h.zone}</div>
                            </div>
                            <button onClick={() => { setView('positions'); setPositionForm(pf => ({ ...pf, entryPrice: String(h.price), tag: h.tag })); }}
                              style={{ background: colors.green, border: 'none', color: '#fff', padding: '6px 12px', fontFamily: serif, fontSize: '10px', letterSpacing: '0.12em', fontWeight: 600, cursor: 'pointer', borderRadius: '2px' }}>
                              BUY
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })()}

              <div style={{ paddingTop: '16px', borderTop: `1px solid ${colors.border}`, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '14px' }}>
                <div>
                  <div style={{ ...t.eyebrow, marginBottom: '6px' }}>Sell zone</div>
                  <div style={{ color: colors.highlight, fontWeight: 600, fontSize: '13px' }}>{currentLevels.sell}</div>
                  {(mode === 'ROTATE' || mode === 'HOARD') && alertLevels[mode.toLowerCase()].sellAlert != null && (
                    <div style={{ ...t.eyebrow, marginTop: '6px', color: colors.gold, letterSpacing: '0.12em', fontWeight: 500 }}>
                      Alert ${alertLevels[mode.toLowerCase()].sellAlert.toFixed(2)}
                    </div>
                  )}
                </div>
                <div>
                  <div style={{ ...t.eyebrow, marginBottom: '6px' }}>Buy zone</div>
                  <div style={{ color: colors.highlight, fontWeight: 600, fontSize: mode === 'DEPLOY' ? '10px' : '13px', lineHeight: 1.3 }}>{currentLevels.buy}</div>
                  {mode === 'ROTATE' && alertLevels.rotate.buyAlert != null && (
                    <div style={{ ...t.eyebrow, marginTop: '6px', color: colors.gold, letterSpacing: '0.12em', fontWeight: 500 }}>
                      Alert ${alertLevels.rotate.buyAlert.toFixed(2)}
                    </div>
                  )}
                  {mode === 'HOARD' && (
                    <div style={{ ...t.eyebrow, marginTop: '6px', color: colors.gold, letterSpacing: '0.12em', fontWeight: 500, lineHeight: 1.5 }}>
                      Alert ${alertLevels.hoard.buyAlert.toFixed(2)}
                      {alertLevels.hoard.buyDeepAlert != null && (
                        <><br/>+ ${alertLevels.hoard.buyDeepAlert.toFixed(2)} deep</>
                      )}
                    </div>
                  )}
                  {mode === 'DEPLOY' && alertLevels.deploy.ladder.length > 0 && (
                    <div style={{ ...t.eyebrow, marginTop: '6px', color: colors.gold, letterSpacing: '0.12em', fontWeight: 500, lineHeight: 1.5 }}>
                      Set {alertLevels.deploy.ladder.length} alerts:<br/>
                      {alertLevels.deploy.ladder.map(l => `$${l.toFixed(2)}`).join(' · ')}
                    </div>
                  )}
                </div>
                <div>
                  <div style={{ ...t.eyebrow, marginBottom: '6px' }}>Cash hold</div>
                  <div style={{ color: colors.highlight, fontWeight: 600, fontSize: '13px' }}>{cfg.cash}</div>
                </div>
              </div>

              <div style={{ marginTop: '16px', paddingTop: '14px', borderTop: `1px solid ${colors.border}` }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'wrap', marginBottom: '8px' }}>
                  <span style={{ ...t.eyebrow }}>Style</span>
                  {['conservative', 'moderate', 'aggressive'].map(s => {
                    const active = aggressionStyle === s;
                    return (
                      <button key={s} onClick={() => setAggressionStyle(s)} style={{
                        background: active ? cfg.color : 'transparent',
                        color: active ? '#000' : colors.textDim,
                        border: `1px solid ${active ? cfg.color : colors.border}`,
                        padding: '3px 9px', fontFamily: serif, fontSize: '10px',
                        letterSpacing: '0.1em', textTransform: 'uppercase',
                        cursor: 'pointer', fontWeight: active ? 600 : 400,
                        borderRadius: '2px', transition: 'all 0.15s',
                      }}>{s === 'moderate' ? 'Mod' : s.charAt(0).toUpperCase() + s.slice(1, 4)}</button>
                    );
                  })}
                  <span style={{ ...t.meta, color: colors.textMute, marginLeft: '4px', fontSize: '10px' }}>
                    {profile.rotationSizePctLow}–{profile.rotationSizePctHigh}% rotation
                  </span>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', ...t.meta, color: colors.textMute, fontSize: '10px', gap: '8px' }}>
                  <span style={{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {levelsAuto && technicals
                      ? `ATR(14) $${technicals.atr14.toFixed(1)} · ${technicals.low20.toFixed(0)}–${technicals.high20.toFixed(0)}${!ma200 ? ' · 200MA missing' : ''}`
                      : 'Manual levels'}
                  </span>
                  <span onClick={() => setLevelsAuto(!levelsAuto)} style={{ cursor: 'pointer', color: levelsAuto ? colors.green : colors.textMute, letterSpacing: '0.05em', flexShrink: 0 }}>
                    {levelsAuto ? '● auto' : '○ manual'}
                  </span>
                </div>
              </div>
            </div>

            {!levelsAuto && (
              <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '24px' }}>
                <SectionHeader>◆ Manual level overrides</SectionHeader>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', fontSize: '11px' }}>
                  <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Sell zone low</div><input type="number" value={manualSellLow} onChange={(e) => setManualSellLow(Number(e.target.value))} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '6px 10px', fontFamily: serif, fontSize: '12px' }} /></div>
                  <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Sell zone high</div><input type="number" value={manualSellHigh} onChange={(e) => setManualSellHigh(Number(e.target.value))} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '6px 10px', fontFamily: serif, fontSize: '12px' }} /></div>
                  <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Buy zone low</div><input type="number" value={manualBuyLow} onChange={(e) => setManualBuyLow(Number(e.target.value))} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '6px 10px', fontFamily: serif, fontSize: '12px' }} /></div>
                  <div><div style={{ color: colors.textMute, marginBottom: '4px' }}>Buy zone high</div><input type="number" value={manualBuyHigh} onChange={(e) => setManualBuyHigh(Number(e.target.value))} style={{ width: '100%', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, padding: '6px 10px', fontFamily: serif, fontSize: '12px' }} /></div>
                </div>
              </div>
            )}

            {levelsAuto && technicals && (
              <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '24px' }}>
                <SectionHeader>◆ Technical readout</SectionHeader>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: '12px', fontSize: '11px' }}>
                  <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>20d high</div><div style={{ color: colors.text, fontSize: '13px', marginTop: '2px' }}>${technicals.high20.toFixed(0)}</div></div>
                  <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>20d low</div><div style={{ color: colors.text, fontSize: '13px', marginTop: '2px' }}>${technicals.low20.toFixed(0)}</div></div>
                  <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>50d high</div><div style={{ color: colors.text, fontSize: '13px', marginTop: '2px' }}>${technicals.high50.toFixed(0)}</div></div>
                  <div><div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>200d low</div><div style={{ color: colors.text, fontSize: '13px', marginTop: '2px' }}>${technicals.low200.toFixed(0)}</div></div>
                </div>
                <div style={{ marginTop: '12px', fontSize: '11px', color: colors.textDim }}>
                  ATR(14): ${technicals.atr14.toFixed(2)} — typical daily true range. Sell/buy bands set to ±0.4 ATR around target.
                </div>
              </div>
            )}

            {/* ====== v14 NEW CARD: On-chain & corporate signals ====== */}
            {/* Surfaces the three new readings (mNAV, STH cost, ETF flows) with explicit thresholds
                and traffic-light tone. Designed to be the page's secondary anchor after the mode card —
                it answers "WHY is the tool in this mode?" rather than just showing the verdict. */}
            <div style={{ background: colors.panel, border: `1px solid ${colors.border}`, padding: '20px', marginBottom: '24px' }}>
              <SectionHeader>◆ On-chain &amp; corporate signals</SectionHeader>

              {/* mNAV row */}
              <div style={{ padding: '12px 0', borderBottom: `1px solid ${colors.border}` }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '4px' }}>
                  <span style={{ color: colors.textDim, fontSize: '11px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>mNAV (EV ÷ BTC NAV)</span>
                  <span style={{ color: mNavTone(mNAV), fontSize: '17px', fontWeight: 600 }}>{mNAV ? `${mNAV.toFixed(2)}x` : '—'}</span>
                </div>
                <div style={{ fontSize: '11px', color: mNavTone(mNAV), fontStyle: 'italic', marginBottom: '4px' }}>{mNavLabel(mNAV)}</div>
                <div style={{ fontSize: '10px', color: colors.textMute, lineHeight: 1.5 }}>
                  Thresholds: <span style={{ color: colors.green }}>&lt;1.05 sub-NAV</span> · 1.05–1.20 stall · 1.20–1.80 healthy · <span style={{ color: colors.red }}>1.80–2.50 elevated · &gt;2.50 euphoria</span>
                </div>
                {parsedMnav !== null && recomputedMnav !== null && mNAVdiscrepancy > 0.1 && (
                  <div style={{ marginTop: '6px', fontSize: '10px', color: colors.red, padding: '6px 8px', background: '#1a0f0d', border: `1px dashed ${colors.red}` }}>
                    ⚠ Parsed mNAV ({parsedMnav.toFixed(2)}x) and recomputed mNAV ({recomputedMnav.toFixed(2)}x) differ by {mNAVdiscrepancy.toFixed(2)}x. Check corporate inputs.
                  </div>
                )}
                {mNAVisLegacy && (
                  <div style={{ marginTop: '6px', fontSize: '10px', color: colors.textMute, fontStyle: 'italic' }}>
                    Using legacy market-cap-only mNAV. Paste a prompt response to get the full EV-based figure.
                  </div>
                )}
              </div>

              {/* BTC vs STH cost basis row */}
              <div style={{ padding: '12px 0', borderBottom: `1px solid ${colors.border}` }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '4px' }}>
                  <span style={{ color: colors.textDim, fontSize: '11px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>BTC vs short-term holder cost</span>
                  <span style={{ color: btcBelowSthCost ? colors.red : colors.green, fontSize: '17px', fontWeight: 600 }}>
                    {sthRealizedPrice ? `${(((btcPrice / sthRealizedPrice) - 1) * 100).toFixed(1)}%` : '—'}
                  </span>
                </div>
                <div style={{ fontSize: '11px', color: btcBelowSthCost ? colors.red : colors.textDim, marginBottom: '4px' }}>
                  {sthRealizedPrice
                    ? (btcBelowSthCost
                        ? `STHs underwater — recent buyers at $${sthRealizedPrice.toLocaleString()}`
                        : `STHs profitable — cost basis $${sthRealizedPrice.toLocaleString()}`)
                    : 'Awaiting data'}
                </div>
                <div style={{ fontSize: '10px', color: colors.textMute, lineHeight: 1.5 }}>
                  When BTC trades below short-term holder realized price, recent buyers are underwater. Signal of structural sell pressure.
                </div>
              </div>

              {/* ETF flows row */}
              <div style={{ padding: '12px 0' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '4px' }}>
                  <span style={{ color: colors.textDim, fontSize: '11px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Spot ETF 5-day flows</span>
                  <span style={{ color: etfOutflowsPersistent ? colors.red : etfFlows5d > 100 ? colors.green : colors.gold, fontSize: '17px', fontWeight: 600 }}>
                    {etfFlows5d !== null ? `${etfFlows5d >= 0 ? '+' : ''}$${etfFlows5d.toLocaleString()}M` : '—'}
                  </span>
                </div>
                <div style={{ fontSize: '11px', color: etfOutflowsPersistent ? colors.red : colors.textDim, marginBottom: '4px' }}>
                  {etfFlows5d === null
                    ? 'Awaiting data'
                    : etfOutflowsPersistent
                      ? 'Persistent outflows — institutional risk-off'
                      : etfFlows5d > 500
                        ? 'Strong inflows — institutional accumulation'
                        : 'Mixed / neutral flows'}
                </div>
                <div style={{ fontSize: '10px', color: colors.textMute, lineHeight: 1.5 }}>
                  Threshold: outflows &gt; $500M over 5 trading days flips bear signal. Source: Farside Investors.
                </div>
              </div>

              {/* Corporate inputs sub-block */}
              {(totalDebt !== null || preferredNotional !== null || cashPosition !== null) && (
                <div style={{ marginTop: '14px', paddingTop: '14px', borderTop: `1px solid ${colors.border}` }}>
                  <div style={{ fontSize: '10px', color: colors.textMute, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: '8px' }}>EV inputs (most recent 10-Q)</div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', fontSize: '11px' }}>
                    <div>
                      <div style={{ color: colors.textMute, fontSize: '9px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Debt</div>

              </div>
              {/* v14.1: USD buying power — converts the GBP cash buffer to USD so it's

              <div style={{ paddingTop: '8px', display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                <span style={{ color: colors.textMute, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>USD buying power available</span>
                <span style={{ color: colors.gold, fontSize: '14px', fontWeight: 600 }}>${(cashBuffer * gbpUsd).toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
              </div>
              {/* Show ladder-rung equivalence if we have ladder data and we're in DEPLOY mode,

              {mode === 'DEPLOY' && dynamicLevels && cashBuffer > 0 && (() => {
                const usdBuying = cashBuffer * gbpUsd;

                const sharesAtCurrent = perRung / mstrPrice;

                  <div style={{ marginTop: '6px', fontSize: '10px', color: colors.textMute, lineHeight: 1.5, fontStyle: 'italic' }}>

                  </div>

              })()}
              {portfolio.cashPct > 30 && mode === 'ROTATE' && (

                  ⚠ {portfolio.cashPct.toFixed(0)}% cash exceeds the 0–25% guideline for ROTATE mode. Consider deploying via DCA ladder.

                <div style={{ textAlign: 'center' }}><div style={{ fontSize: '24px', color: colors.gold, fontWeight: 600 }}>{cycleData.progress.toFixed(0)}%</div><div style={{ fontSize: '10px', color: colors.textMute, letterSpacing: '0.1em' }}>through correction</div></div>

              </div>
              <div style={{ height: '8px', background: colors.bg, border: `1px solid ${colors.border}`, position: 'relative', overflow: 'hidden' }}>
