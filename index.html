<!--
  =================================================================
  MSTR CYCLE DECISION FRAMEWORK · v14.4 (web build)
  =================================================================

  CHANGES IN v14.4 vs v14.3
  -------------------------
  Four targeted production fixes plus one silent runtime crash patched.

  BUG FIXES (BF1–BF5):

  BF1. ACCRUAL EFFICIENCY LEDGER MATH (journalStats rebuild)
     - Root cause: rotationCostBasis was accumulating ALL buy-leg cash
       including direct accumulation buys with no preceding sell, causing
       astronomically false "above market" efficiency readings.
     - Fix: Strict SELL→BUY pair sequencing via pendingSell sentinel.
       Only BUY legs that close an open SELL leg contribute to
       rotationCostBasis and rotationShares. Direct BUYs (no preceding
       SELL) are excluded from rotation metrics entirely — they increment
       currentShares but do not affect rotationCostBasis.
     - If rotationShares === 0, costPerExtraShare is set to null and
       the UI renders "Awaiting completed cycle…" instead of broken math.
     - rotationCostBasis is now the sum of (buyShares × buyPrice + fees)
       for each paired BUY, and rotationShares is the net share gain
       from each pair ((buyShares - sellShares) per pair, summed).

  BF2. HEADER mNAV DISPLAY HARDENING
     - Root cause: parsedMnav from the pasted data block was displayed
       as-is in the header bar even when it diverged significantly from
       the live recomputedMnav, creating a dangerous discrepancy.
     - Fix: Header mNAV display now uses a derived displayMnav value:
         * If recomputedMnav is available AND diverges from parsedMnav
           by > MNAV_WARN_THRESHOLD (0.15x), display recomputedMnav
           with a "↻ live" badge in amber to flag the override.
         * If recomputedMnav is available and within tolerance, display
           parsedMnav (consistent with main panel).
         * Falls back to parsedMnav → legacyMnav if recomputed unavailable.
     - The existing discrepancy warning in the On-chain panel is unchanged.

  BF3. DEFAULT BASELINE PARAMETERS TO ZERO
     - startingShares: 211 → 0
     - cashBuffer: 0 (was already 0, confirmed)
     - Ensures fresh deployments initialize with a clean slate rather
       than a placeholder share count that corrupts portfolio metrics.

  BF4. CYCLE CLOCK: HARDCODED DATES → MVRV-DRIVEN LIVE STRUCTURE
     - Progress bar now maps MVRV position relative to cycle extremes:
         Progress% = clamp(((3.0 - mvrv) / (3.0 - 0.8)) × 100, 0, 100)
         0% = Cycle peak (MVRV ≥ 3.0) — correction just beginning
         100% = Capitulation floor (MVRV ≤ 0.8) — fully corrected
     - Labels updated to "Correction Progress" and "MVRV Target Proximity"
       rather than calendar day countdown.
     - Contextual commentary displayed beneath bar: zone label
       (Recovery / Healthy / Caution / Distribution / Euphoria) derived
       from MVRV band, matching the existing on-chain scoring logic.
     - Fallback: if mvrv === null or unavailable, falls back to legacy
       date-based calculation (Oct 2025 ATH → Oct 2026 projected bottom)
       with an explicit "Calendar fallback — paste data to enable MVRV
       clock" note. cycleData memo retained for this fallback path.

  BF5. deleteTrade RUNTIME CRASH (silent bug, not in brief)
     - deleteTrade was called in the Journal trade history list but was
       never defined in the component, causing a silent TypeError crash
       whenever a user tapped the × button on any trade row.
     - Fix: deleteTrade function added, mirroring deleteSnapshot/
       deletePosition patterns — filters by id, updates state and
       localStorage.

  SCORE CEILINGS: unchanged from v14.3 (bear max 20, bottom max 20).
  ALL THRESHOLDS: unchanged from v14.3.
  All v14.3 features (SE1 IV Rank, SE2 Dilution Brake, SE3 STH Ladder,
  CR1 Deploy Imminent, CR2 NumberInput, CR3 mNAV tolerance) preserved.
-->

<script>
  const PASSWORD_HASH = '021ab4d101785587d5ddc3e3715150393924c9df228cb6732c40da48a6cfc7c4';
  const AUTH_REQUIRED = true;
  const AUTH_SESSION_KEY = 'mstr:auth';

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function tryUnlock(input) {
    const h = await sha256Hex(input);
    return h === PASSWORD_HASH;
  }
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0806; color: #d4c8b8; -webkit-font-smoothing: antialiased; }
  body { font-family: Georgia, "Times New Roman", serif; min-height: 100vh; min-height: 100dvh; }

  .gate { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 24px; }

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

function Gate({ onUnlock }) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!pw) return;
    setBusy(true); setErr('');
    const ok = await tryUnlock(pw);
    setBusy(false);
    if (ok) {
      try { sessionStorage.setItem(AUTH_SESSION_KEY, '1'); } catch (e) {}
      onUnlock();
    } else { setErr('Incorrect password.'); setPw(''); }
  };
  return (
    <div className="gate">
      <div className="gate-card">
        <div className="gate-title">MSTR Cycle Tool</div>
        <div className="gate-sub">Enter password to continue.</div>
        <input type="password" className="gate-input" autoFocus value={pw}
          onChange={(e) => setPw(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
          placeholder="Password" />
        <button className="gate-btn" onClick={submit} disabled={busy || !pw}>
          {busy ? 'Checking…' : 'Unlock'}
        </button>
        <div className="gate-err">{err}</div>
      </div>
    </div>
  );
}

function MSTRCycleTool() {
  // ============ CORE PRICE STATE ============
  const [mstrPrice, setMstrPrice] = useState(187);
  const [btcPrice, setBtcPrice] = useState(80000);
  const [ma200, setMa200] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [pasteText, setPasteText] = useState('');
  const [pasteResult, setPasteResult] = useState(null);

  // ============ TECHNICAL LEVELS ============
  const [high20, setHigh20] = useState(null);
  const [low20, setLow20] = useState(null);
  const [high50, setHigh50] = useState(null);
  const [low50, setLow50] = useState(null);
  const [low200, setLow200] = useState(null);
  const [atr14, setAtr14] = useState(null);

  // ============ STRATEGY STATE ============
  const [nupl, setNupl] = useState(19);
  const [mvrv, setMvrv] = useState(1.4);
  const [fundingNegative, setFundingNegative] = useState(false);
  const [derivativesExhaustion, setDerivativesExhaustion] = useState(false);
  const [below200ma, setBelow200ma] = useState(false);
  const [weeklyLowerLow, setWeeklyLowerLow] = useState(false);
  const [dxyAbove110, setDxyAbove110] = useState(false);
  const [btcHoldings, setBtcHoldings] = useState(818869);
  const [dilutedShares, setDilutedShares] = useState(280);
  const [corporateBaseUpdated, setCorporateBaseUpdated] = useState(null);
  // BF3: startingShares defaults to 0 (was 211)
  const [startingShares, setStartingShares] = useState(0);
  // BF3: cashBuffer stays 0 (confirmed already 0 in v14.3)
  const [cashBuffer, setCashBuffer] = useState(0);
  const [gbpUsd, setGbpUsd] = useState(1.27);

  // ============ v14 mNAV / STH / ETF flows ============
  const [parsedMnav, setParsedMnav] = useState(null);
  const [totalDebt, setTotalDebt] = useState(null);
  const [preferredNotional, setPreferredNotional] = useState(null);
  const [cashPosition, setCashPosition] = useState(null);
  const [sthRealizedPrice, setSthRealizedPrice] = useState(null);
  const [btcBelowSthCost, setBtcBelowSthCost] = useState(false);
  const [etfFlows5d, setEtfFlows5d] = useState(null);
  const [etfOutflowsPersistent, setEtfOutflowsPersistent] = useState(false);
  const [mnavCompressed, setMnavCompressed] = useState(false);
  const [mnavEuphoric, setMnavEuphoric] = useState(false);

  // ============ v14.2 signals ============
  const [btcDominance, setBtcDominance] = useState(null);
  const [mstrShortInt, setMstrShortInt] = useState(null);
  const [atmActive, setAtmActive] = useState(false);

  // ============ SE1: IV Rank (v14.3) ============
  const [ivRank, setIvRank] = useState(null);

  // ============ v14.1 freshness ============
  const [dataTimestamp, setDataTimestamp] = useState(null);
  const [confidence, setConfidence] = useState(null);
  const [staleFields, setStaleFields] = useState(null);

  // ============ Level overrides ============
  const [levelsAuto, setLevelsAuto] = useState(true);
  const [manualSellLow, setManualSellLow] = useState(192);
  const [manualSellHigh, setManualSellHigh] = useState(200);
  const [manualBuyLow, setManualBuyLow] = useState(170);
  const [manualBuyHigh, setManualBuyHigh] = useState(180);

  // ============ Journal/snapshots ============
  const [trades, setTrades] = useState([]);
  const [snapshots, setSnapshots] = useState([]);

  // ============ AGGRESSION PROFILE ============
  const [aggressionStyle, setAggressionStyle] = useState('moderate');

  // ============ ACTIVE POSITIONS ============
  const [positions, setPositions] = useState([]);
  const [positionForm, setPositionForm] = useState({ shares: '', entryPrice: '', stop: '', target: '', tag: 'MANUAL', notes: '' });
  const [exitPrices, setExitPrices] = useState({});
  const [view, setView] = useState('dashboard');
  const [tradeType, setTradeType] = useState('SELL');
  const [tradeShares, setTradeShares] = useState('');
  const [tradePrice, setTradePrice] = useState('');
  const [tradeDate, setTradeDate] = useState(new Date().toISOString().slice(0, 10));
  const [tradeFees, setTradeFees] = useState('');
  const [promptCopied, setPromptCopied] = useState(false);
  const [promptSelectMsg, setPromptSelectMsg] = useState('');
  const promptTextareaRef = useRef(null);

  // ============ LOAD/PERSIST ============
  useEffect(() => {
    try {
      const s = JSON.parse(localStorage.getItem('mstr:settings') || 'null');
      if (s) {
        if (s.mstrPrice !== undefined) setMstrPrice(s.mstrPrice);
        if (s.btcPrice !== undefined) setBtcPrice(s.btcPrice);
        if (s.ma200 !== undefined) setMa200(s.ma200);
        if (s.lastUpdated !== undefined) setLastUpdated(s.lastUpdated);
        if (s.high20 !== undefined) setHigh20(s.high20);
        if (s.low20 !== undefined) setLow20(s.low20);
        if (s.high50 !== undefined) setHigh50(s.high50);
        if (s.low50 !== undefined) setLow50(s.low50);
        if (s.low200 !== undefined) setLow200(s.low200);
        if (s.atr14 !== undefined) setAtr14(s.atr14);
        if (s.nupl !== undefined) setNupl(s.nupl);
        if (s.mvrv !== undefined) setMvrv(s.mvrv);
        if (s.fundingNegative !== undefined) setFundingNegative(s.fundingNegative);
        if (s.derivativesExhaustion !== undefined) setDerivativesExhaustion(s.derivativesExhaustion);
        if (s.below200ma !== undefined) setBelow200ma(s.below200ma);
        if (s.weeklyLowerLow !== undefined) setWeeklyLowerLow(s.weeklyLowerLow);
        if (s.dxyAbove110 !== undefined) setDxyAbove110(s.dxyAbove110);
        if (s.btcHoldings !== undefined) setBtcHoldings(s.btcHoldings);
        if (s.dilutedShares !== undefined) setDilutedShares(s.dilutedShares);
        if (s.corporateBaseUpdated !== undefined) setCorporateBaseUpdated(s.corporateBaseUpdated);
        if (s.startingShares !== undefined) setStartingShares(s.startingShares);
        if (s.cashBuffer !== undefined) setCashBuffer(s.cashBuffer);
        if (s.gbpUsd !== undefined) setGbpUsd(s.gbpUsd);
        if (s.levelsAuto !== undefined) setLevelsAuto(s.levelsAuto);
        if (s.manualSellLow !== undefined) setManualSellLow(s.manualSellLow);
        if (s.manualSellHigh !== undefined) setManualSellHigh(s.manualSellHigh);
        if (s.manualBuyLow !== undefined) setManualBuyLow(s.manualBuyLow);
        if (s.manualBuyHigh !== undefined) setManualBuyHigh(s.manualBuyHigh);
        if (s.aggressionStyle !== undefined) setAggressionStyle(s.aggressionStyle);
        if (s.parsedMnav !== undefined) setParsedMnav(s.parsedMnav);
        if (s.totalDebt !== undefined) setTotalDebt(s.totalDebt);
        if (s.preferredNotional !== undefined) setPreferredNotional(s.preferredNotional);
        if (s.cashPosition !== undefined) setCashPosition(s.cashPosition);
        if (s.sthRealizedPrice !== undefined) setSthRealizedPrice(s.sthRealizedPrice);
        if (s.btcBelowSthCost !== undefined) setBtcBelowSthCost(s.btcBelowSthCost);
        if (s.etfFlows5d !== undefined) setEtfFlows5d(s.etfFlows5d);
        if (s.etfOutflowsPersistent !== undefined) setEtfOutflowsPersistent(s.etfOutflowsPersistent);
        if (s.mnavCompressed !== undefined) setMnavCompressed(s.mnavCompressed);
        if (s.mnavEuphoric !== undefined) setMnavEuphoric(s.mnavEuphoric);
        if (s.dataTimestamp !== undefined) setDataTimestamp(s.dataTimestamp);
        if (s.confidence !== undefined) setConfidence(s.confidence);
        if (s.staleFields !== undefined) setStaleFields(s.staleFields);
        if (s.btcDominance !== undefined) setBtcDominance(s.btcDominance);
        if (s.mstrShortInt !== undefined) setMstrShortInt(s.mstrShortInt);
        if (s.atmActive !== undefined) setAtmActive(s.atmActive);
        if (s.ivRank !== undefined) setIvRank(s.ivRank);
      }
    } catch (e) {}
    try { const t = localStorage.getItem('mstr:trades'); if (t) setTrades(JSON.parse(t)); } catch (e) {}
    try { const sn = localStorage.getItem('mstr:snapshots'); if (sn) setSnapshots(JSON.parse(sn)); } catch (e) {}
    try { const pos = localStorage.getItem('mstr:positions'); if (pos) setPositions(JSON.parse(pos)); } catch (e) {}
  }, []);

  useEffect(() => {
    try {
      localStorage.setItem('mstr:settings', JSON.stringify({
        mstrPrice, btcPrice, ma200, lastUpdated,
        high20, low20, high50, low50, low200, atr14,
        nupl, mvrv, fundingNegative, derivativesExhaustion, below200ma,
        weeklyLowerLow, dxyAbove110, btcHoldings, dilutedShares,
        corporateBaseUpdated, startingShares, cashBuffer, gbpUsd,
        levelsAuto, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh,
        aggressionStyle,
        parsedMnav, totalDebt, preferredNotional, cashPosition,
        sthRealizedPrice, btcBelowSthCost, etfFlows5d, etfOutflowsPersistent,
        mnavCompressed, mnavEuphoric, dataTimestamp, confidence, staleFields,
        btcDominance, mstrShortInt, atmActive, ivRank,
      }));
    } catch (e) {}
  }, [mstrPrice, btcPrice, ma200, lastUpdated,
      high20, low20, high50, low50, low200, atr14,
      nupl, mvrv, fundingNegative, derivativesExhaustion, below200ma,
      weeklyLowerLow, dxyAbove110, btcHoldings, dilutedShares,
      corporateBaseUpdated, startingShares, cashBuffer, gbpUsd,
      levelsAuto, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh,
      aggressionStyle,
      parsedMnav, totalDebt, preferredNotional, cashPosition,
      sthRealizedPrice, btcBelowSthCost, etfFlows5d, etfOutflowsPersistent,
      mnavCompressed, mnavEuphoric, dataTimestamp, confidence, staleFields,
      btcDominance, mstrShortInt, atmActive, ivRank]);

  const handleHoldingsChange = (v) => { setBtcHoldings(v); setCorporateBaseUpdated(new Date().toISOString().slice(0, 10)); };
  const handleSharesChange = (v) => { setDilutedShares(v); setCorporateBaseUpdated(new Date().toISOString().slice(0, 10)); };

  // ============ DERIVED CALCS ============
  const btcPerShare = useMemo(() => btcHoldings / (dilutedShares * 1_000_000), [btcHoldings, dilutedShares]);
  const fairValue = useMemo(() => btcPerShare * btcPrice, [btcPerShare, btcPrice]);
  const legacyMnav = useMemo(() => fairValue > 0 ? mstrPrice / fairValue : 0, [mstrPrice, fairValue]);
  const mNAV = useMemo(() => parsedMnav !== null ? parsedMnav : legacyMnav, [parsedMnav, legacyMnav]);
  const mNAVisLegacy = parsedMnav === null;

  const recomputedMnav = useMemo(() => {
    if (totalDebt === null || preferredNotional === null || cashPosition === null) return null;
    const marketCap = mstrPrice * dilutedShares;
    const ev = marketCap + totalDebt + preferredNotional - cashPosition;
    const btcNav = (btcHoldings * btcPrice) / 1_000_000;
    return btcNav > 0 ? ev / btcNav : null;
  }, [mstrPrice, dilutedShares, totalDebt, preferredNotional, cashPosition, btcHoldings, btcPrice]);

  // CR3: threshold 0.1 → 0.15; round both to 2dp
  const mNAVdiscrepancy = useMemo(() => {
    if (parsedMnav === null || recomputedMnav === null) return null;
    const a = Math.round(parsedMnav * 100) / 100;
    const b = Math.round(recomputedMnav * 100) / 100;
    return Math.abs(a - b);
  }, [parsedMnav, recomputedMnav]);
  const MNAV_WARN_THRESHOLD = 0.15;

  // BF2: Derived displayMnav for the header bar.
  // If recomputedMnav is available and diverges beyond tolerance, use it
  // (with a flag so the header can render a visual indicator). Otherwise
  // fall through to parsedMnav → legacyMnav.
  const headerMnavInfo = useMemo(() => {
    const diverged = mNAVdiscrepancy !== null && mNAVdiscrepancy > MNAV_WARN_THRESHOLD;
    if (recomputedMnav !== null && diverged) {
      return { value: recomputedMnav, overridden: true, parsedWas: parsedMnav };
    }
    return { value: mNAV, overridden: false, parsedWas: null };
  }, [recomputedMnav, mNAV, mNAVdiscrepancy, parsedMnav]);

  // BF4: MVRV-driven cycle clock.
  // cycleData is retained as legacy fallback when mvrv is unavailable.
  const MVRV_PEAK = 3.0;    // 0% correction progress
  const MVRV_FLOOR = 0.8;   // 100% correction progress
  const cycleData = useMemo(() => {
    const ath = new Date('2025-10-06');
    const target = new Date('2026-10-06');
    const now = new Date();
    const totalDays = Math.round((target - ath) / 86400000);
    const elapsed = Math.round((now - ath) / 86400000);
    const remaining = Math.round((target - now) / 86400000);
    const progress = Math.min(100, Math.max(0, (elapsed / totalDays) * 100));
    return { totalDays, elapsed, remaining, progress };
  }, [lastUpdated]);

  // BF4: MVRV-based progress (primary clock)
  const mvrvClock = useMemo(() => {
    const progress = Math.min(100, Math.max(0, ((MVRV_PEAK - mvrv) / (MVRV_PEAK - MVRV_FLOOR)) * 100));
    let zone, zoneColor;
    if (mvrv >= 3.0)      { zone = 'Euphoria — peak distribution risk';  zoneColor = '#c73e1d'; }
    else if (mvrv >= 2.0) { zone = 'Distribution — late-cycle elevated'; zoneColor = '#c73e1d'; }
    else if (mvrv >= 1.5) { zone = 'Caution — premium above fair value'; zoneColor = '#d4a017'; }
    else if (mvrv >= 1.0) { zone = 'Healthy — within normal range';      zoneColor = '#d4a017'; }
    else if (mvrv >= 0.8) { zone = 'Compressed — approaching floor';     zoneColor: '#2d8659'; zoneColor = '#2d8659'; }
    else                  { zone = 'Capitulation — below cost basis';    zoneColor = '#2d8659'; }
    const pctToFloor = Math.max(0, ((mvrv - MVRV_FLOOR) / (MVRV_PEAK - MVRV_FLOOR)) * 100);
    return { progress, zone, zoneColor, pctToFloor };
  }, [mvrv]);

  const daysSinceBaseUpdate = useMemo(() => {
    if (!corporateBaseUpdated) return null;
    return Math.floor((new Date() - new Date(corporateBaseUpdated)) / 86400000);
  }, [corporateBaseUpdated, lastUpdated]);

  const freshness = useMemo(() => {
    let ts = null; let source = null;
    if (dataTimestamp) { const p = new Date(dataTimestamp); if (!isNaN(p.getTime())) { ts = p; source = 'data-timestamp'; } }
    if (!ts && lastUpdated) { const p = new Date(lastUpdated); if (!isNaN(p.getTime())) { ts = p; source = 'paste-time'; } }
    if (!ts) return { tier: 'none', hours: null, source: null };
    const hours = (Date.now() - ts.getTime()) / 3600000;
    return { tier: hours > 72 ? 'red' : hours > 24 ? 'amber' : 'fresh', hours, source, ts };
  }, [dataTimestamp, lastUpdated]);

  // ============ SE2: DILUTION BRAKE (derived flag) ============
  const dilutionBrakeActive = useMemo(() => atmActive && mNAV !== null && mNAV < 1.2, [atmActive, mNAV]);

  // ============ AGGRESSION PROFILE ============
  const baseProfile = useMemo(() => {
    switch (aggressionStyle) {
      case 'conservative':
        return { label: 'Conservative', rotationSizePctLow: 15, rotationSizePctHigh: 20, bandWidthMult: 0.55, hoardSensitivity: 1.15, deployLadderSteepness: 0.9 };
      case 'aggressive':
        return { label: 'Aggressive', rotationSizePctLow: 35, rotationSizePctHigh: 45, bandWidthMult: 0.28, hoardSensitivity: 0.85, deployLadderSteepness: 1.15 };
      default:
        return { label: 'Moderate (Base)', rotationSizePctLow: 25, rotationSizePctHigh: 30, bandWidthMult: 0.4, hoardSensitivity: 1.0, deployLadderSteepness: 1.0 };
    }
  }, [aggressionStyle]);

  const profile = useMemo(() => {
    if (!dilutionBrakeActive) return baseProfile;
    return {
      ...baseProfile,
      rotationSizePctLow: Math.round(baseProfile.rotationSizePctLow * 0.5 * 10) / 10,
      rotationSizePctHigh: Math.round(baseProfile.rotationSizePctHigh * 0.5 * 10) / 10,
    };
  }, [baseProfile, dilutionBrakeActive]);

  // ============ DYNAMIC LEVELS ============
  const technicals = useMemo(() => {
    if (high20 === null || low20 === null || atr14 === null) return null;
    return { high20, low20, high50, low50, low200, atr14 };
  }, [high20, low20, high50, low50, low200, atr14]);

  const sthMstrFloor = useMemo(() => {
    if (!sthRealizedPrice || btcPerShare <= 0) return null;
    return btcPerShare * sthRealizedPrice;
  }, [sthRealizedPrice, btcPerShare]);

  const dynamicLevels = useMemo(() => {
    if (!technicals) return null;
    const { high20, low20, atr14 } = technicals;
    const current = mstrPrice;
    const rotateSellTarget = Math.max(high20, current + atr14);
    const rotateBuyTarget = Math.min(low20, current - atr14);
    const bandWidth = atr14 * profile.bandWidthMult;
    const hoardBuyAnchor = ma200 ? ma200 * 0.85 : current - atr14 * 2;
    const hoardBuyDeep = ma200 ? ma200 * 0.75 : current - atr14 * 3;
    const hoardBuyTarget = current - (current - hoardBuyAnchor) / profile.hoardSensitivity;
    const hoardBuyDeepTarget = current - (current - hoardBuyDeep) / profile.hoardSensitivity;

    let deployRungs;
    let deployAnchorMode;
    if (sthMstrFloor !== null) {
      const s = profile.deployLadderSteepness;
      deployRungs = [
        { level: sthMstrFloor * (1 + 0.05 * s), pct: 25 },
        { level: sthMstrFloor,                   pct: 25 },
        { level: sthMstrFloor * (1 - 0.10 * s), pct: 25 },
        { level: sthMstrFloor * (1 - 0.20 * s), pct: 25 },
      ];
      deployAnchorMode = 'sth';
    } else if (ma200) {
      deployRungs = [
        { level: current, pct: 25 },
        { level: current - (current - ma200 * 0.85) * 0.5 * profile.deployLadderSteepness, pct: 25 },
        { level: current - (current - ma200 * 0.85) * profile.deployLadderSteepness, pct: 25 },
        { level: current - (current - ma200 * 0.65) * profile.deployLadderSteepness, pct: 25 },
      ];
      deployAnchorMode = '200ma';
    } else {
      deployRungs = [
        { level: current, pct: 25 },
        { level: current * (1 - 0.10 * profile.deployLadderSteepness), pct: 25 },
        { level: current * (1 - 0.20 * profile.deployLadderSteepness), pct: 25 },
        { level: current * (1 - 0.30 * profile.deployLadderSteepness), pct: 25 },
      ];
      deployAnchorMode = 'price';
    }

    return {
      rotate: { sellLow: rotateSellTarget - bandWidth, sellHigh: rotateSellTarget + bandWidth, buyLow: rotateBuyTarget - bandWidth, buyHigh: rotateBuyTarget + bandWidth },
      hoard: { sellLow: current + atr14 * 0.5, sellHigh: Math.max(high20, current + atr14 * 1.5), buyTarget: hoardBuyTarget, buyDeepTarget: hoardBuyDeepTarget },
      deploy: { ladder: deployRungs, anchorMode: deployAnchorMode },
    };
  }, [technicals, ma200, mstrPrice, profile, sthMstrFloor]);

  // ============ SCORES + MODE ============
  const bearScore = useMemo(() => {
    let s = 0;
    if (btcPrice < 72500) s += 2;
    if (btcPrice < 60000) s += 2;
    if (nupl < 0) s += 2;
    if (mvrv < 1.0) s += 1;
    if (fundingNegative) s += 1;
    if (below200ma) s += 2;
    if (weeklyLowerLow) s += 1;
    if (dxyAbove110) s += 1;
    if (cycleData.remaining > 0 && cycleData.remaining < 180) s += 1;
    if (mNAV >= 1.05 && mNAV < 1.20) s += 1;
    if (mNAV > 2.5) s += 2;
    if (btcBelowSthCost) s += 1;
    if (etfOutflowsPersistent) s += 1;
    if (btcDominance !== null && btcDominance < 50) s += 1;
    if (atmActive && mNAV !== null && mNAV < 1.2) s += 1;
    if (ivRank !== null && ivRank > 75) s += 1;
    return s;
  }, [btcPrice, nupl, mvrv, fundingNegative, below200ma, weeklyLowerLow, dxyAbove110,
      cycleData, mNAV, btcBelowSthCost, etfOutflowsPersistent, btcDominance, atmActive, ivRank]);

  const bottomScore = useMemo(() => {
    let s = 0;
    if (mstrPrice < 120) s += 2;
    if (mstrPrice < 90) s += 2;
    if (btcPrice < 55000) s += 2;
    if (btcPrice < 45000) s += 2;
    if (nupl < -25) s += 3;
    if (mvrv < 0.8) s += 3;
    if (derivativesExhaustion) s += 2;
    if (Math.abs(cycleData.remaining) < 60) s += 2;
    if (mNAV > 0 && mNAV < 1.05) s += 2;
    if (btcBelowSthCost) s += 1;
    if (mstrShortInt !== null && mstrShortInt > 20) s += 1;
    return s;
  }, [mstrPrice, btcPrice, nupl, mvrv, derivativesExhaustion, cycleData, mNAV, btcBelowSthCost, mstrShortInt]);

  const mode = useMemo(() => {
    if (bottomScore >= 7 && mstrPrice < 140) return 'DEPLOY';
    if (bearScore >= 6) return 'HOARD';
    return 'ROTATE';
  }, [bearScore, bottomScore, mstrPrice]);

  const deployImminent = useMemo(() => {
    if (mode !== 'HOARD') return false;
    return bottomScore >= 5 && bottomScore <= 6 && mstrPrice < 160;
  }, [mode, bottomScore, mstrPrice]);

  // ============ LEVEL DISPLAY ============
  const fmt = (v) => `$${Math.round(v)}`;
  const fmtRange = (low, high) => `${fmt(low)}–${fmt(high)}`;

  const levelDisplay = useMemo(() => {
    if (!levelsAuto || !dynamicLevels) {
      return {
        rotate: { sell: fmtRange(manualSellLow, manualSellHigh), buy: fmtRange(manualBuyLow, manualBuyHigh) },
        hoard:  { sell: fmtRange(manualSellLow, manualSellHigh), buy: `Wait — target ${fmt(manualBuyLow * 0.7)}` },
        deploy: { sell: 'Do not sell', buy: 'Ladder every 10% drop' },
      };
    }
    const d = dynamicLevels;
    return {
      rotate: { sell: fmtRange(d.rotate.sellLow, d.rotate.sellHigh), buy: fmtRange(d.rotate.buyLow, d.rotate.buyHigh) },
      hoard:  { sell: fmtRange(d.hoard.sellLow, d.hoard.sellHigh), buy: `Wait — target ${fmt(d.hoard.buyTarget)} / deep ${fmt(d.hoard.buyDeepTarget)}` },
      deploy: { sell: 'Do not sell', buy: `Ladder: ${d.deploy.ladder.map(l => fmt(l.level)).join(' · ')}` },
    };
  }, [levelsAuto, dynamicLevels, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh]);

  const alertLevels = useMemo(() => {
    if (!levelsAuto || !dynamicLevels) {
      return {
        rotate: { sellAlert: manualSellLow, buyAlert: manualBuyHigh },
        hoard:  { sellAlert: manualSellLow, buyAlert: manualBuyLow * 0.7, buyDeepAlert: null },
        deploy: { sellAlert: null, ladder: [] },
      };
    }
    const d = dynamicLevels;
    return {
      rotate: { sellAlert: d.rotate.sellLow, buyAlert: d.rotate.buyHigh },
      hoard:  { sellAlert: d.hoard.sellLow, buyAlert: d.hoard.buyTarget, buyDeepAlert: d.hoard.buyDeepTarget },
      deploy: { sellAlert: null, ladder: d.deploy.ladder.map(r => r.level) },

  }, [levelsAuto, dynamicLevels, manualSellLow, manualSellHigh, manualBuyLow, manualBuyHigh]);

  const modeCfg = {
    ROTATE: { label: 'NORMAL ROTATION', color: '#d4a017', bg: '#1a1611', action: 'Sell at resistance, buy back at support.', cash: '0–25%' },
    HOARD:  { label: 'CASH HOARD',      color: '#c73e1d', bg: '#1a0f0d', action: 'Sell at resistance. Do NOT buy back. Wait for deeper levels.', cash: '40–70%' },
    DEPLOY: { label: 'DEPLOY CASH',     color: '#2d8659', bg: '#0f1a13', action: 'Ladder cash into weakness. All-in accumulation.', cash: 'Deploying to 0%' },

  const cfg = modeCfg[mode];

  // ============ BAND-HIT DETECTION ============
  const bandHits = useMemo(() => {
    if (!dynamicLevels) return [];
    const hits = []; const d = dynamicLevels; const p = mstrPrice;
    if (mode === 'ROTATE') {
      if (p >= d.rotate.sellLow && p <= d.rotate.sellHigh) hits.push({ tag: 'ROTATE-SELL', side: 'SELL', label: 'ROTATE sell zone hit', zone: `${fmt(d.rotate.sellLow)}–${fmt(d.rotate.sellHigh)}`, price: p });
      if (p >= d.rotate.buyLow  && p <= d.rotate.buyHigh)  hits.push({ tag: 'ROTATE-BUY',  side: 'BUY',  label: 'ROTATE buy zone hit',  zone: `${fmt(d.rotate.buyLow)}–${fmt(d.rotate.buyHigh)}`,   price: p });
    }
    if (mode === 'HOARD') {
      if (p >= d.hoard.sellLow && p <= d.hoard.sellHigh) hits.push({ tag: 'HOARD-SELL', side: 'SELL', label: 'HOARD sell zone hit', zone: `${fmt(d.hoard.sellLow)}–${fmt(d.hoard.sellHigh)}`, price: p });
      const t = d.hoard.buyTarget;
      if (p >= t * 0.985 && p <= t * 1.015) hits.push({ tag: 'HOARD-BUY', side: 'BUY', label: 'HOARD buy target reached', zone: fmt(t), price: p });
      const dt = d.hoard.buyDeepTarget;
      if (p <= dt * 1.015) hits.push({ tag: 'HOARD-BUY-DEEP', side: 'BUY', label: 'HOARD deep buy target reached', zone: fmt(dt), price: p });
    }
    if (mode === 'DEPLOY') {
      d.deploy.ladder.forEach((rung, i) => {
        if (p <= rung.level * 1.015) hits.push({ tag: `DEPLOY-RUNG-${i + 1}`, side: 'BUY', label: `DEPLOY rung ${i + 1} live (${rung.pct}%)`, zone: fmt(rung.level), price: p });
      });
    }
    return hits;
  }, [dynamicLevels, mstrPrice, mode]);

  const priceRange = useMemo(() => {
    if (!dynamicLevels) return null;
    const RED = '#c73e1d', GREEN = '#2d8659', GOLD = '#d4a017';
    const p = mstrPrice; const d = dynamicLevels;
    if (mode === 'ROTATE') {
      const lo = d.rotate.buyLow, hi = d.rotate.sellHigh, span = hi - lo;
      const pct = span > 0 ? Math.max(0, Math.min(1, (p - lo) / span)) : 0.5;
      const inSell = p >= d.rotate.sellLow, inBuy = p <= d.rotate.buyHigh;
      const verdict = inSell ? 'IN SELL ZONE' : inBuy ? 'IN BUY ZONE' : 'BETWEEN BANDS';
      return { pct, verdict, tone: inSell ? RED : inBuy ? GREEN : GOLD, lo, hi, buyLow: d.rotate.buyLow, buyHigh: d.rotate.buyHigh, sellLow: d.rotate.sellLow, sellHigh: d.rotate.sellHigh };
    }
    if (mode === 'HOARD') {
      const target = d.hoard.buyTarget;
      const pctToTarget = ((p / target) - 1) * 100;
      const inSell = p >= d.hoard.sellLow, atTarget = p <= target * 1.015;
      const verdict = inSell ? 'IN SELL ZONE' : atTarget ? 'AT BUY TARGET' : `${pctToTarget > 0 ? '+' : ''}${pctToTarget.toFixed(1)}% vs target`;
      return { pct: null, verdict, tone: inSell ? RED : atTarget ? GREEN : GOLD, target, deep: d.hoard.buyDeepTarget, sellLow: d.hoard.sellLow, sellHigh: d.hoard.sellHigh };
    }
    const liveRungs = d.deploy.ladder.filter(r => p <= r.level * 1.015);
    return { pct: null, verdict: liveRungs.length > 0 ? `${liveRungs.length}/4 RUNGS LIVE` : 'ABOVE LADDER', tone: GREEN, ladder: d.deploy.ladder };
  }, [dynamicLevels, mstrPrice, mode]);

  // ============ BF1: JOURNAL STATS — STRICT ROTATION PAIR ACCOUNTING ============
  // Only BUY legs that close an open SELL leg contribute to rotationCostBasis
  // and rotationShares. Direct BUYs (no pending SELL) increment currentShares
  // but are excluded from rotation metrics. If no pairs completed, costPerExtraShare
  // is null and the UI renders a clean "Awaiting completed cycle…" message.
  const journalStats = useMemo(() => {
    let currentShares = startingShares;
    let totalCash = 0;
    let rotationShares = 0;
    let rotationCostBasis = 0;
    let completedRotations = 0;
    let pendingSell = null; // { shares, price, proceeds }

    const sorted = [...trades].sort((a, b) => a.date.localeCompare(b.date));

    sorted.forEach(t => {
      const gross = t.shares * t.price;
      if (t.type === 'SELL') {
        // Record cash received, decrement shares, open rotation window
        currentShares -= t.shares;
        totalCash += gross - (t.fees || 0);
        // A new SELL always opens (or replaces) the pending window.
        // Consecutive SELLs: only the most recent opens the BUY window.
        pendingSell = { shares: t.shares, price: t.price, proceeds: gross - (t.fees || 0) };
      } else {
        // BUY leg
        currentShares += t.shares;
        totalCash -= gross + (t.fees || 0);
        if (pendingSell !== null) {
          // This BUY closes the open SELL — it is a paired rotation trade
          const buyLegCost = gross + (t.fees || 0);
          const netShareGain = t.shares - pendingSell.shares;
          rotationShares += netShareGain;
          rotationCostBasis += buyLegCost;
          completedRotations += 1;
          pendingSell = null;
        }
        // If pendingSell === null, this is a direct accumulation BUY —
        // it correctly increments currentShares but does not touch
        // rotationCostBasis or rotationShares.
      }
    });

    // costPerExtraShare is only meaningful when at least one pair completed
    // AND net rotation shares are positive (i.e. we actually gained shares).
    const costPerExtraShare = (completedRotations > 0 && rotationShares > 0)
      ? rotationCostBasis / rotationShares
      : null;

    return {
      currentShares,
      totalCash,
      sharesDelta: currentShares - startingShares,
      sharesPct: startingShares > 0 ? ((currentShares - startingShares) / startingShares) * 100 : 0,
      rotationShares,
      completedRotations,
      tradeCount: trades.length,
      costPerExtraShare,
    };
  }, [trades, startingShares]);

  const portfolio = useMemo(() => {
    const positionUSD = journalStats.currentShares * mstrPrice;
    const positionGBP = positionUSD / gbpUsd;
    const totalGBP = positionGBP + cashBuffer;
    const cashPct = totalGBP > 0 ? (cashBuffer / totalGBP) * 100 : 0;
    return { positionUSD, positionGBP, totalGBP, cashPct, positionPct: 100 - cashPct };
  }, [journalStats.currentShares, mstrPrice, gbpUsd, cashBuffer]);

  // ============ PROMPT ============
  const claudePrompt = `You are providing market data for a live trading decision tool. Accuracy and freshness are critical — stale or guessed data causes bad trades. Follow all four phases below.

PHASE 1 — STATE THE CURRENT TIME
Write one line: "Current time: YYYY-MM-DD HH:MM UTC" before searching anything.

PHASE 2 — SEARCH WITH FRESHNESS DISCIPLINE
Search for each item. Prefer live/real-time sources over articles.

Sources to use:
- MSTR price + technicals: finance.yahoo.com, barchart.com, stockanalysis.com (live quote)
- MSTR 200MA + 20/50d highs/lows + ATR(14): barchart.com technicals page for MSTR
- BTC spot: coingecko.com, coindesk.com
- NUPL, MVRV, STH realized price: bitbo.io, lookintobitcoin.com, glassnode, cryptoquant
- BTC perp funding + OI: coinglass.com
- ETF 5-day flows: farside.co.uk/btc (authoritative)
- DXY: tradingview.com, marketwatch.com
- BTC dominance: coingecko.com (dominance tab) or tradingview BTC.D
- MSTR short interest: finviz.com MSTR page, or S3 Partners / Ortex (if available)
- MSTR IV rank: barchart.com options page for MSTR (30-day IV rank)
- Strategy ATM status: most recent S-3 or prospectus supplement on SEC EDGAR for MSTR
- Strategy 8-K BTC holdings: latest 8-K on SEC EDGAR
- Strategy 10-Q (debt, preferred, cash): latest 10-Q on SEC EDGAR

Freshness rules:

- If your top result is old, search again with "today", "current", or the actual date.
- Do NOT extrapolate from training data memory. If you cannot cite a source under 7 days old, mark the field as estimated.
- Weekend/holiday closes: note explicitly in STALE_FIELDS.

PHASE 3 — COMPUTE mNAV
EV = (MSTR_PRICE x DILUTED_SHARES_MILLIONS x 1000000) + (TOTAL_DEBT x 1000000) + (PREFERRED_NOTIONAL x 1000000) - (CASH_POSITION x 1000000)
BTC_NAV = BTC_HOLDINGS x BTC_PRICE
mNAV = EV / BTC_NAV

Cross-check against a live tracker (bitcoinquant.co/company/MSTR or VanEck). If computed vs tracker differs by more than 0.1x, recheck debt and preferred inputs.

PHASE 4 — RETURN DATA BLOCK
Return the block below exactly as shown. One key per line. No extra commentary inside the block. Use plain numbers only — no dollar signs, commas, or percent symbols.

---BEGIN DATA---
DATA_TIMESTAMP: [ISO-8601 UTC datetime of oldest data point, e.g. 2026-05-20T13:45:00Z]
CONFIDENCE: [HIGH or MEDIUM or LOW]
STALE_FIELDS: [comma-separated field names where source was over 24h old, or NONE]
MSTR_PRICE: [number]
MSTR_200MA: [number]
MSTR_20D_HIGH: [number]
MSTR_20D_LOW: [number]
MSTR_50D_HIGH: [number]
MSTR_50D_LOW: [number]
MSTR_200D_LOW: [number]

ETF_FLOWS_5D: [signed integer millions USD, e.g. -847 for 847M outflow]
BTC_HOLDINGS: [integer]
DILUTED_SHARES: [number in millions, e.g. 334]
TOTAL_DEBT: [number in millions USD]
PREFERRED_NOTIONAL: [number in millions USD, total of STRC+STRF+STRK+STRD]
CASH_POSITION: [number in millions USD]
MNAV: [number, two decimals]
DXY: [number, one decimal]
BTC_DOMINANCE: [number, one decimal, e.g. 58.4]
MSTR_SHORT_INT: [number, one decimal, percent of float, e.g. 14.2]
MSTR_IV_RANK: [integer 0-100, 30-day IV rank]
BELOW_200MA: ON or OFF
WEEKLY_LL: ON or OFF
SHORTING: ON or OFF
EXHAUSTION: ON or OFF
DXY_ABOVE_110: ON or OFF
BTC_BELOW_STH_COST: ON or OFF
ETF_OUTFLOWS_PERSISTENT: ON or OFF
MNAV_COMPRESSED: ON or OFF
MNAV_EUPHORIC: ON or OFF
ATM_ACTIVE: ON or OFF
---END DATA---

FIELD RULES:
- All numbers: digits and decimal point only. No symbols.
- DILUTED_SHARES: in millions (e.g. 334 not 334000000).
- TOTAL_DEBT, PREFERRED_NOTIONAL, CASH_POSITION: in millions USD.
- BELOW_200MA: ON if MSTR closing price is below 200-day SMA on most recent weekly close.

- SHORTING and EXHAUSTION are mutually exclusive — at most one ON.

- EXHAUSTION: ON only if funding is flat/neutral AND aggregate OI has collapsed to multi-month lows.
- DXY_ABOVE_110: ON if US Dollar Index is currently above 110.

- MNAV_EUPHORIC: ON if MNAV is greater than 2.5.
- MNAV_COMPRESSED and MNAV_EUPHORIC cannot both be ON.
- ATM_ACTIVE: ON if Strategy has filed a prospectus supplement under an active ATM equity program within the past 30 days.
- BTC_DOMINANCE: BTC market cap as percent of total crypto market cap.
- MSTR_SHORT_INT: short interest as percent of float. Use most recent available (typically bi-monthly FINRA data or Ortex real-time estimate).
- MSTR_IV_RANK: 0 = cheapest options in a year, 100 = most expensive. Use barchart.com MSTR options page. IV > 75 signals peak retail speculation / gamma overextension (bear signal in scoring engine).

CONFIDENCE CRITERIA:
HIGH: All fields from live sources under 24h old. No estimates. mNAV matches tracker within 0.1x.
MEDIUM: 1-2 fields estimated or over 24h old. Or mNAV diverges 0.1-0.2x from tracker.
LOW: 3+ fields estimated. Or any major field (MSTR_PRICE, BTC_PRICE, BTC_HOLDINGS, MNAV, NUPL, MVRV) is over 48h old or uncertain. Or mNAV diverges over 0.2x from tracker.

POST-BLOCK REPORT (required, outside the data block):

A) DATA TIMESTAMPS — one line per field: source name and age.
B) ESTIMATES VS VERIFIED — explicit list.
C) mNAV AUDIT — full EV breakdown: market cap + debt + preferred - cash = EV, then EV / BTC NAV = mNAV. State tracker reading and difference.
D) CONFIDENCE JUSTIFICATION — one sentence.
E) OTHER NOTES — unusual readings, conflicting sources, market closures, recent corporate actions.`;

  // ============ iOS-ROBUST COPY ============
  const copyPrompt = async () => {
    const text = claudePrompt;
    let success = false;
    try { await navigator.clipboard.writeText(text); success = true; }
    catch (e1) {
      try {
        const ta = promptTextareaRef.current;
        if (ta) { ta.removeAttribute('readonly'); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); success = document.execCommand('copy'); ta.setAttribute('readonly', ''); ta.blur(); }
      } catch (e2) { success = false; }
    }
    if (success) { setPromptCopied(true); setTimeout(() => setPromptCopied(false), 2500); }
    else {
      try { const ta = promptTextareaRef.current; if (ta) { ta.removeAttribute('readonly'); ta.focus(); ta.setSelectionRange(0, text.length); ta.setAttribute('readonly', ''); } } catch (e) {}
      setPromptSelectMsg('Text selected — tap and hold, then Copy');
      setTimeout(() => setPromptSelectMsg(''), 4000);
    }
  };

  };

  // ============ PASTE PARSER ============
  const applyPaste = () => {
    if (!pasteText.trim()) { setPasteResult({ ok: false, msg: 'Empty paste' }); return; }
    let text = pasteText.replace(/---BEGIN DATA---/g, '').replace(/---END DATA---/g, '').replace(/```[a-z]*\n?/gi, '').replace(/```/g, '');
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const applied = [], skipped = [];
    const safeNum = (raw, { allowNegative = false, allowZero = false } = {}) => {
      const n = Number(raw);
      if (!Number.isFinite(n)) return null;
      if (!allowNegative && n < 0) return null;
      if (!allowZero && n === 0) return null;
      return n;
    };
    for (const line of lines) {
      const m = line.match(/^([A-Za-z0-9_]+)\s*[:=]\s*(.+?)\s*$/);
      if (!m) continue;
      const key = m[1].toUpperCase();
      const val = m[2].trim();
      const cv = val.replace(/[$,%]/g, '');
      const bv = /^on$|^true$|^yes$|^1$/i.test(val);
      switch (key) {
        case 'MSTR_PRICE':          { const n = safeNum(cv); if (n!==null){setMstrPrice(n);applied.push(`MSTR $${n}`);}else skipped.push(key); break; }
        case 'MSTR_200MA':          { const n = safeNum(cv); if (n!==null){setMa200(n);applied.push(`200MA $${n}`);}else skipped.push(key); break; }
        case 'MSTR_20D_HIGH':       { const n = safeNum(cv); if (n!==null){setHigh20(n);applied.push(`20dH $${n}`);}else skipped.push(key); break; }
        case 'MSTR_20D_LOW':        { const n = safeNum(cv); if (n!==null){setLow20(n);applied.push(`20dL $${n}`);}else skipped.push(key); break; }
        case 'MSTR_50D_HIGH':       { const n = safeNum(cv); if (n!==null){setHigh50(n);applied.push(`50dH $${n}`);}else skipped.push(key); break; }
        case 'MSTR_50D_LOW':        { const n = safeNum(cv); if (n!==null){setLow50(n);applied.push(`50dL $${n}`);}else skipped.push(key); break; }
        case 'MSTR_200D_LOW':       { const n = safeNum(cv); if (n!==null){setLow200(n);applied.push(`200dL $${n}`);}else skipped.push(key); break; }

        case 'BELOW_200MA':         setBelow200ma(bv); applied.push(`200MA ${bv?'ON':'OFF'}`); break;
        case 'WEEKLY_LL':           setWeeklyLowerLow(bv); applied.push(`WeeklyLL ${bv?'ON':'OFF'}`); break;

        case 'DXY_ABOVE_110':       setDxyAbove110(bv); applied.push(`DXY>110 ${bv?'ON':'OFF'}`); break;
        case 'STH_REALIZED_PRICE':  { const n = safeNum(cv); if (n!==null){setSthRealizedPrice(n);applied.push(`STH cost $${n.toLocaleString()}`);}else skipped.push(key); break; }
        case 'ETF_FLOWS_5D':        { const n = safeNum(cv,{allowNegative:true,allowZero:true}); if(n!==null){setEtfFlows5d(n);applied.push(`ETF 5D ${n>=0?'+':''}${n}M`);}else skipped.push(key); break; }
        case 'TOTAL_DEBT':          { const n = safeNum(cv,{allowZero:true}); if(n!==null){setTotalDebt(n);applied.push(`Debt $${n}M`);}else skipped.push(key); break; }
        case 'PREFERRED_NOTIONAL':  { const n = safeNum(cv,{allowZero:true}); if(n!==null){setPreferredNotional(n);applied.push(`Pref $${n}M`);}else skipped.push(key); break; }
        case 'CASH_POSITION':       { const n = safeNum(cv,{allowZero:true}); if(n!==null){setCashPosition(n);applied.push(`Cash $${n}M`);}else skipped.push(key); break; }
        case 'MNAV':                { const n = safeNum(cv); if(n!==null){setParsedMnav(n);applied.push(`mNAV ${n}x`);}else skipped.push(key); break; }
        case 'DXY':                 { const n = safeNum(cv); if(n!==null){applied.push(`DXY ${n}`);}else skipped.push(key); break; }
        case 'BTC_BELOW_STH_COST':  setBtcBelowSthCost(bv); applied.push(`BTC<STH ${bv?'ON':'OFF'}`); break;
        case 'ETF_OUTFLOWS_PERSISTENT': setEtfOutflowsPersistent(bv); applied.push(`ETF out ${bv?'ON':'OFF'}`); break;
        case 'MNAV_COMPRESSED':     setMnavCompressed(bv); if(bv)setMnavEuphoric(false); applied.push(`mNAV comp ${bv?'ON':'OFF'}`); break;
        case 'MNAV_EUPHORIC':       setMnavEuphoric(bv); if(bv)setMnavCompressed(false); applied.push(`mNAV euph ${bv?'ON':'OFF'}`); break;
        case 'BTC_DOMINANCE':       { const n = safeNum(cv); if(n!==null){setBtcDominance(n);applied.push(`BTC.D ${n}%`);}else skipped.push(key); break; }
        case 'MSTR_SHORT_INT':      { const n = safeNum(cv); if(n!==null){setMstrShortInt(n);applied.push(`Short ${n}%`);}else skipped.push(key); break; }
        case 'MSTR_IV_RANK':        { const n = safeNum(cv,{allowZero:true}); if(n!==null){setIvRank(n);applied.push(`IV rank ${n}`);}else skipped.push(key); break; }
        case 'ATM_ACTIVE':          setAtmActive(bv); applied.push(`ATM ${bv?'ON':'OFF'}`); break;
        case 'DATA_TIMESTAMP':      { const d=new Date(val); if(!isNaN(d.getTime())){setDataTimestamp(val);applied.push(`Data @ ${val}`);}else skipped.push(key); break; }
        case 'CONFIDENCE':          { const u=val.toUpperCase(); if(u==='HIGH'||u==='MEDIUM'||u==='LOW'){setConfidence(u);applied.push(`Conf ${u}`);}else skipped.push(key); break; }
        case 'STALE_FIELDS':        setStaleFields(val); applied.push(`Stale: ${val.length>30?val.slice(0,30)+'…':val}`); break;
        default: skipped.push(key);
      }
    }
    if (applied.length === 0) {
      setPasteResult({ ok: false, msg: 'No recognised fields. Check format — expect KEY: VALUE per line.' });
    } else {
      setLastUpdated(new Date().toISOString());
      setPasteResult({ ok: true, msg: `Applied ${applied.length} field${applied.length>1?'s':''}${skipped.length?` (${skipped.length} skipped)`:''}: ${applied.slice(0,6).join(' · ')}${applied.length>6?'…':''}` });

  const saveSnapshot = () => {
    const snap = { date: new Date().toISOString(), mstrPrice, btcPrice, nupl, mvrv, mNAV: Number(mNAV.toFixed(2)), bearScore, bottomScore, mode, sthRealizedPrice, btcBelowSthCost, etfFlows5d, etfOutflowsPersistent, btcDominance, mstrShortInt, atmActive, ivRank };

  const addTrade = () => {

    const updated = [...trades, trade];
    setTrades(updated);
    try { localStorage.setItem('mstr:trades', JSON.stringify(updated)); } catch (e) {}

  };

  // BF5: deleteTrade was called but never defined — now fixed
  const deleteTrade = (id) => {
    const updated = trades.filter(t => t.id !== id);
    setTrades(updated);
    try { localStorage.setItem('mstr:trades', JSON.stringify(updated)); } catch (e) {}
  };

  const openPosition = (overrides = {}) => {
    const f = { ...positionForm, ...overrides };
    if (!f.shares || !f.entryPrice) return;
    const pos = { id: Date.now(), openedAt: new Date().toISOString(), shares: parseFloat(f.shares), entryPrice: parseFloat(f.entryPrice), stop: f.stop ? parseFloat(f.stop) : null, target: f.target ? parseFloat(f.target) : null, tag: f.tag || 'MANUAL', notes: f.notes || '', status: 'OPEN' };
    const updated = [...positions, pos];
    setPositions(updated);

    setPositionForm({ shares: '', entryPrice: '', stop: '', target: '', tag: 'MANUAL', notes: '' });
  };

  const closePosition = (id, exitPrice, exitFees = 0) => {
    const pos = positions.find(p => p.id === id);
    if (!pos) return;
    const exit = parseFloat(exitPrice);
    if (!exit || isNaN(exit)) return;
    const updated = positions.map(p => p.id === id ? { ...p, status: 'CLOSED', closedAt: new Date().toISOString(), exitPrice: exit, exitFees: parseFloat(exitFees) || 0 } : p);
    setPositions(updated);
    try { localStorage.setItem('mstr:positions', JSON.stringify(updated)); } catch (e) {}
    const ct = { id: Date.now(), date: new Date().toISOString().slice(0, 10), type: 'SELL', shares: pos.shares, price: exit, fees: parseFloat(exitFees) || 0, fromPositionId: id };
    const tu = [...trades, ct];
    setTrades(tu);
    try { localStorage.setItem('mstr:trades', JSON.stringify(tu)); } catch (e) {}
  };

  const deletePosition = (id) => {
    const updated = positions.filter(p => p.id !== id);
    setPositions(updated);
    try { localStorage.setItem('mstr:positions', JSON.stringify(updated)); } catch (e) {}

  // ============ BACKUP / RESTORE ============
  const [importText, setImportText] = useState('');

  const buildExportPayload = () => ({

    trades, snapshots, positions,

        if (s.manualBuyHigh !== undefined) setManualBuyHigh(s.manualBuyHigh);

    } catch (e) { setImportResult({ ok: false, msg: `Import failed: ${e.message}` }); }

  const deleteSnapshot = (date) => {

  // ============ STYLES ============
  const colors = { bg: '#0a0806', panel: '#14100c', border: '#2a2520', text: '#d4c8b8', textDim: '#a89580', textMute: '#8a7a65', textFaint: '#5a5048', gold: '#d4a017', red: '#c73e1d', green: '#2d8659', highlight: '#e8dcc8' };

        </div>

    </div>
  );

  // CR2: NumberInput — parent onChange deferred to blur/Enter only
  const NumberInput = ({ value, onChange, step, label, suffix = '', precision = 0, min, max }) => {
    const [editValue, setEditValue] = useState(String(value));
    const [isFocused, setIsFocused] = useState(false);
    useEffect(() => { if (!isFocused) setEditValue(String(value)); }, [value, isFocused]);

    const commit = (raw) => {
      if (raw === '' || raw === '-' || raw === '.' || raw === '-.') { onChange(0); setEditValue('0'); return; }
      const cleaned = raw.replace(/^(-?)0+(\d)/, '$1$2');
      const n = Number(cleaned);
      if (!Number.isNaN(n)) {
        let bounded = n;
        if (min !== undefined) bounded = Math.max(min, bounded);
        if (max !== undefined) bounded = Math.min(max, bounded);
        const final = Number(bounded.toFixed(precision));
        onChange(final); setEditValue(String(final));
      } else { setEditValue(String(value)); }
    };

    const adjust = (delta) => {
      let next = Number(value) + delta;
      if (min !== undefined) next = Math.max(min, next);
      if (max !== undefined) next = Math.min(max, next);
      const final = Number(next.toFixed(precision));
      onChange(final); setEditValue(String(final));
    };

    return (
      <div style={{ marginBottom: '14px', minWidth: 0 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px', alignItems: 'center' }}>

            onFocus={(e) => { setIsFocused(true); e.target.select(); }}
            onBlur={() => { setIsFocused(false); commit(editValue); }}
            onChange={(e) => { const raw = e.target.value; if (/^-?\d*\.?\d*$/.test(raw)) setEditValue(raw); }}
            onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
            style={{ flex: 1, minWidth: 0, background: colors.bg, border: `1px solid ${colors.border}`, color: colors.gold, padding: '8px 12px', fontFamily: serif, fontSize: '15px', fontWeight: 600, textAlign: 'center', boxSizing: 'border-box' }}
          />
          <button onClick={() => adjust(step)} style={{ width: '40px', flexShrink: 0, background: colors.bg, border: `1px solid ${colors.border}`, color: colors.gold, fontFamily: serif, fontSize: '16px', cursor: 'pointer' }}>+</button>
        </div>
      </div>
    );

    <div style={{ fontSize: '11px', letterSpacing: '0.2em', color: colors.textDim, textTransform: 'uppercase', marginBottom: '16px', borderBottom: `1px solid ${colors.border}`, paddingBottom: '8px', fontFamily: serif }}>{children}</div>
  );

    <button onClick={() => setView(id)} style={{ background: view===id ? colors.panel : 'transparent', color: view===id ? colors.gold : (secondary ? colors.textMute : colors.textDim), border: `1px solid ${view===id ? colors.gold : colors.border}`, padding: secondary ? '5px 10px' : '8px 14px', fontFamily: serif, fontSize: secondary ? '10px' : '11px', letterSpacing: '0.1em', textTransform: 'uppercase', cursor: 'pointer', flex: 1, fontWeight: view===id ? 600 : 400, transition: 'all 0.15s', borderRadius: '2px' }}>{label}</button>
  );

  // ============ RENDER ============
  return (
    <div style={{ minHeight: '100vh', background: `linear-gradient(180deg, ${colors.bg} 0%, ${colors.panel} 100%)`, padding: '24px 16px', fontFamily: serif, color: colors.text }}>
      <div style={{ maxWidth: '720px', margin: '0 auto' }}>

        {/* HEADER */}
        <div style={{ marginBottom: '24px', borderBottom: `1px solid ${colors.border}`, paddingBottom: '20px' }}>
          <div style={{ fontSize: '10px', letterSpacing: '0.3em', color: colors.textMute, textTransform: 'uppercase', marginBottom: '8px' }}>Cycle Decision Framework · v14.4</div>
          <h1 style={{ fontSize: '26px', fontWeight: 400, color: colors.highlight, margin: 0, fontStyle: 'italic' }}>MSTR Rotation</h1>
          <h2 style={{ fontSize: '14px', fontWeight: 400, color: colors.textDim, margin: '4px 0 12px 0', letterSpacing: '0.05em' }}>Rotate · Hoard · Deploy</h2>
          <div style={{ display: 'flex', gap: '16px', flexWrap: 'wrap', fontSize: '12px', marginTop: '12px', alignItems: 'center' }}>
            <div><span style={{ color: colors.textMute }}>BTC </span><span style={{ color: colors.gold }}>${btcPrice.toLocaleString()}</span></div>
            <div><span style={{ color: colors.textMute }}>MSTR </span><span style={{ color: colors.gold }}>${mstrPrice.toFixed(2)}</span></div>
            <div><span style={{ color: colors.textMute }}>200MA </span><span style={{ color: colors.gold }}>{ma200 ? `$${ma200.toFixed(2)}` : '—'}</span></div>
            {/* BF2: Header mNAV — shows recomputedMnav with override badge if parsedMnav diverges beyond tolerance */}
            <div style={{ color: colors.textMute }}>
              mNAV{' '}
              <span style={{ color: mNavTone(headerMnavInfo.value) }}>
                {headerMnavInfo.value ? `${headerMnavInfo.value.toFixed(2)}x` : '—'}
